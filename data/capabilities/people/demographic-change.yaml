id: demographic-change
title: A population that can carry the climb
domain: people
stage: k09
needs: [longevity-medicine]
summary: >-
  The world's population is expected to peak this century and then shrink, and it is ageing fast.
  Growth has come from more people finding more ideas, so a shrinking population could slow the
  climb just when it needs the most minds, while more of the people alive will be old and need care.
  The climb has to make the most of every person at every age, and make it easier for people who
  want children to have them.
target: >-
  Societies where the gap between the children people want and the children they have closes,
  where people stay healthy and can do valued work for as long as they wish, and where the number
  of full-time researchers keeps rising as the population levels off: every region at least at
  Europe's 2018 density of about 3,400 researchers per million people, which for 10 billion people
  is about 34 million researchers, nearly four times the world's 2018 total.
exists:
  - text: The UN's World Population Prospects 2024 expects the world's population to peak at around 10.3 billion in the mid-2080s, up from 8.2 billion in 2024, with people aged 65 and over reaching 2.2 billion by the late 2070s.
    url: https://desapublications.un.org/file/20622/download
    year: 2024
  - text: The Global Burden of Disease forecast in The Lancet in March 2024 found that 155 of 204 countries will have fertility too low to sustain their populations by 2050, and 198 by 2100.
    url: https://www.healthdata.org/news-events/newsroom/news-releases/lancet-dramatic-declines-global-fertility-rates-set-transform
    year: 2024
  - text: In a 2025 UNFPA and YouGov survey of 14 countries, nearly 20 percent of adults of reproductive age expected not to have the number of children they want, and 39 percent said money had limited or would limit their family size.
    url: https://www.unfpa.org/swp2025
    year: 2025
  - text: Jones showed in 2022 that in standard growth models a shrinking population makes living standards stagnate rather than grow, because fewer people find fewer new ideas.
    url: https://doi.org/10.1257/aer.20201605
    year: 2022
  - text: In a 2004 pilot trial of Experience Corps in Baltimore, 128 volunteers aged 60 to 86 who worked in primary schools became more active and stronger and had more people to turn to than controls.
    url: https://doi.org/10.1093/jurban/jth094
    year: 2004
gap: >-
  No policy has reliably closed the gap between the family sizes people want and the ones they
  have; in UNFPA's survey two people in five said money stood in the way. Few societies use the
  skills of people past retirement age. And the world had about 1,370 researchers per million
  people in 2018, two-fifths of Europe's density, while Sub-Saharan Africa had about 124. Nobody
  yet plans for an economy where ideas must keep growing while the number of people stops.
inventions: [climb-corps, neighbourhood-nursery]
scene:
  kind: network
  focus: The world's people by age, older people linked to the young they care for and to the work they still do.
