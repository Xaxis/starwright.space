id: global-research-talent
title: Finding every inventor
domain: people
stage: k08
needs: [universal-education]
summary: >-
  Who becomes an inventor depends more on where a child grows up than on how able they are.
  Children with the same gifts are far less likely to become scientists or inventors if they are
  born poor, or in a country with few labs. The climb needs every mind it can find, so finding and
  backing talent everywhere is one of the cheapest ways to make it go faster.
target: >-
  Every child with a gift for science or engineering, anywhere, found by age 14 and given the
  mentors, schooling, money and visas to reach the frontier, so that children of equal tested
  ability are equally likely to become researchers whatever their family's income, and every
  region has at least today's world average of about 1,400 researchers per million people.
exists:
  - text: Bell, Chetty and colleagues found that US children from the richest 1 percent of families are ten times as likely to become inventors as children from below-median families, a gap that persists among children with similar maths scores.
    url: https://www.nber.org/papers/w24062
    year: 2019
  - text: Agarwal and Gaule found that International Mathematical Olympiad participants from low-income countries produce 34 percent fewer publications and 56 percent fewer citations than equally talented peers from rich countries.
    url: https://doi.org/10.1257/aeri.20190457
    year: 2020
  - text: The world had 8.854 million full-time-equivalent researchers in 2018, according to the UNESCO Science Report 2021.
    url: https://www.unesco.org/reports/science/2021/en/statistics
    year: 2018
  - text: Sub-Saharan Africa had about 124 full-time-equivalent researchers per million people in 2018, against 1,368 for the world as a whole.
    url: https://www.unccd.int/sites/default/files/library/1744_unesco_science_report_2021_summary_eng.pdf
    year: 2018
  - text: Rise, started in 2019 by Schmidt Futures and the Rhodes Trust with a billion-dollar commitment from Eric and Wendy Schmidt, chooses 100 teenagers a year from around the world for lifelong support.
    url: https://www.risefortheworld.org/about-rise/
    year: 2019
  - text: The International Mathematical Olympiad, first held in 1959, had 110 national teams in 2025.
    url: https://www.imo-official.org/results/team/year/2025/
    year: 2025
  - text: A US proclamation of September 2025 restricts entry on new H-1B skilled-worker visas unless the petition comes with a 100,000 dollar payment.
    url: https://www.whitehouse.gov/presidential-actions/2025/09/restriction-on-entry-of-certain-nonimmigrant-workers/
    year: 2025
gap: >-
  Olympiads and scholarships find thousands of children a year, and Rise picks 100. The top one
  percent of the world's children is tens of millions, and most of them live where no search
  reaches. Those who are found often lack money, mentors and visas: an olympiad contestant from a
  poor country publishes a third less than an equal from a rich one, and the main US visa for
  skilled workers now carries a 100,000 dollar charge on each new petition.
inventions: [open-olympiad]
scene:
  kind: network
  focus: Points of talent lighting up on every continent, each linked to a mentor as it is found.
  params: { shape: globe, nodes: 4000, clusters: 40, links: 0.2, pulses: 0.5 }
