id: abundant-food
title: Plenty of food on less land
domain: food
stage: k08
needs: [programmable-biology, engineered-photosynthesis, precision-fermentation, cellular-agriculture, vertical-farming]
summary: >-
  Feeding everyone well is the oldest problem, and today it eats half the world's habitable land and
  a quarter of its greenhouse-gas emissions. A civilization that uses a hundred times more energy can
  make food a solved problem: grow more on less land with better crops and controlled environments,
  make protein in tanks instead of on pasture, and give the land back to forest and wild. Abundance
  on Earth, which the model reaches in {year-k08}, means no one is short of good food.
target: >-
  Produce a rich, varied diet for everyone on a steadily shrinking footprint of land and water, so
  that calories and protein are abundant and cheap while the roughly 44 percent of habitable land now
  farmed, pasture most of all, falls back toward a fraction of that and returns to nature.
exists:
  - text: World cereal yield reached 4.21 tonnes per hectare in 2024, part of a long rise that has fed a growing population without matching growth in cropland.
    url: https://ourworldindata.org/grapher/cereal-yield
    year: 2024
  - text: Agriculture uses about 44 percent of the world's habitable land, and livestock takes 80 percent of farmland while supplying only 17 percent of calories and 38 percent of protein, so freeing pasture is the largest prize.
    url: https://ourworldindata.org/global-land-for-agriculture
    year: 2024
  - text: The FAO reckons about 673 million people faced hunger in 2024 and 2.6 billion could not afford a healthy diet, so abundance means cost and access, not calories alone.
    url: https://www.fao.org/newsroom/detail/beating-hunger-through-social-protection--investments-and-resilience--fao-chief-economist/en
    year: 2024
  - text: Engineered photosynthesis, a fix to the wasteful photorespiration pathway, raised biomass by more than 40 percent in field-trialled tobacco, a lever to grow more on the same ground.
    url: https://doi.org/10.1126/science.aat9077
    year: 2019
  - text: Yield growth in the major crops runs well below the 2.4 percent a year needed to double production by 2050; maize gains about 1.6 percent, rice 1.0, wheat 0.9 and soybean 1.3.
    url: https://doi.org/10.1371/journal.pone.0066428
    year: 2013
  - text: Solar Foods' Factory 01 makes single-cell protein from carbon dioxide, hydrogen and air, reaching its design capacity of about 160 tonnes a year in 2025, showing food can be made with almost no land at all.
    url: https://solarfoods.com/factory/
    year: 2025
gap: >-
  Yield growth is slowing for major crops, below the pace needed to feed 2050 on today's land, pasture
  for meat is the largest single use of land, and the new routes, better photosynthesis, fermentation,
  controlled-environment and cultured food, are each either early, costly or small. No region yet feeds
  itself well while shrinking its farmland; doing so needs all these routes at once and at low cost.
inventions: []
scene:
  kind: globe
  focus: Farmland shrinking as yields rise, with forest and grassland returning around the fields.
  params: { green: 0.7, look: farms }
