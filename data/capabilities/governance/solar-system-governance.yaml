id: solar-system-governance
title: Governing a civilization across worlds
domain: governance
stage: planet
needs: [interworld-disputes, space-commons, long-term-stewardship]
summary: >-
  By {year-planet} industry spans the inner solar system and people live on several worlds and in
  many habitats. Light takes minutes to hours to cross it, so no capital can run it all in real time,
  and communities that far apart will want to run their own affairs. The climb needs a form of
  government that lets each world decide what affects only itself, keeps shared things shared, and
  holds together for centuries.
target: >-
  A federation of worlds and habitats in which each decision is taken at the smallest level that can
  take it in time, shared resources such as orbits and sunlight are governed jointly, every member is
  heard, and the rules can be amended without a war.
exists:
  - text: Elinor Ostrom won the 2009 Nobel prize in economics for showing how communities govern shared resources themselves, often through many overlapping centres of decision rather than one.
    url: https://www.nobelprize.org/prizes/economic-sciences/2009/ostrom/facts/
    year: 2009
  - text: The Antarctic Treaty of 1959 has governed a whole continent without sovereignty for over sixty years; it had 58 parties in 2026, 29 of them with a vote.
    url: https://www.ats.aq/devAS/e/Parties
    year: 2026
  - text: The International Seabed Authority, with 172 members in 2026, governs the deep seabed beyond national waters as the common heritage of humankind and has signed exploration contracts with 22 contractors.
    url: https://isa.org.jm/exploration-contracts/
    year: 2026
  - text: The Treaty on European Union makes subsidiarity a rule of law, letting the Union act only where its member states cannot achieve an aim well enough themselves.
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:12016M005
    year: 2016
  - text: The International Telecommunication Union, which coordinates radio spectrum and satellite orbits worldwide, had 194 member states in 2026.
    url: https://www.itu.int/en/about/Pages/membership.aspx
    year: 2026
gap: >-
  Every working model of shared government, from federations to the EU to the Antarctic Treaty,
  assumes members can meet and talk in real time. Nobody has designed, let alone tested, a
  constitution whose members are minutes to hours apart, where a vote in one place is old news by
  the time it reaches another.
inventions: [light-time-constitution]
scene:
  kind: network
  focus: Worlds and habitats as clusters around the Sun, each running its own affairs, linked by the few decisions they share.
  params: { shape: system, nodes: 1500, clusters: 24, links: 0.35, pulses: 0.5 }
