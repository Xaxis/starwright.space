id: machine-swarm-network
title: Talking to a trillion machines
domain: information
stage: k15
needs: [interplanetary-network]
summary: >-
  The swarm of {year-k15} is built from collectors by the trillion, each a film of
  {collector-density} orbiting {swarm-radius} from the Sun. Every one must be told where to point
  and must say when it fails. A radio and a computer on each could weigh more than its film. The
  network that runs the swarm has to cost almost nothing per node: no radio, almost no power, and no
  central switch that every message must pass through.
target: >-
  Commands to and status from every collector in a swarm of 10^12 or more, about 10 bit/s each and
  10 Tbit/s in all, with each node's communication hardware weighing under 1 percent of its film,
  and routing that keeps working with no single centre.
exists:
  - text: The largest constellation so far, Starlink, had 11,195 satellites in orbit on 26 November 2026, each a full spacecraft with its own radios and computers.
    url: https://planet4589.org/space/con/star/stats.html
    year: 2026
  - text: IPv6, specified in RFC 8200 in 2017, gives 128-bit addresses, enough to number every collector of a swarm many times over.
    url: https://www.rfc-editor.org/info/rfc8200/
    year: 2017
  - text: Wang, Tsonev, Videv and Haas showed in 2015 that a solar panel can receive optical data while it harvests energy, so the power cell is also the receiver.
    url: https://doi.org/10.1109/JSAC.2015.2391811
    year: 2015
  - text: JAXA's IKAROS, launched on 21 May 2010 with a 14 m square sail, made power from thin-film solar cells on the sail and was steered by LCD devices in it, a film whose reflection is set by voltage alone.
    url: https://www.isas.jaxa.jp/en/missions/spacecraft/past/ikaros.html
    year: 2010
  - text: NASA's Starling mission flies four CubeSats in low orbit testing technologies that let spacecraft work together as a swarm without resources from the ground.
    url: https://www.nasa.gov/mission/starling/
    year: 2023
gap: >-
  The largest fleet ever run is 11,195 spacecraft, about 90 million times short of 10^12, and every
  one of them carries its own radio and computer. Solar cells have received data in laboratories
  and sails have changed their reflectance in space, but no film has done both as a network node.
  Addressing, routing and fault reports for 10^12 nodes, light-minutes from their controllers, are
  unsolved.
inventions: [glint-link]
scene:
  kind: network
  focus: A swarm of collectors winking in sequence as a command sweeps across it.
  params: { shape: system, nodes: 5000, clusters: 40, links: 0.2, pulses: 0.9 }
