id: machine-swarm-network
title: Talking to a trillion machines
domain: information
stage: k15
needs: [interplanetary-network]
summary: >-
  The swarm of {year-k15} is built from collectors by the trillion, each a film of
  {collector-density} orbiting {swarm-radius} from the Sun. Every one must be told where to point
  and must say when it fails. A radio and a computer on each could weigh more than its film. The
  network that runs the swarm has to cost almost nothing per node: no radio, almost no power, and no
  central switch that every message must pass through.
target: >-
  Commands to and status from every collector in a swarm of trillions, a few bits a second each,
  with each node's communication hardware weighing less than a hundredth of its film, and routing
  that keeps working with no single centre.
exists:
  - text: The largest constellation so far, Starlink, had about 11,200 satellites in orbit in November 2026, each a full spacecraft with its own radios and computers.
    url: https://planet4589.org/space/con/star/stats.html
    year: 2026
  - text: IPv6, specified in RFC 8200 in 2017, gives 128-bit addresses, enough to number every collector of a swarm many times over.
    url: https://www.rfc-editor.org/info/rfc8200/
    year: 2017
  - text: Wang, Tsonev, Videv and Haas showed in 2015 that a solar panel can receive optical data while it harvests energy, so the power cell is also the receiver.
    url: https://doi.org/10.1109/JSAC.2015.2391811
    year: 2015
  - text: JAXA's IKAROS sail turned itself in 2010 by switching the reflectance of 80 liquid crystal panels in its film, a reflectance set by voltage alone.
    url: https://en.wikipedia.org/wiki/IKAROS
    year: 2010
  - text: A modulating retro-reflector sends data by modulating a distant laser's own beam back to it, so the far end carries no laser.
    url: https://en.wikipedia.org/wiki/Modulating_retro-reflector
    year: 2026
gap: >-
  No fleet larger than about ten thousand spacecraft has ever been run, and every one of those
  carries its own radio and computer. Solar cells have received data in laboratories and sails have
  changed their reflectance in space, but no film has done both as a network node. Addressing,
  routing and fault reports for trillions of nodes, light-minutes from their controllers, are
  unsolved.
inventions: [glint-link]
scene:
  kind: network
  focus: A swarm of collectors winking in sequence as a command sweeps across it.
  params: { shape: system, nodes: 5000, clusters: 40, links: 0.2, pulses: 0.9 }
