id: stellar-lens-link
title: Links to other stars through the Sun's lens
domain: information
stage: sun
needs: [interplanetary-network, solar-system-navigation, beamed-propulsion]
summary: >-
  The Sun's gravity bends light like a lens and brings it to a focus from about 550 AU outward,
  billions of times brighter than a telescope sees it directly. A craft on that focal line could
  image the planets of another star, and could talk to a probe there with a tiny transmitter. Once
  the swarm has caught the Sun's light, after {year-type-2}, the climb reaches for other stars, and
  this lens is its first instrument.
target: >-
  A relay on the Sun's focal line toward a nearby star, beyond 550 AU and reached within 25 years of
  launch, that can image that star's planets, receive a probe's signal from there and pass it home
  through the interplanetary network.
exists:
  - text: Von Eshleman showed that the Sun's gravity focuses radiation from a distant source along a line that starts about 550 times the Sun-Earth distance out, with a peak gain for coherent radiation of 100 million at 1 mm wavelength, so a craft there could communicate across interstellar distances with equipment the size of today's, though the solar corona would limit it.
    url: https://doi.org/10.1126/science.205.4411.1133
    year: 1979
  - text: A NASA NIAC study led by Slava Turyshev reported in 2020 that the lens gives a light amplification of about 10^11, so a 1 m telescope there could map an exoplanet 30 parsecs away at 10 km resolution, reached by small solar-sail craft.
    url: https://arxiv.org/abs/2002.11871
    year: 2020
  - text: Voyager 1, the farthest spacecraft, reached one light-day from Earth, about 25.9 billion km or 173 AU, on 18 November 2026, after more than 49 years of flight.
    url: https://www.nasa.gov/news-release/nasas-voyager-1-makes-history-reaching-one-light-day-from-earth/
    year: 2026
  - text: At closest approach Parker Solar Probe moves around the Sun at about 700,000 km/h, some 194 km/s.
    url: https://science.nasa.gov/mission/parker-solar-probe/
    year: 2026
  - text: Breakthrough Starshot studies ultra-light probes on light sails, pushed by a light beamer on the ground, to reach Alpha Centauri.
    url: https://breakthroughinitiatives.org/initiative/3
    year: 2016
gap: >-
  Voyager 1, the farthest craft, took 49 years to reach 173 AU, under a third of the way to the
  focal line; at its pace a relay would need more than 150 years. Getting there in 25 years means
  leaving the solar system at about 22 AU a year, about 100 km/s, six times Voyager's speed; Parker
  Solar Probe reaches 194 km/s, but only while falling past the Sun, not while leaving it. The
  Einstein ring lies on top of the solar corona, which is far brighter, so a faint signal must be
  pulled out of glare. The relay must find and hold the narrow line toward one star while it drifts
  outward. And a link needs a transmitter at the other end.
inventions: [focal-line-relay]
scene:
  kind: machine
  focus: A small telescope far beyond the planets, looking back at the Sun ringed by another star's light.
  params: { shape: telescope, spin: 0.1 }
