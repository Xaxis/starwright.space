id: cislunar-network
title: A network around the Moon
domain: information
stage: k09
needs: [laser-backbone]
summary: >-
  Industry on the Moon needs what industry on Earth takes for granted: data, position and time, all
  day, at the poles and on the far side. Today each mission brings its own radio and talks to Earth
  through a few big dishes. A shared network around the Moon, with relay satellites, laser links to
  Earth and navigation signals, lets landers, rovers and mass drivers work like machines on one
  factory floor.
target: >-
  Continuous broadband and positioning across the whole Moon, the far side and the polar craters
  included, through relay satellites and surface towers that any mission can join, linked to Earth
  by laser at gigabits per second.
exists:
  - text: The Lunar Laser Communication Demonstration on NASA's LADEE set a downlink record of 622 megabits per second from lunar orbit in 2013.
    url: https://en.wikipedia.org/wiki/Lunar_Laser_Communication_Demonstration
    year: 2013
  - text: Artemis II, launched on 1 April 2026 with four crew, tested O2O, a laser terminal on Orion that sent data to Earth at up to 260 megabits per second.
    url: https://en.wikipedia.org/wiki/Artemis_II
    year: 2026
  - text: NASA's LunaNet architecture sets out a lunar network that industry, academia and partners can build nodes for, offering networking, navigation, detection and science services.
    url: https://www.nasa.gov/humans-in-space/lunanet-empowering-artemis-with-communications-and-navigation-interoperability/
    year: 2021
  - text: ESA's Lunar Pathfinder, a relay satellite built by SSTL, is due to launch no earlier than 2027 as the precursor of the Moonlight constellation.
    url: https://en.wikipedia.org/wiki/Lunar_Pathfinder
    year: 2026
gap: >-
  There is no network at the Moon yet, only plans, single relays and tests. The far side and the
  polar craters never see Earth. Position on the surface comes from tracking by dishes on Earth,
  and the shared standards are still drafts. Nobody yet runs relays that sell service to every
  mission, the way phone towers do.
inventions: []
scene:
  kind: moon
  focus: Relay satellites over the Moon's poles linking bases on the near side and the far side.
  params: { bases: 0.4, telescopes: true }
