id: solar-system-navigation
title: Clocks and navigation across the solar system
domain: information
stage: type-1
needs: [cislunar-network]
summary: >-
  On Earth, GPS gives every machine its place and its time. Beyond Earth orbit, a ship finds where
  it is by asking Earth: big dishes time the round trip of its radio signal and send a fix back,
  minutes or hours later. Time itself runs at different rates on different worlds, because gravity
  and speed set how fast a clock ticks. An industry spread across the inner system by
  {year-type-1} needs every ship and factory to know where and when it is, on its own.
target: >-
  Any craft anywhere in the inner solar system fixes its own position to metres and its time to
  nanoseconds within minutes, from beacons and its own clock, with no call to Earth; and one agreed
  set of time scales for every world.
exists:
  - text: NASA's Deep Space Atomic Clock, a mercury-ion clock launched in 2019, ran for more than a year in orbit with a stability of 3 parts in 10^15 over 23 days, up to ten times better than earlier space clocks.
    url: https://www.nature.com/articles/s41586-021-03571-7
    year: 2021
  - text: In November 2017 NASA's SEXTANT experiment on the ISS timed X-ray pulses from four millisecond pulsars and fixed its own position to within 10 miles, with no help from Earth.
    url: https://www.nasa.gov/centers-and-facilities/goddard/nasa-team-first-to-demonstrate-x-ray-navigation-in-space/
    year: 2018
  - text: In April 2024 the White House asked NASA to set up a Coordinated Lunar Time by 2026; a clock on the Moon gains about 58.7 microseconds a day on one on Earth.
    url: https://en.wikipedia.org/wiki/Coordinated_Lunar_Time
    year: 2024
  - text: A strontium optical lattice clock at JILA reached a total systematic uncertainty of 8.1 parts in 10^19 in 2024, the lowest of any clock.
    url: https://arxiv.org/abs/2403.10664
    year: 2024
  - text: NASA's Deep Space Network tracks and steers interplanetary missions from three sites, Goldstone, Madrid and Canberra, each with one 70 m dish and several 34 m ones.
    url: https://www.nasa.gov/communicating-with-missions/dsn/
    year: 2026
gap: >-
  Deep-space navigation still hangs on a few dishes on Earth, which are oversubscribed and answer
  only after the light delay. Clocks in space lag far behind the best on the ground. Pulsar
  navigation fixes a position to kilometres, not metres. There is no beacon network beyond
  Earth's satellite navigation, and the time scales for the Moon and Mars are still being agreed.
inventions: [clockwork-beacons]
scene:
  kind: network
  focus: Beacons spread across the inner solar system, each pulse of light a tick of its clock.
  params: { shape: system, nodes: 40, clusters: 8, links: 0.3, pulses: 1 }
