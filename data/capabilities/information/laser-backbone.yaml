id: laser-backbone
title: Laser links that carry the network through space
domain: information
stage: k09
needs: [universal-connectivity, cheap-launch]
summary: >-
  Radio between spacecraft is running short of spectrum and of rate. A laser beam spreads
  thousands of times less than a radio beam from an antenna of the same size, so the same power
  delivers far more bits over the same distance, and a beam a few hundred metres wide needs no
  spectrum licence. Laser links already tie constellations together and have carried hundreds of
  gigabits a second to the ground. The space industry of {year-k09} needs them as its backbone,
  from low orbit to the Moon.
target: >-
  A laser backbone joining the ground, low orbit, geostationary relays and the Moon at 1 Tbit/s or
  more per link, available 99.9 percent of the time because enough ground stations or relays sit
  above or beyond the clouds, with terminals under 5 kg, cheap and light enough to fly on every
  satellite and factory.
exists:
  - text: On 28 April 2023 NASA's TBIRD, a 3U payload about the size of a tissue box on the PTD-3 CubeSat, sent data to the ground at 200 Gbit/s, enough for several terabytes in one six-minute pass.
    url: http://www.nasa.gov/feature/ames/tbird-milestone
    year: 2023
  - text: NASA's Laser Communications Relay Demonstration works from geosynchronous orbit, 22,000 miles up, as a platform for laser relay tests, with ILLUMA-T on the space station sending to it for relay to the ground.
    url: http://www.nasa.gov/feature/goddard/2023/nasa-s-laser-communications-relay-a-year-of-experimentation
    year: 2023
  - text: 11,195 Starlink satellites were in orbit on 26 November 2026, out of 13,122 launched.
    url: https://planet4589.org/space/con/star/stats.html
    year: 2026
  - text: The US Space Development Agency's Transport Layer is planned as a mesh of communication satellites in low orbit joined to each other, to other spacecraft and to ground stations by optical intersatellite links.
    url: https://www.sda.mil/home/about-us/faq/
    year: 2026
gap: >-
  Today's laser links are demonstrations or one operator's private mesh. The fastest link to the
  ground, TBIRD's 200 Gbit/s, is a fifth of the 1 Tbit/s target and works only in passes of about 6
  minutes over one station. Clouds block lasers to the ground, so a backbone needs many stations or
  relays above the weather. A 10 cm telescope at 1,550 nm throws a beam about 15 microradians wide,
  15 m across at 1,000 km, and it must stay on a craft moving at kilometres a second. Terminals are
  costly, those from different makers rarely talk to each other, and deep-space links still collect
  too few photons for the rates an industry needs.
inventions: [photon-bucket-relay]
scene:
  kind: orbit
  focus: Beams of light stitched between satellites and down to the ground.
  params: { stations: 0.7, beams: true }
