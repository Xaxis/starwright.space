id: propellant-depots
title: Refuelling in orbit
domain: space
stage: k09
needs: [cheap-launch]
summary: >-
  A rocket that reaches orbit full of payload arrives nearly empty of propellant. Everything that
  goes further, from landers for the Moon to ships for Mars, must fill up in orbit first. Depots
  store cryogenic propellant for months without losing it to the Sun's heat, and later they take
  their oxygen from the Moon instead of from Earth.
target: >-
  Depots in low Earth orbit and lunar orbit holding over 1,000 tonnes of liquid oxygen and methane or
  hydrogen, losing under 0.1 percent a day to boil-off, transferring it between vehicles as routinely
  as an airport fuels aircraft, and filled mostly with oxygen made on the Moon.
exists:
  - text: In October 2020 NASA's Tipping Point awards gave $53.2 million to SpaceX, $86.2 million to ULA, $27 million to Eta Space and $89.7 million to Lockheed Martin for cryogenic fluid management in space.
    url: https://www.nasa.gov/news-release/nasa-announces-partners-to-advance-tipping-point-technologies-for-the-moon-mars
    year: 2020
  - text: SpaceX's 2020 award was to show the transfer of 10 tonnes of liquid oxygen between tanks on a Starship.
    url: https://spaceflightnow.com/2020/10/16/nasa-selects-companies-to-demonstrate-in-space-refueling-and-propellant-depot-tech/
    year: 2020
  - text: Starship's third flight, on 14 March 2024, carried out a propellant transfer demonstration for NASA in flight.
    url: https://www.cnbc.com/2024/03/14/spacex-starship-rocket-third-test-flight-launch.html
    year: 2024
  - text: Orbit Fab's Tenzing tanker, launched in June 2021, was the world's first commercial propellant depot.
    url: https://www.orbitfab.com/news/lm-ng-investment/
    year: 2021
  - text: China's Tianzhou 1 freighter made three propellant transfers to the Tiangong 2 laboratory in 2017, and Tianzhou freighters now refuel the Tiangong station.
    url: https://spaceflightnow.com/2017/09/17/chinese-space-station-freighter-concludes-refueling-demo-mission/
    year: 2017
  - text: NASA Glenn reached zero boil-off of liquid oxygen in a ground tank by running a cryocooler at 8.5 watts of lift for 145 watts of input, and cut hydrogen boil-off by about half, the storage technology a depot needs.
    url: https://ntrs.nasa.gov/api/citations/20150000134/downloads/20150000134.pdf
    year: 2014
  - text: Eta Space's LOXSAT, a NASA-backed free-flyer to demonstrate eleven cryogenic fluid management technologies with liquid oxygen, is manifested to launch on an Electron rocket in 2026.
    url: https://www.nasa.gov/directorates/stmd/tech-demo-missions-program/cryogenic-fluid-management-cfm/nasa-industry-prepare-cryogenic-fuel-technology-demo/
    year: 2026
gap: >-
  Cryogenic propellant has not yet passed between two spacecraft; Starship's ship-to-ship
  demonstration slipped to 2027. Zero boil-off has been reached only in ground tanks, not stored in
  orbit for months, and no depot holds propellant made off Earth. The work under way is on the right
  path; what is missing is scale, duration and lunar supply.
inventions: []
scene:
  kind: orbit
  focus: Depots in low orbit, with tankers docking to fill landers bound for the Moon.
  params: { depots: 0.9, stations: 0.2 }
