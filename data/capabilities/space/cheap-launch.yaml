id: cheap-launch
title: Launch at the price of freight
domain: space
stage: k09
needs: [clean-orbits, automated-factories]
summary: >-
  The first industry in space has to come from Earth: seed factories, robots, chips and people.
  At {launch-cost-falcon-9} that is a luxury, and in 2025 the whole world launched only
  {upmass-2025} of spacecraft. Launch has to become freight: vehicles flown again and again like
  aircraft, at a cost per kilogram set mostly by their propellant.
target: >-
  A cost to low Earth orbit of tens of dollars a kilogram, and tens of thousands of tonnes lifted
  each year, enough to land the first {seed-mass} seed factory on the Moon by {seed-year} and to
  supply the people who run the industry it starts.
exists:
  - text: NASA's Jones found launch cost fell from about $54,500 per kilogram on the Space Shuttle to $2,720 advertised on Falcon 9, a twentyfold drop.
    url: https://ntrs.nasa.gov/citations/20200001093
    year: 2018
  - text: BryceTech counted 325 orbital launches in 2025, carrying about 2.7 million kg of spacecraft, 82 percent of it on SpaceX rockets.
    url: https://brycetech.com/reports/report-documents/global-orbital-activity-2025/BryceTech_Orbital_Launches_2025.pdf
    year: 2025
  - text: By August 2026 one Falcon 9 first stage, B1067, had flown and landed 37 times, the fleet record, since entering service in June 2021.
    url: https://spaceflightnow.com/2026/08/24/live-coverage-spacex-to-launch-starlink-mission-on-a-falcon-boosters-record-breaking-37th-flight/
    year: 2026
  - text: Starship reached orbit for the first time on Flight 14, on 28 September 2026, deploying 26 third-generation Starlink satellites.
    url: https://spaceflightnow.com/2026/09/28/starship-returns-to-earth-rocket-splashes-down-north-of-hawaii-after-three-hour-flight/
    year: 2026
  - text: On Flight 15, on 13 November 2026, the launch tower caught a returning Starship upper stage for the first time, about 22 hours after liftoff.
    url: https://www.cbsnews.com/news/spacex-catch-starship-rocket/
    year: 2026
  - text: Blue Origin's New Glenn landed its first stage for the first time on 13 November 2025, on its second flight, after launching NASA's ESCAPADE Mars probes.
    url: https://www.space.com/space-exploration/launches-spacecraft/blue-origin-lands-huge-new-glenn-rocket-booster-for-1st-time-after-acing-mars-escapade-launch-for-nasa
    year: 2025
gap: >-
  No vehicle is yet fully reusable in service: Falcon 9 still throws away its upper stage, and
  Starship has only begun to bring its own back. Freight prices need hundreds of flights from each
  vehicle, turnarounds of hours, and launch sites and airspace that handle thousands of flights a
  year. Even then a chemical rocket spends most of its mass on propellant.
inventions: [noon-beam-launcher, balanced-rotovator]
scene:
  kind: launch
  focus: Reusable rockets leaving Earth one after another, as often as aircraft take off.
  params: { method: rocket, cadence: 0.8, world: earth }
