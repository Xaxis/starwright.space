id: mass-drivers
title: Mass drivers that throw cargo off a world
domain: space
stage: type-1
needs: [lunar-industry, self-replicating-factory, breakthrough-funding]
summary: >-
  Rockets spend most of their mass on propellant. A mass driver is an electric launcher instead: a
  track of coils that speeds a payload up to escape speed using only electricity. On the Moon, with
  no air and a sixth of Earth's gravity, it can throw rock to the factories at L5 or L2 for the cost
  of the sunlight that powers it, and nothing is used up.
target: >-
  Mass drivers on the Moon, and later on Mercury and the asteroids, each launching millions of
  tonnes a year with aim precise enough to be caught, so that an industry doubling every
  {doubling-time} is never short of raw mass.
exists:
  - text: O'Neill and Kolm's team built the first mass driver model, the wood-sided MD1, at MIT in 1976 and 1977, reaching about 33 gravities of acceleration.
    url: https://ssi.org/mass-drivers-from-the-ones-who-actually-made-the-real-ones/
    year: 1977
  - text: NASA's 1977 Ames summer study, published as SP-428 in 1979, designed a lunar mass driver launching material at up to 600,000 metric tons a year, with payloads carried in buckets that are slowed and returned.
    url: https://ntrs.nasa.gov/citations/19790024054
    year: 1979
  - text: SpinLaunch's suborbital accelerator, a vacuum chamber 33 m across that spins a projectile and releases it, first flew in October 2021 at Spaceport America.
    url: https://spacenews.com/spinlaunch-conducts-first-test-of-suborbital-accelerator-at-spaceport-america/
    year: 2021
  - text: USS Gerald R. Ford became the first ship to launch aircraft with the US Navy's electromagnetic catapult, EMALS, in 2017; its 91 m linear induction motor takes a 45,000 kg aircraft to 130 knots, about 67 m/s, on up to 484 MJ released from four disk alternators in 2 to 3 seconds.
    url: https://www.electronicdesign.com/technologies/power/article/21199416/carrier-based-launch-of-aircraft-to-use-power-electronics-instead-of-steam-catapult
    year: 2017
  - text: The US Navy proposed suspending its electromagnetic railgun in its 2022 budget, ending nearly two decades of work without a fielded weapon.
    url: https://www.everycrsreport.com/reports/R44175.html
    year: 2021
  - text: The French-German research institute ISL ran the first outdoor free-flight test of its electromagnetic railgun in June 2026, sending a 25 mm projectile past Mach 5 on a launch energy in the 1 megajoule class, so work on fast electric launchers goes on in Europe.
    url: https://www.armyrecognition.com/news/army-news/2026/european-electromagnetic-railgun-isl-outdoor-free-flight-test
    year: 2026
gap: >-
  Launchers in regular service reach aircraft speeds, about 67 m/s on EMALS; lunar escape needs 2.4
  km/s, more than thirty times more. A research railgun has passed Mach 5, about 1.7 km/s, but with
  a 25 mm projectile on about 1 MJ, while a driver feeding millions of tonnes a year must throw
  about 30 kg every second without pause. Nobody has built a driver hundreds of metres long, held its aim to within metres over tens of
  thousands of kilometres, or caught its payloads at the far end. O'Neill's buckets must be braked and
  sent back after every shot, which halves a track's use and puts the most complex part where the
  forces are greatest.
inventions: [iron-jacket-driver]
scene:
  kind: launch
  focus: A track of coils across the lunar plain, throwing slugs of rock into the black.
  params: { method: mass-driver, cadence: 0.9, world: moon }
