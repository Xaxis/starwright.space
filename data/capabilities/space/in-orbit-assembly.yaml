id: in-orbit-assembly
title: Building large structures in orbit
domain: space
stage: k09
needs: [cheap-launch, automated-factories]
summary: >-
  No rocket fairing holds a collector a kilometre wide or a habitat for thousands. Large things in
  space must be built there, by robots joining parts launched packed flat or made in orbit. The ISS
  showed that people can assemble a station over a decade of spacewalks. The climb needs robots that
  build far larger structures in weeks, with no one on site.
target: >-
  Robot crews that assemble structures from hundreds of metres to kilometres across out of
  standard parts, each crew adding hundreds of tonnes a year, and that repair and extend what they
  build the same way.
exists:
  - text: The ISS, assembled in orbit over 42 assembly flights, has a mass of 419,725 kg and is 109 m end to end.
    url: https://www.nasa.gov/international-space-station/space-station-facts-and-figures/
    year: 2026
  - text: In NASA's ARMADAS tests, two transport robots and one fastening robot assembled a 256-voxel lattice shelter on their own in 4.2 days of run time (Science Robotics, 2024).
    url: https://ntrs.nasa.gov/api/citations/20230005194/downloads/SciRobotics-ARMADAS_System_Paper_Distribution.pdf
    year: 2024
  - text: NASA reported in January 2024 that the three robots built a shed-sized structure in a little over 100 hours of operation.
    url: https://www.nasa.gov/general/robot-team-builds-high-performance-digital-structure-for-nasa/
    year: 2024
  - text: Northrop Grumman's MEV-1 docked with the Intelsat 901 satellite in February 2020, the first docking between two commercial spacecraft, and gave it five more years of life.
    url: https://news.northropgrumman.com/news/releases/northrop-grumman-achieves-first-ever-undocking-between-two-commercial-spacecraft-in-geosynchronous-orbit
    year: 2020
  - text: NASA cancelled its OSAM-1 servicing and assembly mission in 2024, citing "continued technical, cost, and schedule challenges".
    url: https://www.nasa.gov/mission/on-orbit-servicing-assembly-and-manufacturing-1/
    year: 2024
  - text: Caltech's SSPD-1 unfolded DOLCE, a deployable structure 1.8 m on a side, in orbit in 2023, despite a snagged wire and a jam.
    url: https://www.caltech.edu/about/news/space-solar-power-project-ends-first-in-space-mission-with-successes-and-lessons
    year: 2023
gap: >-
  Robots have assembled structures only on the ground, at the size of a shed, and the flight
  missions that would have tried it in orbit were cancelled. Nothing has been built in orbit
  without astronauts, and there are no standard parts and joints that every robot and supplier
  share. ARMADAS's lattice of identical parts is the most promising path; what is missing is flight
  and scale.
inventions: []
