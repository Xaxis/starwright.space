id: mercury-freight
title: Freight from Mercury to the swarm
domain: transport
stage: k15
needs: [mercury-operations, mass-drivers, asteroid-logistics]
summary: >-
  Mercury's mass drivers can throw rock off the planet, but the swarm's factories orbit
  {swarm-radius} from the Sun, farther out than Mercury. By the vis-viva equation for
  circular orbits, a transfer between the two takes about 63 days and needs about 4.9 km/s to leave
  Mercury's orbit and 4.4 km/s to match the swarm's. Added to Mercury's escape speed of 4.3 km/s,
  the first means a driver launch at about 6.5 km/s; the second must be shed at the far end, and
  that has to happen for most of {swarm-full-mined}.
target: >-
  Freight that carries most of {swarm-full-mined}, more than the whole asteroid belt's
  {asteroid-belt-mass}, from Mercury to the swarm; at the peak, in the last {doubling-time} before
  {year-type-2}, about half of it, near 10^21 kg a year. Loads leave on the drivers at about 6.5
  km/s and brake by sunlight rather than propellant, with under 1 percent of the mass spent as
  propellant and under 0.1 percent lost on the way.
exists:
  - text: ESA and JAXA's BepiColombo, launched on 20 October 2018, used one Earth, two Venus and six Mercury flybys and solar-electric propulsion to put its orbiters into Mercury orbit on 21 November 2026.
    url: https://www.esa.int/Science_Exploration/Space_Science/BepiColombo/BepiColombo_factsheet
    year: 2026
  - text: BepiColombo's transfer module delivered most of its cruise speed change with four 145 mN ion thrusters, run singly and later in pairs, powered by solar arrays of over 40 square metres.
    url: https://pds.nasa.gov/ds-view/pds/viewContext.jsp?identifier=urn%3Aesa%3Apsa%3Acontext%3Ainstrument_host%3Aspacecraft.mtm&version=1.1
    year: 2018
  - text: NASA's MESSENGER, launched in August 2004, needed one Earth, two Venus and three Mercury flybys and entered Mercury orbit in March 2011, nearly seven years later, the first spacecraft to orbit Mercury.
    url: https://science.nasa.gov/mission/messenger/
    year: 2011
  - text: Parker Solar Probe passed 3.8 million miles (6.1 million km) above the Sun's surface on 24 December 2024 at 430,000 miles an hour (192 km/s), and survived.
    url: https://science.nasa.gov/science-research/heliophysics/nasas-parker-solar-probe-makes-history-with-closest-pass-to-sun/
    year: 2024
  - text: Armstrong and Sandberg's 2013 plan for taking Mercury apart spends a tenth of the energy it collects on launching material into space.
    url: https://web.archive.org/web/2023/https://www.fhi.ox.ac.uk/wp-content/uploads/intergalactic-spreading.pdf
    year: 2013
gap: >-
  The two craft to reach Mercury orbit took nearly 7 and just over 8 years, with six and nine
  flybys, and BepiColombo's thrusters push 290 mN at most. Braking 10^21 kg a year by 4.4 km/s takes a steady
  force of about 1.4 × 10^17 N; sunlight at {swarm-radius} pushes a perfect mirror with about 25 µN per
  square metre, so it needs about 5.5 × 10^21 square metres of sail, some 5 percent of the full
  swarm's {swarm-full-area}. No driver has been built on Mercury, and nothing yet catches or
  delivers mass in solar orbit.
inventions: [foil-freight]
scene:
  kind: mercury
  focus: Mercury's drivers flinging mass outward to the swarm's orbits.
  params: { mined: 0.4, drivers: 8 }
