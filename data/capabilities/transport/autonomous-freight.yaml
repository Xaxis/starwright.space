id: autonomous-freight
title: Freight that moves itself
domain: transport
stage: k08
needs: [electric-transport, abundant-compute]
summary: >-
  Freight is held back by drivers as much as by vehicles: they are a large share of the cost and
  must rest. Freight that drives itself can run day and night, in smaller and steadier loads, at the
  lower speeds that save energy. It is also practice for the much larger task ahead, where industry
  in space moves mass with no one on site at all.
target: >-
  Driverless electric trucks, trains, ships and delivery robots carrying over 50 percent of the
  world's freight tonne-kilometres by {year-k08}, routed as one network by cost, energy and time:
  each vehicle in use about 20 hours a day against a driver's legal 11, loaded on at least 70
  percent of its miles, and injury crashes per mile at most half those of human drivers.
exists:
  - text: The American Transportation Research Institute reported that the average cost of operating a truck hit a record 2.336 USD a mile in 2025, up 3.4 percent, with driver benefits among the steepest-rising line items, so a driver's pay and legally required rest weigh heavily on freight cost.
    url: https://truckingresearch.org/2026/07/new-atri-report-details-accelerating-costs-and-low-profitability-despite-cuts/
    year: 2025
  - text: Aurora began driverless commercial trucking between Dallas and Houston in April 2025, and by October 2025 had passed 100,000 driverless miles with five trucks regularly hauling customer freight.
    url: https://ir.aurora.tech/news-events/press-releases/detail/128/aurora-expands-driverless-trucking-service-from-fort-worth-to-el-paso
    year: 2025
  - text: Rio Tinto's AutoHaul in Western Australia, completed in 2020, is the world's first heavy-haul long-distance autonomous railway, with about 200 locomotives on more than 1,700 km of track.
    url: https://www.riotinto.com/en/mn/about/innovation/automation
    year: 2020
  - text: Komatsu had commissioned more than 900 autonomous haul trucks by October 2025, which have moved more than 10 billion tons.
    url: https://www.komatsu.com/en-us/technology/smart-mining/loading-and-haulage/autonomous-haulage-system
    year: 2025
  - text: Waymo passed 450,000 paid driverless rides a week in December 2025, proof that driverless vehicles can run as a paid service in dense cities.
    url: https://www.cnbc.com/2025/12/08/waymo-paid-rides-robotaxi-tesla.html
    year: 2025
  - text: Aurora set out a plan on 23 September 2026 to scale to 30,000 driverless trucks by 2030, with its capacity fully allocated to end 2026 with 200 in operation.
    url: https://ir.aurora.tech/news-events/press-releases/detail/152/aurora-outlines-2030-vision-to-scale-to-30000-driverless-trucks-at-analyst-and-investor-day
    year: 2026
gap: >-
  Driverless trucks on public roads number in the tens; the leading maker aims for 200 by the end of
  2026 and 30,000 by 2030. Mines run about 900 driverless haul trucks and one railway runs 200
  locomotives, each a closed system from one maker. Freight is not yet allowed or
  proven driverless in snow, dense cities, ports or border crossings. US trailers are used at only
  43 to 50 percent of capacity across loaded and empty trips, against the target's 70, because the
  fleets of different makers and modes do not share loads. The gap is rules, coverage, and a shared
  network that routes any load across any carrier.
inventions: [load-commons]
scene:
  kind: network
  focus: Depots and corridors across a continent, with loads flowing between them day and night.
  params: { shape: flat, nodes: 1200, clusters: 30, links: 0.6, pulses: 0.9 }
