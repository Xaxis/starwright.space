id: cislunar-transport
title: Regular transport between Earth and the Moon
domain: transport
stage: k09
needs: [cheap-launch, propellant-depots]
summary: >-
  Lunar industry needs a shuttle service, not missions: tugs between low orbit and lunar orbit,
  landers that refuel and fly again, and returns that bring people and products home. Most of each
  trip's cost is propellant, so the cheapest routes fill up with lunar oxygen and let Earth's upper
  atmosphere do the braking on the way back.
target: >-
  By {year-k09}, at least one flight a week and then one a day, carrying people and over 10,000
  tonnes a year between low Earth orbit, lunar orbit and the surface; tugs and landers that each fly
  at least 50 times; at least 80 percent of their propellant by mass made on the Moon; and a cost
  from low orbit to the lunar surface below {launch-cost-falcon-9}, today's price of reaching low
  orbit itself.
exists:
  - text: Artemis II launched on 1 April 2026 and on 6 April took four astronauts 252,756 miles (406,771 km) from Earth, 4,111 miles farther than Apollo 13, the farthest any crew has flown.
    url: https://www.nasa.gov/blogs/missions/2026/04/06/artemis-ii-flight-day-6-lunar-flyby-updates/
    year: 2026
  - text: NASA picked SpaceX's Starship as its lunar lander in April 2021, an award worth 2.89 billion USD.
    url: https://www.nasa.gov/news-release/as-artemis-moves-forward-nasa-picks-spacex-to-land-next-americans-on-moon/
    year: 2021
  - text: NASA chose Blue Origin as a second lunar lander provider on 19 May 2023, under a firm-fixed-price contract worth 3.4 billion USD, with a crewed demonstration planned for Artemis V.
    url: https://www.nasa.gov/news-release/nasa-selects-blue-origin-as-second-artemis-lunar-lander-provider/
    year: 2023
  - text: Intuitive Machines' first lander, Odysseus, tipped over in February 2024 when a leg broke on touchdown, and its second, Athena, toppled into a crater near the south pole on 6 March 2025 and was declared dead the next day.
    url: https://www.scientificamerican.com/article/athena-lunar-lander-declared-dead-on-the-moon/
    year: 2025
  - text: Firefly's Blue Ghost made a safe, upright touchdown on the Moon on 2 March 2025, four days before Athena's landing.
    url: https://www.cnn.com/2025/03/06/science/intuitive-machines-im2-moon-landing/index.html
    year: 2025
gap: >-
  Every trip to the Moon is still a one-off with a vehicle that is thrown away or left on the
  surface: 0 landers refuelled or reflown against the target's 50 flights each, 0 kg of propellant
  made on the Moon against 80 percent, and 2 of the 3 commercial landers to reach the surface so
  far tipped over. Going from low orbit to the surface takes about 5.9 km/s (3.1 to leave Earth orbit, 0.9 into lunar orbit, 1.9
  to land); with hydrogen and oxygen at a 4.4 km/s exhaust that is 74 percent of the departing mass
  as propellant. Braking by rocket from lunar return speed into low orbit costs another 3.1 km/s,
  half the returning mass.
inventions: [ballute-ferry]
scene:
  kind: orbit
  focus: Tugs shuttling between depots in low orbit and the Moon's distance.
  params: { depots: 0.6, stations: 0.4 }
