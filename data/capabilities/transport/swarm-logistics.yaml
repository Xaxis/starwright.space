id: swarm-logistics
title: Moving parts and people around the swarm
domain: transport
stage: type-2
needs: [swarm-construction, swarm-station-keeping, mercury-freight, beamed-propulsion, materials-recycling]
summary: >-
  A swarm of about a trillion collectors wears out: films darken, cells fail, small impacts punch
  holes. Replacing and recycling them, and supplying the factories and the people who tend them,
  needs a transport network across a whole shell {swarm-radius} from the Sun, where a trip half way
  round takes months even at the speed of a fast ship.
target: >-
  Collectors built to last 50 years, so that of about 10^12, some 2 × 10^10 retire each year, about
  600 a second; each one found, brought to a forge by sail and beam and remade, with at least 99
  percent of its mass going back into new film, about a fiftieth of {swarm-full-mass} a year; parts
  and crews delivered anywhere on the shell within a year; and every collector on a laser link, so
  that the swarm runs itself for as long as the Sun shines.
exists:
  - text: SpaceX told SPIE Photonics West in January 2024 that Starlink's mesh of over 9,000 laser terminals, at 100 Gbit/s each, carried 5.6 Tbit/s over links of up to 5,400 km lasting up to weeks, with 99.99 percent uptime from fast rerouting.
    url: https://hackaday.com/2024/02/05/starlinks-inter-satellite-laser-links-are-setting-new-record-with-42-million-gb-per-day/
    year: 2024
  - text: Of 13,122 Starlinks launched by November 2026, 1,564 had been retired by planned disposal, burned up in the atmosphere.
    url: https://planet4589.org/space/con/star/stats.html
    year: 2026
  - text: Northrop Grumman's Mission Robotic Vehicle and three Mission Extension Pods launched on 21 July 2026, to install life-extending pods on satellites in orbit.
    url: https://www.northropgrumman.com/space/space-logistics-services
    year: 2026
  - text: Northrop Grumman's MEV-2 docked with Intelsat 10-02 in April 2021, and MEV-1 moved on to a second client in May 2025 after five years on its first.
    url: https://www.northropgrumman.com/space/space-logistics-services
    year: 2025
gap: >-
  Starlink, the largest constellation, has retired 1,564 satellites in all, by burning them up in
  an atmosphere that solar orbit does not have; the swarm must retire about 55 million a day,
  35,000 times that total every day. Servicing in orbit has managed 3 dockings by 2 vehicles since
  2020, against 600 a second. The largest network in space spans links of up to 5,400 km; half way
  round the shell at {swarm-radius} is about 2.8 × 10^8 km, some 50,000 times as far.
inventions: [homing-petals]
scene:
  kind: swarm
  focus: The swarm's shell, with sails carrying failed collectors back to the forges near Mercury.
  params: { built: 0.95, radiusAu: 0.6, mercury: true }
