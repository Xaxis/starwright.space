id: interplanetary-transport
title: Regular transport between worlds
domain: transport
stage: type-1
needs: [cislunar-transport, in-space-propulsion, closed-life-support, space-health]
summary: >-
  Once industry spans the Earth and the Moon, it reaches for Mars and the asteroids. Ships between
  worlds must carry people safely for months and cargo cheaply for years, on schedules set by the
  planets' alignments: Earth and Mars line up for a cheap transfer once every synodic period of
  about 2.14 years, or 26 months. Cyclers that loop for ever between worlds, met by taxis and tugs at
  each end, turn expeditions into a timetable.
target: >-
  By {year-type-1}, ships leaving for Mars at every launch window, once every 26 months, and for the
  main belt every year; crews reaching Mars in 180 days or less; a crew's dose for the whole round
  trip under 300 mSv, half NASA's 600 mSv career limit; propellant for every trip home made at the
  far end; and cargo landed on Mars for no more than 3 times the cost per kilogram of landing it on
  the Moon.
exists:
  - text: Byrnes, Longuski and Aldrin described in 1993 a periodic orbit, kept largely by gravity assists from Earth, on which a vehicle cycles between Earth and Mars with moderate manoeuvres and could serve as a radiation shelter and living quarters in transit.
    url: https://ntrs.nasa.gov/citations/19930054986
    year: 1993
  - text: A 2012 study by Rogers, Hughes, Longuski and Aldrin found Aldrin cycler trajectories with Earth to Mars flights of 161 and 171 days, inside the 180-day limit NASA's reference architecture sets for crew health, and propellant savings of up to 23 tonnes for a 70-tonne cycler.
    url: https://engineering.purdue.edu/AAC/wp-content/uploads/2012/09/EstablishingCyclerTrajectoriesBetweenEarthAndMarsViaV-InfinityLeveraging-AIAA-2012-47461.pdf
    year: 2012
  - text: Curiosity's radiation detector measured 1.8 mSv a day during its 253-day cruise to Mars; Zeitlin and colleagues put the transit legs of a round trip with current propulsion at about 0.66 Sv.
    url: https://www.swri.org/newsroom/press-releases/swri-led-team-calculates-the-radiation-exposure-associated-trip-mars
    year: 2013
  - text: NASA's standard NASA-STD-3001 limits an astronaut's total career dose from spaceflight to 600 mSv.
    url: https://www.nasa.gov/wp-content/uploads/2023/03/radiation-protection-technical-brief-ochmo.pdf
    year: 2023
  - text: NASA's Psyche, launched in October 2023, is crossing to the main belt on xenon electric thrusters fired nearly nonstop, and is due at its metal asteroid in 2029.
    url: https://www.jpl.nasa.gov/news/nasas-psyche-fires-up-its-sci-fi-worthy-thrusters/
    year: 2024
  - text: DARPA ended DRACO, its nuclear thermal rocket demonstration, in June 2025, its official saying falling launch costs made the efficiency gain look like less and less of a positive return on the research cost.
    url: https://breakingdefense.com/2025/06/darpas-draco-nuclear-propulsion-project-roars-no-more/
    year: 2025
  - text: NASA's MOXIE made a total of 122 grams of oxygen from the Martian air on Perseverance, at up to 12 grams an hour, to test making the propellant for a flight home.
    url: https://www.nasa.gov/missions/mars-2020-perseverance/perseverance-rover/nasas-oxygen-generating-experiment-moxie-completes-mars-mission/
    year: 2023
  - text: NASA's Mars Design Reference Architecture 5.0 (2009) planned crews of six on conjunction-class trips with about 500 days on Mars, using nuclear thermal rockets and making part of the ascent propellant from the Martian air.
    url: https://www.nasa.gov/wp-content/uploads/2015/09/373665main_nasa-sp-2009-566.pdf
    year: 2009
gap: >-
  No crew has flown beyond the Moon's distance. The transit legs alone of a round trip on today's
  rockets give about 660 mSv, 1.1 times NASA's career limit and 2.2 times the target's 300, before
  any time on the surface, and Curiosity's cruise took 253 days against the crew limit of 180. The
  last nuclear rocket demonstration was cancelled in 2025, no cycler has been built, and the oxygen
  made on Mars so far is MOXIE's 122 grams, a test of the plant that must make a crew's ascent
  propellant before they leave Earth.
inventions: [moon-metal-hall-drive, spun-shell]
scene:
  kind: habitat
  focus: A spinning cycler ship on its endless loop between Earth and Mars.
  params: { type: ship, spin: 0.4, green: 0.3 }
