id: electric-transport
title: Electric transport on land, sea and air
domain: transport
stage: k08
needs: [grid-storage, abundant-minerals]
summary: >-
  Almost all transport still runs on oil burned in engines that turn most of it into waste heat. An
  electric car turns over 77 percent of the energy it draws from the grid into power at the wheels,
  against 12 to 30 percent for a petrol car, so the same trip needs a third or less of the energy,
  and that energy can come from sunlight and wind. Cars, buses, two-wheelers, trucks, trains, ferries
  and short flights can all move to batteries and wires.
target: >-
  Every new road vehicle sold electric by 2040, up from a quarter of new cars in 2025; the world's
  fleet of cars, buses, trucks and two-wheelers turned over by 2055, well before {year-k08}; ferries
  on routes under 50 km and commuter aircraft on routes under 400 km running on batteries; and
  vehicle packs below 60 USD per kWh, all charged from clean power.
exists:
  - text: The IEA found electric car sales grew 20 percent to exceed 20 million in 2025, a quarter of all new cars worldwide, and reached a record of over 60 percent of new cars sold in China.
    url: https://www.iea.org/reports/global-ev-outlook-2026/executive-summary
    year: 2025
  - text: The IEA counted more than 17 million electric cars sold in 2024, over 20 percent of new cars worldwide.
    url: https://www.iea.org/reports/global-ev-outlook-2025/executive-summary
    year: 2024
  - text: Electric cars were 98.0 percent of new passenger cars registered in Norway from January to October 2026, 2.9 points up on 2025, showing a whole market can switch.
    url: https://ofv.no/bilsalget/bilsalget-i-desember-2025
    year: 2026
  - text: BloombergNEF's December 2025 survey found lithium-ion pack prices fell 8 percent to a record 108 USD per kWh, with battery-electric vehicle packs at 99 USD, the second year below 100.
    url: https://about.bnef.com/insights/clean-transport/lithium-ion-battery-pack-prices-fall-to-108-per-kilowatt-hour
    year: 2025
  - text: The US Department of Energy reports that electric cars convert over 77 percent of the electrical energy from the grid to power at the wheels, against 12 to 30 percent of the energy in petrol for conventional cars.
    url: https://www.fueleconomy.gov/feg/evtech.shtml
    year: 2024
  - text: Buquebus's battery ferry for the Buenos Aires to Uruguay crossing, built by Incat for 2,100 passengers and 225 vehicles and financed with the IFC in 2024, is the world's largest electric ferry.
    url: https://www.ifc.org/en/pressroom/2024/buquebus-banco-santander-and-ifc-sign-financing-for-the-worlds-largest-electric-ferry-on-the-argentina-uruguay-route
    year: 2024
gap: >-
  Three quarters of new cars and most new trucks are still sold with engines: sales must go from 25
  to 100 percent electric in 15 years, and the fleet then takes more than a decade to turn over.
  Norway's 98 percent shows a whole market can switch, but poorer countries need cheaper vehicles
  and stronger grids. Vehicle packs at 99 USD per kWh must fall by about 40 percent more, heavy
  trucks need megawatt chargers along freight routes, and battery minerals must grow several times
  over.
inventions: []
