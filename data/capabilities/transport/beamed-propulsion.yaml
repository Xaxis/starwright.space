id: beamed-propulsion
title: Ships pushed by beams from fixed stations
domain: transport
stage: planet
needs: [power-beaming, mass-drivers, interplanetary-transport]
summary: >-
  A ship that carries its own power and propellant has to push their mass as well as its cargo. If a
  fixed station supplies the push instead, as light, microwaves or a stream of pellets, the ship
  stays light and fast. The stations the climb already builds at the Moon and Mercury, to launch
  mass and beam power, can become the solar system's highways.
target: >-
  Beam stations of 0.1 to 10 GW that push ships of 10 to 1,000 tonnes from the Moon to Mars in 45 to
  90 days instead of the 6 to 9 months of a minimum-energy trip, delivering usable push over at
  least 10 million km from each station, with ships carrying no engine heavier than the catcher that
  takes the push.
exists:
  - text: Breakthrough Starshot was announced in April 2016 with a 100 million USD pledge to study laser-driven gram-scale probes at 20 percent of light speed; by 2025 its director said the programme was on hold.
    url: https://www.scientificamerican.com/article/the-quiet-demise-of-breakthrough-starshot-a-billionaires-interstellar/
    year: 2025
  - text: Duplay and colleagues at McGill designed a 45-day transit to Mars in which a 10 m, 100 MW laser array on Earth heats a ship's hydrogen to a specific impulse of 3,000 s (Acta Astronautica, 2022).
    url: https://arxiv.org/abs/2201.00244
    year: 2022
  - text: The Planetary Society's LightSail 2 deployed a 32 square metre sail on 23 July 2019 and used sunlight alone to change its orbit until it re-entered in November 2022.
    url: https://www.planetary.org/sci-tech/lightsail
    year: 2022
  - text: Lubin's "A Roadmap to Interstellar Flight" set out phased laser arrays that could push wafer-thin probes to relativistic speeds and heavier craft fast across the solar system (JBIS, 2016).
    url: https://arxiv.org/abs/1604.01356
    year: 2016
gap: >-
  Beamed propulsion has moved nothing larger than a test sail, and that one by sunlight: LightSail
  2's 32 square metres felt about 0.3 mN. Light pressure gives at most 0.67 N from 100 MW even on a
  perfect mirror, so a beam must heat propellant to push a tonne-class ship, as Duplay's design does
  for about 3,400 N at 50 percent efficiency. A 10 m laser at 1 micron keeps its spot inside a 10 m
  receiver only out to about 39,000 km, a tenth of the way to the Moon and 250 times short of the
  target's reach. No beam station, and no optics to aim one, has been built.
inventions: [pellet-line]
scene:
  kind: launch
  focus: A ship riding a beam out from its station toward another world.
  params: { method: sail, cadence: 0.4 }
