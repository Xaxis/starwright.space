id: clean-shipping
title: Ships without fossil fuel
domain: transport
stage: k08
needs: [terawatt-solar-factories]
summary: >-
  Ships carry most of the world's trade, burning the heaviest and dirtiest oil. Oceans are too wide
  for batteries, so long voyages need fuels made from clean power, such as ammonia, methanol and
  hydrogen, and the wind, which rigid sails and rotors are learning to use again. A slower ship also
  burns far less: a hull's power rises with the cube of its speed, so fuel per kilometre rises with
  the square, and steaming 10 percent slower cuts fuel per voyage by about 19 percent.
target: >-
  International shipping at net zero by 2050, two decades before {year-k08}: at least 5 percent of
  its energy from zero or near-zero fuels by 2030, emissions down at least 70 percent on 2008 by
  2040, then all of its fuel ammonia, methanol or hydrogen made from clean power, with sails and
  slower steaming cutting each voyage's fuel by a further 20 percent or more, and clean fuel and
  shore power at every major port.
exists:
  - text: The IMO's 2023 strategy sets net-zero greenhouse gas emissions from international shipping by or around 2050, with zero or near-zero fuels at least 5 percent of its energy by 2030 and emissions cut by at least 20 percent by 2030 and 70 percent by 2040 against 2008.
    url: https://www.imo.org/en/MediaCentre/HotTopics/Pages/Cutting-GHG-emissions.aspx
    year: 2023
  - text: The IMO approved a draft Net-Zero Framework, with a global fuel standard and emissions pricing, on 11 April 2025.
    url: https://www.imo.org/en/MediaCentre/PressBriefings/pages/IMO-approves-netzero-regulations.aspx
    year: 2025
  - text: In October 2025 the IMO's Marine Environment Protection Committee adjourned the framework's adoption for a year; by May 2026 it was due to resume on 4 December 2026, so no global price on shipping emissions is yet in force.
    url: https://www.imo.org/en/mediacentre/meetingsummaries/pages/temporary-mepc-84th-session.aspx
    year: 2026
  - text: The Fourth IMO Greenhouse Gas Study found shipping emitted 1,076 million tonnes of CO2 equivalent in 2018, 2.89 percent of human emissions, up 9.6 percent since 2012.
    url: https://www.imo.org/en/OurWork/Environment/Pages/Fourth-IMO-Greenhouse-Gas-Study-2020.aspx
    year: 2020
  - text: Maersk's Laura Maersk, named in Copenhagen on 14 September 2023, was the world's first methanol-enabled container ship.
    url: https://www.maersk.com/news/articles/2023/09/14/eu-commission-president-names-landmark-methanol-vessel-as-laura-maersk
    year: 2023
  - text: Oceanbird completed sea trials of its rigid Wing 560 sail on Wallenius Wilhelmsen's car carrier Tirranna and announced its first multi-wing installation in September 2026.
    url: https://www.theoceanbird.com/press
    year: 2026
gap: >-
  Shipping emitted 1,076 million tonnes of CO2 equivalent in 2018, up 9.6 percent in six years and
  nearly all from fossil oil, while the target needs emissions at least 20 percent below 2008 by 2030
  and 70 percent below by 2040, so the trend must turn from a rise to a steep fall within a few
  years. Methanol and wind ships are still first-of-a-kind, and the global fuel
  standard and emissions price that would close the fuel-cost gap missed adoption in October 2025
  and waits on a vote in December 2026. The engines and sails exist; the gap is clean fuel cheap
  enough to burn and on sale at every port.
inventions: []
scene:
  kind: globe
  focus: The sea lanes between continents, crossed by ships on clean fuel and sail.
  params: { look: oceans, lights: 0.6 }
