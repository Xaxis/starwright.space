id: water-from-air
title: Water pulled from the air
domain: water
stage: k08
needs: []
summary: >-
  There is water everywhere, even in desert air, and new sorbent materials can grab it straight from
  the atmosphere using only sunlight, with no pipes, wells or power grid. For the hundreds of millions
  of people far from fresh water, a device that makes drinking water from dry air is a supply that
  needs no infrastructure, and the same trick gives water to a remote base or an off-grid farm.
target: >-
  Make clean drinking water from the air at useful daily volumes and low cost, in humidity as low as a
  desert's, driven mainly by sunlight, so a household or a village can draw water from the atmosphere
  without a grid or a water source.
exists:
  - text: A sunlight-driven harvester using the metal-organic framework MOF-801 captured about 2.8 litres of water per kilogram of material a day at relative humidity as low as 20 percent, regenerating at around 65 degrees Celsius.
    url: https://yaghi.cchem.berkeley.edu/pdfPublications/WaterHarvesting.pdf
    year: 2017
  - text: A later air-cooled device tested in the Arizona desert, using MOF-303, delivered more than twice the water of the MOF-801 version, proving the approach works in real desert conditions.
    url: https://yaghi.cchem.berkeley.edu/pdfPublications/NComm2018.pdf
    year: 2018
  - text: Independent coverage confirmed the framework extracts water from thin air and endures many adsorption cycles without damage.
    url: https://physicstoday.aip.org/news/metal-organic-framework-extracts-water-from-thin-air
    year: 2017
gap: >-
  The devices so far make grams to a few litres a day from small amounts of sorbent, the frameworks
  are still costly to make in bulk, and no product yet delivers a household's water cheaply. Scaling
  the sorbent, the daily yield and the cost by large factors, while keeping it passive, is the
  unsolved work.
inventions: [atmospheric-harvester]
scene:
  kind: machine
  focus: A sorbent panel drinking in night air and releasing clean water as the Sun warms it.
  params: { shape: panel, spin: 0.2 }
