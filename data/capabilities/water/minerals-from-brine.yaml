id: minerals-from-brine
title: Minerals from the brine
domain: water
stage: k08
needs: [low-energy-desalination]
summary: >-
  Each cubic metre of fresh water a desalination plant makes leaves about one and a half cubic
  metres of brine, most of it poured back into the sea, where it sinks and spreads over the sea
  floor. That brine is also a dilute ore. The seawater that passes through the world's plants carries
  about 300,000 tonnes of magnesium and 100,000 tonnes of potassium a day, with bromine, calcium,
  sulphate and salt. Mining it turns desalination's waste into metals and fertiliser and ends the
  dumping as the industry grows more than tenfold.
target: >-
  Recover magnesium, calcium, potassium, bromine and salt from at least half of the world's
  desalination brine by {year-k08}, at purities buyers accept, with each plant returning less than a
  tenth of its intake to the sea as liquid, and with the minerals paying for the energy it takes.
exists:
  - text: Jones and colleagues estimated that 15,906 desalination plants make about 95 million cubic metres of water and 142 million cubic metres of brine a day, 55 percent of it from Saudi Arabia, the UAE, Kuwait and Qatar.
    url: https://doi.org/10.1016/j.scitotenv.2018.12.076
    year: 2019
  - text: The TEOS-10 reference composition of seawater gives, per kilogram, about 1,284 mg of magnesium, 2,712 mg of sulphate, 399 mg of potassium and 67 mg of bromide.
    url: https://www.teos-10.org/pubs/TEOS-10_Manual.pdf
    year: 2010
  - text: The EU's SEArcularMINE project recovered all the magnesium in the bitterns of the Trapani saltworks at over 99 percent purity, and runs a pilot there that makes 100 kg of magnesium hydroxide a day.
    url: https://cordis.europa.eu/project/id/869467/reporting
    year: 2024
  - text: The EU's SEA4VALUE project reached its target of 90 percent recovery at 90 percent purity for several brine minerals in the laboratory, and runs a mobile laboratory at Aqualia's desalination plant at La Caleta de Adeje, Tenerife.
    url: https://cordis.europa.eu/article/id/454291-multi-mineral-modular-brine-mining-process
    year: 2024
  - text: Gradiant's counter-flow reverse osmosis pilot for the US Bureau of Reclamation took brine from a seawater plant in Jeddah to 130,000 mg per litre at 50 percent recovery for under 7 kWh per cubic metre of water.
    url: https://www.usbr.gov/research/dwpr/reportpdfs/report247.pdf
    year: 2021
  - text: Peters and Hankins report that mechanical vapour compression, the usual way to drive brine towards dryness, uses 20 to 39 kWh of electricity per cubic metre of water and works up to about 250 g per litre.
    url: https://ora.ox.ac.uk/objects/uuid:84559056-508b-4f68-aaff-63197ab64538/files/m7eb369be2d057f96a1a3172c1ec5ccdc
    year: 2018
  - text: Murphy and Haji put lithium in seawater at 0.1 to 0.2 ppm, nearly 230 Gt in all, against 54 to 1,600 ppm in the salt-lake brines it is mined from today.
    url: https://www.frontiersin.org/articles/10.3389/fceng.2022.1008680
    year: 2022
gap: >-
  The largest pilots make about 100 kg of magnesium hydroxide a day, while some 300,000 tonnes of
  magnesium a day pass through the world's plants: a gap of more than six orders of magnitude.
  Membranes can take brine to about 130 g per litre for under 7 kWh per cubic metre of water
  recovered. Beyond that, evaporators need 20 to 39 kWh, about ten times what reverse osmosis spends
  on fresh water, so plants stop and dump the rest. No plant yet sells enough minerals to pay for
  going further. Lithium, at 0.1 to 0.2 ppm, is hundreds to thousands of times more dilute than the salt-lake brines
  it is mined from.
inventions: [zero-brine-desalinator]
scene:
  kind: field
  focus: Settling tanks and salt pans beside a desalination plant, each holding a different mineral as the brine thickens.
  params: { unit: tank, count: 150, terrain: sea }
