id: general-purpose-robots
title: Robots that can do any factory job
domain: manufacturing
stage: k08
needs: [abundant-compute]
summary: >-
  Industrial robots are fast and precise, but each is programmed for one task in one cell. Most work
  in a factory, and all of the work of building one, is too varied for that. Robots with hands and
  the judgement to use them, made as cheaply as cars, would let automation reach every job,
  including the job of building more robots.
target: >-
  General-purpose robots that learn a new physical task from fewer than ten demonstrations, run
  10,000 hours between visits from a technician, and are made by the million a year for under
  20,000 dollars each, so that by {year-k08} labour no longer limits how fast the world builds.
exists:
  - text: About 18,000 humanoid robots were shipped worldwide in 2025, about six times as many as in 2024, by IDC's count.
    url: https://news.cgtn.com/news/2026-01-24/IDC-report-China-leads-the-global-humanoid-robot-rise-in-2025-1KccOGZyVGM/p.html
    year: 2025
  - text: Unitree sells its G1 humanoid from 13,500 US dollars.
    url: https://www.unitree.com/g1/
    year: 2026
  - text: Figure's F.02 humanoids worked 10-hour weekday shifts at BMW's Spartanburg plant for 11 months, loading more than 90,000 sheet-metal parts for welding in over 1,250 hours.
    url: https://figure.ai/news/production-at-bmw
    year: 2025
  - text: Agility Robotics says its Digit humanoid has logged 65,000 hours of production work.
    url: https://www.agilityrobotics.com/
    year: 2026
  - text: Boston Dynamics' electric Atlas has 56 degrees of freedom and began its first customer pilot at a Hyundai plant.
    url: https://www.bostondynamics.com/atlas
    year: 2026
  - text: Google DeepMind's Gemini Robotics On-Device model adapts to a new task from as few as 50 to 100 demonstrations.
    url: https://deepmind.google/blog/gemini-robotics-on-device-brings-ai-to-local-robotic-devices/
    year: 2025
gap: >-
  Humanoids shipped by the ten thousand in 2025, fifty times short of a million a year, and most
  of what they do is carrying, sorting and loading. The best robot models need 50 to 100
  demonstrations for a new task, not a few. Robot hands still lack the touch and toughness of
  human hands, and robots still need people nearby when they fail. The data to fix this is scarce:
  the largest open collections of robot practice hold hundreds of hours, while one factory's
  workers put in millions of hours a year.
inventions: [mirror-glove]
