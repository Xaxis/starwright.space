id: space-solar-power
title: Solar power collected in space
domain: energy
stage: k09
needs: [cheap-launch, terawatt-solar-factories, in-orbit-assembly]
summary: >-
  Above the air, sunlight is strong and steady: {solar-constant} on every square metre, no clouds,
  and in a high orbit almost no night. Once Earth's surface nears its ceiling of {earth-cap}, the
  industry that moves to orbit needs power where it works, and collectors there can also send some
  down to Earth. Power has been beamed from orbit to the ground only at the scale of a laboratory
  demonstration.
target: >-
  Collectors in orbit that supply the space industry once power used in space passes power used on
  Earth in {year-space-overtakes}: several hundred terawatts by {year-k09}, about a million square
  kilometres of collector, more than 90 percent of it made from material already in space, with beams
  delivering 1 to 10 GW each to receivers on Earth and the Moon.
exists:
  - text: Caltech's 50 kg Space Solar Power Demonstrator launched in January 2023; its MAPLE array beamed power wirelessly in orbit in March, and a receiver on a Caltech roof in Pasadena detected the beam in May.
    url: https://www.caltech.edu/about/news/in-a-first-caltechs-space-solar-power-demonstrator-wirelessly-transmits-power-in-space
    year: 2023
  - text: The US Naval Research Laboratory's PRAM module turned sunlight into microwaves aboard the X-37B from May 2020 to November 2022; its output fell as it got hotter, but the module did not degrade.
    url: https://iafastro.directory/iac/paper/id/87673/abstract-pdf/IAC-24,C3,2,1,x87673.brief.pdf
    year: 2024
  - text: Japan's OHISAMA, a small satellite built by JAXA and Japan Space Systems to beam microwave power from low orbit to receivers on the ground, was still being assembled in 2026, with flight models of most parts complete.
    url: https://iafastro.directory/iac/paper/id/108811/abstract-pdf/IAC-26,C3,1,2,x108811.brief.pdf
    year: 2026
  - text: Space Solar's HARRIER demonstrator in Belfast steered a power beam through 360 degrees with no moving parts in April 2024, a step toward its 1.7 km CASSIOPeiA design.
    url: https://www.spacesolar.co.uk/breakthrough-in-space-based-energy-space-solar-demonstrates-worlds-first-360-wireless-power-transmission/
    year: 2024
  - text: Xidian University's 75 m Zhuri ground tower for testing space solar power passed review in 2022, on a roadmap of a 10 kW test in orbit in 2028 and 2 GW in 2050.
    url: https://en.people.cn/n3/2022/0622/c90000-10112962.html
    year: 2022
gap: >-
  No collector in orbit has yet sent useful power to the ground: Caltech's beam lit a detector, not a
  town, and Japan's OHISAMA has not yet flown. Launching even 1 kg per kilowatt at
  {launch-cost-falcon-9} costs about 30 times the price of modules on the ground at
  {pv-module-price}. The target needs about a million square kilometres of collector, and no
  collector has yet been made in space from material found there. Beams lose much of their power
  between the panel and the plug, and ground receivers kilometres wide must be sited and trusted.
inventions: [vapour-loom]
scene:
  kind: orbit
  focus: Wide collectors in high orbit, beaming power down to receivers on the night side of Earth.
  params: { collectors: 0.8, beams: true, stations: 0.3 }
