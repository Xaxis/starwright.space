id: energy-access
title: Electricity and clean cooking for everyone
domain: energy
stage: now
needs: []
summary: >-
  The climb starts with the people who have almost no energy at all. Humanity uses {power-now}, a
  Kardashev rating of {k-now}, but {people-without-power} have no electricity and billions
  still cook over smoke. Reaching {power-k08} by {year-k08} means every person using as much energy
  as the richest countries do today, so the first new watts must reach the people who have none.
target: >-
  Every household on a supply that runs lights, a refrigerator, a fan, a phone, a water pump and a
  clean stove, and that can grow as its owners' needs grow, so that no one is left behind on the way
  to {power-k08}.
exists:
  - text: The UN's 2025 SDG report counts 666.4 million people without electricity in 2023, with global access at 92 percent; only 74 percent had clean cooking, leaving about 2.1 billion people on polluting fuels.
    url: https://unstats.un.org/sdgs/report/2025/Goal-07/
    year: 2025
  - text: The IEA counts 730 million people without electricity in 2025 and, on current policies, still 710 million in 2030.
    url: https://www.iea.org/topics/energy-access
    year: 2025
  - text: Mission 300, led by the World Bank Group and the African Development Bank, aims to connect 300 million Africans to electricity by 2030, with 30 billion US dollars from the World Bank for 2024 to 2030.
    url: https://www.worldbank.org/en/programs/energizing-africa
    year: 2025
  - text: The ESMAP and GOGLA Off-Grid Solar Market Trends Report 2026 finds off-grid solar products served 149 million people in 2025, up 26 percent from 2023.
    url: https://mtr.esmap.org/
    year: 2026
  - text: Sun King reports more than 27 million households using its solar products, sold largely on pay-as-you-go credit through more than 45,000 field agents.
    url: https://sunking.com/
    year: 2026
  - text: The WHO attributes 2.9 million deaths in 2021 to household air pollution from cooking with solid fuels and kerosene.
    url: https://www.who.int/news-room/fact-sheets/detail/household-air-pollution-and-health
    year: 2025
gap: >-
  Most people still without power live in rural sub-Saharan Africa, far from any grid, on incomes too
  small to buy a system outright. Solar kits sold on credit light homes but rarely run a stove, a pump
  or a workshop, and mini-grids cost more to build than their customers can repay. Clean cooking lags
  furthest: smoke from fires and stoves still kills nearly three million people a year.
inventions: []
scene:
  kind: globe
  focus: Africa at night, its villages lighting up one by one as panels and mini-grids reach them.
  params: { lights: 1, solar: 0.3, look: cities }
