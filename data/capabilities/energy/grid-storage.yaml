id: grid-storage
title: Storage for a sun-powered grid
domain: energy
stage: k08
needs: [terawatt-solar-factories, abundant-minerals]
summary: >-
  Sunlight comes by day and mostly in summer; demand does not. A grid run on panels must carry noon
  into the night, through cloudy weeks and into winter. Batteries now do the first job cheaply. The
  longer jobs, days and seasons, need storage that costs only a few dollars for each kilowatt-hour it
  holds, because it fills and empties only a few times a year.
target: >-
  Enough storage that a grid on sun and wind serves {power-k08} through every night and every winter:
  hours from batteries, days from cheap long-duration stores, and seasons from fuels or metals made
  with summer's surplus.
exists:
  - text: BloombergNEF's 2025 survey found stationary storage battery packs fell to 70 US dollars per kWh, 45 percent below 2024.
    url: https://about.bnef.com/insights/clean-transport/lithium-ion-battery-pack-prices-fall-to-108-per-kilowatt-hour-despite-rising-metal-prices-bloombergnef/
    year: 2025
  - text: Ember reports battery storage deployment grew 46 percent to about 250 GWh in 2025.
    url: https://ember-energy.org/latest-insights/global-electricity-review-2026/
    year: 2026
  - text: The International Hydropower Association counts a record 11.7 GW of pumped storage added in 2025, taking the world past 200 GW, with 243 GW more under construction.
    url: https://www.hydropower.org/publications/2026-world-hydropower-outlook
    year: 2026
  - text: Form Energy's iron-air batteries store power for 100 hours; its system for Google and Xcel at Pine Island, Minnesota is planned at 300 MW and 30 GWh, coming online in phases from 2028.
    url: https://www.canarymedia.com/articles/batteries/gigantic-form-energy-battery-google-minnesota
    year: 2026
  - text: Hydrostor is building compressed-air stores in rock caverns, including Willow Rock in California at 500 MW for more than 8 hours.
    url: https://www.hydrostor.ca/
    year: 2026
  - text: ACES Delta in Utah, built by Chevron and Mitsubishi Power, makes hydrogen with electrolyser banks of 20 to 200 MW and stores it in salt caverns for seasonal use.
    url: https://aces-delta.com/
gap: >-
  Lithium-ion batteries cover hours, but storing a week of a nation's demand in them would cost many
  times the grid itself. Iron-air and compressed air reach a hundred hours, and only in first
  projects. Seasonal storage hardly exists: hydrogen in salt caverns works only where there are salt
  caverns, and loses more than half its energy on the round trip. Nothing yet stores a winter's power
  for a few dollars per kilowatt-hour of capacity.
inventions: [aluminium-tide]
scene:
  kind: field
  focus: Rows of storage halls beside a solar field, filling by day and emptying through the night.
  params: { unit: tank, count: 2500, terrain: plain }
