id: genomic-medicine
title: Medicine read from the genome
domain: health
stage: k08
needs: [programmable-biology, universal-health]
summary: >-
  Each person's genome holds much of what medicine needs to know: which diseases they are prone to,
  which drugs will help or harm them, and which mutations drive a cancer or a rare disease. Reading a
  genome now costs little, and models can increasingly say what its variants mean. Genomic medicine
  turns that into routine care: the right drug at the right dose, early warning of risk, and therapies
  aimed at the exact fault in a patient's cells.
target: >-
  By {year-k08}, a whole genome read for every newborn and every patient whose illness is
  unexplained, at under 100 USD each; a firm clinical meaning for at least 90 percent of the
  variants found, in people of every ancestry; a genetic diagnosis for at least 70 percent of
  patients with a rare disease; and a one-time gene edit priced under 100,000 USD, less than a
  twentieth of the first one's.
exists:
  - text: The cost of sequencing a human genome fell from about 100 million USD in 2001 to roughly 500 USD by 2022 on NHGRI's tracking, and vendors now advertise genomes under 200 USD, so reading the genome is no longer the cost barrier.
    url: https://www.genome.gov/about-genomics/fact-sheets/DNA-Sequencing-Costs-Data
    year: 2022
  - text: England's Generation Study began sequencing the genomes of up to 100,000 newborns in October 2024, screening each for more than 200 treatable childhood conditions alongside the standard heel-prick test.
    url: https://nationalscreening.blog.gov.uk/2025/02/12/the-generation-study-exploring-genome-sequencing-in-newborns/
    year: 2025
  - text: Casgevy, a CRISPR therapy that edits a patient's own blood stem cells to treat sickle cell disease and beta thalassemia, was approved by the UK's MHRA on 15 November 2023 and the US FDA on 8 December 2023, the first approved gene-editing medicine.
    url: https://www.fda.gov/vaccines-blood-biologics/casgevy
    year: 2023
  - text: Casgevy, the first CRISPR therapy approved by the FDA, was priced at 2.2 million USD in the US, and a rival gene therapy for sickle cell cleared the same day at 3.1 million.
    url: https://www.biopharmadive.com/news/crispr-sickle-cell-price-millions-gene-therapy-vertex-bluebird/702066/
    year: 2023
  - text: England's 100,000 Genomes pilot made a genetic diagnosis for 25 percent of probands with rare diseases, 35 percent where the disorder was likely single-gene and 11 percent where it was likely complex (NEJM, 2021).
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7613219/
    year: 2021
  - text: Evo 2, a genome model trained on 9.3 trillion base pairs across all domains of life, predicts the functional effect of genetic variants, a step toward reading what a patient's mutations mean.
    url: https://arcinstitute.org/news/evo-2-one-year-later
    year: 2025
gap: >-
  A genome costs 200 to 500 USD to read, 2 to 5 times the target. Saying what its variants mean is
  the weak link: England's pilot diagnosed 25 percent of rare-disease patients, 35 percent where one
  gene was likely at fault and 11 percent where the cause was likely complex, against the target's
  70, and readings are less reliable outside well-studied populations. The first approved gene edit
  costs 2.2 million USD, 22 times the target, and treats two blood diseases. The data also raise
  privacy and equity questions that are unresolved.
inventions: [variant-to-therapy-pipeline]
scene:
  kind: machine
  focus: A sequencer reading a genome and flagging the variants that matter for care.
  params: { shape: chip, spin: 0.2 }
