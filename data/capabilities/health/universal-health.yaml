id: universal-health
title: Health care for everyone
domain: health
stage: k08
needs: [universal-connectivity, abundant-compute, energy-access]
summary: >-
  A civilization climbing the ladder needs its people healthy, and today good health care reaches
  only some of them. Abundant energy, cheap diagnostics, designed medicines and a connected world
  make it possible to give everyone the basics and more: prevention, diagnosis and treatment of the
  diseases that cut lives short, delivered close to where people live. Global life expectancy reached
  73.3 years in 2024; the floor can be raised everywhere, and the ceiling lifted.
target: >-
  Give every person access to effective prevention, diagnosis and treatment for the major causes of
  illness and early death, through cheap tools, designed medicines and connected care, so that where
  someone is born no longer sets how long or how well they live.
exists:
  - text: Global life expectancy at birth reached 73.3 years in 2024, up 8.4 years since 1995, showing fast, uneven progress that better tools and access can spread.
    url: https://desapublications.un.org/file/20622/download
    year: 2024
  - text: Wellcome Leap runs a DARPA-style breakthrough engine for global health, with programs of 50 to 100 million USD across 36 countries, building the pipeline from invention to deployed care.
    url: https://wellcomeleap.org/
    year: 2024
  - text: AlphaFold 3 predicts how proteins interact with drugs and other molecules far more accurately than before, turning drug design for neglected diseases into a tractable, cheaper problem.
    url: https://doi.org/10.1038/s41586-024-07487-w
    year: 2024
gap: >-
  Billions still lack reliable diagnosis, medicines and trained care, and the tools that could reach
  them, cheap point-of-care diagnostics, designed drugs, connected clinicians, are unevenly built and
  deployed. Closing the gap is as much about delivery, cost and training as about new science.
inventions: [pocket-diagnostic-lab]
scene:
  kind: network
  focus: Clinics, carers and patients as a lit web spanning the globe, care reaching every node.
  params: { nodes: 2000, clusters: 20, links: 0.8, pulses: 0.6, shape: globe }
