id: biomining-microbes
title: Microbes that mine and refine
domain: biology
stage: k09
needs: [programmable-biology, in-space-resources]
summary: >-
  Microbes have mined metal for billions of years, leaching copper and gold from ore with their own
  chemistry at ordinary temperatures. Engineered to the task, they can win metals from low-grade ore
  and waste on Earth without smelters, recover critical metals from recycled electronics, and, hardened
  for vacuum and radiation, pull iron, aluminium and rare metals out of lunar regolith and asteroid
  rock for the factories that will build in space.
target: >-
  Extract and concentrate chosen metals from ore, waste and extraterrestrial rock using engineered
  microbial consortia, to better than 99 percent purity for the chosen metal and at rates that free a
  usable fraction of the feed in days not months, on Earth and in the low gravity, vacuum and
  radiation of the Moon and asteroids.
exists:
  - text: Bioleaching already produces up to 20 percent of the world's copper, and China's Zijinshan mine has run large-scale copper bioheap leaching of low-grade ore since 1998.
    url: https://www.mining-technology.com/features/bioleaching-copper-why-is-uptake-slow/
    year: 2026
  - text: The BioRock experiment on the International Space Station in 2019 showed the bacterium Sphingomonas desiccabilis leaching rare earth elements from basalt, reaching between 111.9 and 429.2 percent of the non-biological controls across the elements and gravity levels tested.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7656455
    year: 2020
  - text: Disrupting the phosphate-transport genes of the bacterium Gluconobacter oxydans raised its rare earth bioleaching by up to 18 percent, a sustainable alternative to thermochemical extraction that its authors call still inefficient.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8602642
    year: 2021
  - text: Cemvita spun out Endolith to develop microbial biomining, and works on recovering metals and minerals from industrial waste streams with biology.
    url: https://www.cemvita.com/
    year: 2026
  - text: Synthetic minimal cells such as JCVI-syn3.0, with only 473 genes, give a clean chassis that can be fitted with the exact leaching and uptake pathways a mining microbe needs.
    url: https://doi.org/10.1126/science.aad6253
    year: 2016
gap: >-
  Biomining on Earth works mainly on copper and gold, and slowly. The best engineered strain gains
  only 18 percent over the wild type and still frees a few percent of the rare earths in its feed; the
  space demonstration on basalt recovered only trace amounts. No microbe yet refines a metal to better
  than 99 percent purity on its own, and none has leached useful amounts from real regolith in vacuum
  and radiation. The organisms, the reactors and the low-gravity chemistry all have to be built.
inventions: [regolith-microbe-loop]
scene:
  kind: cell
  focus: Microbes coating a grain of regolith, drawing metal out of the rock into solution.
  params: { type: microbe, organelles: 0.5, divide: true, glow: 0.4 }
