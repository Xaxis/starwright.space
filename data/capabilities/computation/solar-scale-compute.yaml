id: solar-scale-compute
title: Computing on the scale of a star
domain: computation
stage: k15
needs: [swarm-construction, orbital-compute, space-chip-fabs, reversible-computing, machine-swarm-network, molecular-manufacturing]
summary: >-
  Once the swarm catches a large share of the Sun's light, most of that power will go into
  thinking: designing, simulating, coordinating a trillion machines, and whatever minds the
  civilization chooses to run. The Sun's whole output, {sun-harnessed}, sets a hard limit on how
  many bits a second can be erased, and the limit rises as the computers' final radiators get
  colder. Computing at the scale of a star is the climb's largest use of energy, and the one most
  bounded by physics.
target: >-
  Computing powered by the swarm from {year-k15}, growing to a large share of {sun-harnessed} by
  {year-type-2}, run on reversible logic and radiating its last waste heat as cold as the
  industry can make it, so that each joule buys as many operations as the Landauer bound allows.
exists:
  - text: Robert Bradbury proposed the Matrioshka brain in 1997, nested shells of computers around a star, each running on the waste heat of the one inside.
    url: https://en.wikipedia.org/wiki/Matrioshka_brain
    year: 1997
  - text: Seth Lloyd worked out the ultimate physical limits to computation, set by energy, entropy and the speed of light, for a one-kilogram computer.
    url: https://doi.org/10.1038/35023282
    year: 2000
  - text: Landauer showed that erasing a bit must release at least kT ln 2 of heat, so colder computers can erase more bits per joule.
    url: https://doi.org/10.1147/rd.53.0183
    year: 1961
  - text: Bérut and colleagues confirmed the Landauer bound by experiment.
    url: https://www.nature.com/articles/nature10872
    year: 2012
  - text: Thermophotovoltaic cells have turned the light of a hot emitter into electricity at more than 40 percent efficiency.
    url: https://www.nature.com/articles/s41586-022-04473-y
    year: 2022
  - text: Epoch AI tracks the world's AI computing capacity, about 31.7 million H100-equivalents by mid-2026, the start of the curve this capability extends.
    url: https://epoch.ai/data/ai-chip-sales
    year: 2026
gap: >-
  Nobody has designed a computer that runs for centuries in space, makes its own replacement
  parts, and talks across light-minutes of delay. Turning low-grade infrared back into electricity
  works only at high temperatures today, and reversible logic is not yet practical at any scale.
inventions: [thermal-cascade-swarm]
scene:
  kind: swarm
  focus: The swarm at {swarm-radius} from the Sun, its inner ring bright with sunlight and a dimmer, colder shell of computers outside it.
  params: { built: 0.7, radiusAu: 0.6, mercury: true }
