id: space-chip-fabs
title: Chips made in space from space materials
domain: computation
stage: type-1
needs: [orbital-industry, in-space-resources, small-fabs]
summary: >-
  The swarm's collectors, the factories that copy themselves and the computers that run them all
  need chips, by the trillion. Lifting them from Earth would cap the climb at what Earth's fabs
  make. Space offers what a fab spends most of its money imitating: a vacuum cleaner than any
  cleanroom, unlimited and free. Silicon, aluminium and oxygen are in every lunar and asteroid rock.
  Chips made in space, from space rock, close the last gap in the self-copying loop.
target: >-
  Fabs in orbit and on the Moon that make the chips the space industry needs from local silicon and
  metals, importing under a tenth of their mass from Earth and less each year, so that chips stop
  limiting an industry that doubles every {doubling-time}, by the time the climb reaches Type I in
  {year-type-1}.
exists:
  - text: NASA's Wake Shield Facility, a 3.7 m steel disc, flew on three Shuttle missions from 1994 to 1996; moving faster than the thin gas around it, it left an ultra-high vacuum in its wake, which was used to study the growth of thin films by epitaxy.
    url: https://en.wikipedia.org/wiki/Wake_Shield_Facility
    year: 1996
  - text: Space Forge's ForgeStar-1, launched on 27 June 2025, reached 1,000 °C in its furnace and made plasma in low Earth orbit in December 2025, a step toward growing semiconductor crystals in orbit.
    url: https://news.satnews.com/2025/12/31/space-forge-ignites-orbital-furnace-hits-1000c-milestone-on-forgestar-1/
    year: 2025
  - text: Flawless Photonics pulled more than 11 km of ZBLAN optical fibre on the International Space Station and returned it to Earth.
    url: https://www.flawlessphotonics.com/
    year: 2024
  - text: Crawford's review of lunar resources puts silicon at about 20 percent by weight of lunar material, carbon at about 124 and nitrogen at about 81 parts per million of regolith, and calls the purity needed for semiconductor devices very stringent.
    url: https://arxiv.org/abs/1410.6865
    year: 2015
  - text: Molten oxide electrolysis, first developed under a NASA grant to make oxygen from lunar soil, splits metal oxides into oxygen and molten metal with electricity alone.
    url: https://news.mit.edu/2013/steel-without-greenhouse-gas-emissions-0508
    year: 2013
gap: >-
  No transistor has been made in space, so the share of the space industry's chips made from space
  rock is 0 against a target above 90 percent. The best results so far are a 1,000 °C furnace in
  orbit and 11 km of fibre. A fab on Earth runs dozens of process steps with dopants, wet chemistry
  and process gases made with carbon, nitrogen and fluorine, and regolith holds about 124 parts per
  million of carbon and 81 of nitrogen. No fab, even on Earth, makes chips without masks, liquids and
  a cleanroom, the parts that are hardest to carry or copy.
inventions: [vacuum-fab]
scene:
  kind: compute
  focus: A wafer turning in the shadow of a shield in orbit, patterned by beams with no cleanroom around it.
  params: { kind: wafer, racks: 1, radiators: 0.3, orbit: true }
