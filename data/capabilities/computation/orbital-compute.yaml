id: orbital-compute
title: Computers that run in orbit on sunlight
domain: computation
stage: k09
needs: [cheap-launch, space-solar-power, compute-radiators, laser-backbone]
summary: >-
  As Earth nears its ceiling, {earth-cap}, the heaviest computing should leave the planet. In the
  right orbit, sunlight is nearly constant at {solar-constant}, there is no night to store power
  for, and the cold of space takes the heat. Computing is also the easiest industry to move: its
  product is data, which light carries home. Orbital computing is the first big use of space
  power, and a market that pays for the launch and the factories the rest of the climb needs.
target: >-
  Gigawatts of computing in orbit by {year-k09}, flying as clusters of satellites linked by lasers,
  powered by their own sunlight, cooled by their own surfaces and costing no more per operation
  than computing on the ground.
exists:
  - text: Starcloud-1 launched in November 2025 carrying the first NVIDIA H100 GPU into orbit, and in December became the first spacecraft to train a language model in space, Karpathy's nanoGPT.
    url: https://www.starcloud.com/starcloud-1
    year: 2025
  - text: Google's Project Suncatcher proposes clusters of 81 TPU satellites flying within about a kilometre of each other, and has shown 1.6 Tbit/s between one pair of optical transceivers on the bench.
    url: https://research.google/blog/exploring-a-space-based-scalable-ai-infrastructure-system-design/
    year: 2025
  - text: The Suncatcher paper reports Trillium TPUs surviving a radiation dose equal to a five-year mission without permanent failure, and expects launch to low Earth orbit to reach about 200 dollars a kilogram by the mid-2030s.
    url: https://arxiv.org/abs/2511.19468
    year: 2025
  - text: Google put four TPUs into orbit on a prototype Suncatcher satellite on 1 October 2026, aboard SpaceX's Transporter-18.
    url: https://gcn.com/google-project-suncatcher-puts-four-chips/22176/
    year: 2026
  - text: NVIDIA describes Starcloud-1 as a 60 kg satellite, about the size of a small fridge, with 100 times more GPU compute than any previous space-based operation.
    url: https://blogs.nvidia.com/blog/starcloud/
    year: 2025
gap: >-
  The first orbital computers carry a handful of chips. A gigawatt needs square kilometres of solar
  array and radiator, chips that survive years of radiation, laser links fast enough to make many
  satellites act as one machine, and a launch price far below today's.
inventions: [compute-leaf]
scene:
  kind: compute
  focus: A cluster of compute satellites in tight formation, their solar wings toward the Sun and laser links flickering between them.
  params: { kind: swarm, racks: 800, radiators: 0.6, orbit: true }
