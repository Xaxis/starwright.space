id: compute-radiators
title: Radiators that let space computers run hot and light
domain: computation
stage: k09
needs: [cheap-launch]
summary: >-
  In space there is no air or water to carry heat away. Every watt a computer uses must leave as
  infrared light from a radiator, and a radiator sheds heat as the fourth power of its temperature
  (the Stefan-Boltzmann law, {stefan-boltzmann}). Radiators are the heaviest part of a computer in
  orbit, so the mass of orbital computing, and its cost to launch, is set by how hot its chips can
  run and how light its radiators can be.
target: >-
  Radiators of under 1 kg per kilowatt rejected, paired with chips that run hot enough to shrink
  them, so that a gigawatt of orbital computing weighs no more than its solar arrays, in service as
  industry moves to orbit around {year-k09}. A two-sided panel with emissivity 0.9 sheds about 830 W
  per square metre at 300 K, so at room temperature that target allows about 0.8 kg for each square
  metre of radiator, pipes and all; at 600 K it sheds sixteen times as much and may weigh about 13
  kg per square metre.
exists:
  - text: Each of the International Space Station's photovoltaic radiators rejects up to 14 kW to deep space through ammonia loops and weighs 741 kg, about 53 kg per kilowatt.
    url: https://www.nasa.gov/wp-content/uploads/2021/02/473486main_iss_atcs_overview.pdf
    year: 2006
  - text: Starcloud's white paper works out that a plate held at 20 °C with emissivity 0.92 radiates about 770 W from its two faces, and about 633 W net once the sunlight on one face and the light and heat from Earth are subtracted.
    url: https://www.starcloud.com/wp
    year: 2024
  - text: NASA Lewis's 1987 review of liquid droplet radiators, which spray a sheet of hot droplets across space and catch them again, put the best heat-pipe radiators at about 5 kg per square metre and found the measured radiation of droplet sheets in very good agreement with theory.
    url: https://ntrs.nasa.gov/api/citations/19870010920/downloads/19870010920.pdf
    year: 1987
  - text: NASA Glenn's silicon carbide JFET integrated circuits were the first to run for more than a year at 500 °C, and its 5 mm Generation 12 chips are meant for circuits as complex as microprocessor-based motor control.
    url: https://ntrs.nasa.gov/api/citations/20230002648/downloads/HiTEC2023ICPaperV5.pdf
    year: 2023
  - text: The same silicon carbide circuits ran for more than three weeks in a reproduction of the 460 °C, corrosive surface of Venus, with no cooling and no sealed enclosure.
    url: https://physicstoday.aip.org/news/electronics-robust-enough-for-venus
    year: 2017
gap: >-
  Today's space radiators weigh about 53 kg per kilowatt, fifty times the target, and run near room
  temperature because the silicon they cool must stay below about 85 °C. Chips that work at 600 K
  would cut the radiator sixteenfold, but the only logic proven for a year at 500 °C, silicon
  carbide, has so far run circuits the size of a 998-bit memory, not billions of transistors. No
  light radiator has yet run for years without leaking or degrading.
inventions: [hot-core-logic, compute-leaf]
scene:
  kind: compute
  focus: A small compute module in orbit behind broad radiator wings, glowing dull red in the infrared.
  params: { kind: datacentre, racks: 20, radiators: 1, orbit: true }
