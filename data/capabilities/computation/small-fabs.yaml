id: small-fabs
title: Chip fabs small enough for any city
domain: computation
stage: k08
needs: [automated-factories]
summary: >-
  Every machine the climb builds needs chips, and nearly all of them come from a few dozen giant
  fabs that cost tens of billions of dollars each and take years to build. That makes chips a
  bottleneck and a single point of failure. Fabs that fit in a room, need no cleanroom and no masks,
  and make useful chips in small batches would let any city, and later any space factory, make its
  own.
target: >-
  A fab the size of a shipping container that makes working logic and power chips at 130 nm or
  finer, from bare wafer to packaged part, with no cleanroom and no photomasks, for under 10 million
  dollars, in hundreds of cities by {year-k08} and as the pattern for fabs in space.
exists:
  - text: Japan's Minimal Fab, developed by AIST and the Fab System Research Consortium, makes semiconductors and MEMS on half-inch wafers for high-mix, low-volume production.
    url: https://www.minimalfab.com/en/about/greeting.php
    year: 2026
  - text: Sam Zeloof made a 100-transistor chip on a 10 µm polysilicon-gate process, the technology of Intel's first processor, in a home garage fab.
    url: http://sam.zeloof.xyz/second-ic/
    year: 2021
  - text: Fab2, founded by Sam Zeloof and Jim Keller, builds its own fab components and runs a 120,000 square-foot chip fab in Austin and a 30,000 square-foot plant in Lockhart, Texas, that makes fabs.
    url: https://fab2.com/
    year: 2026
  - text: The Hacker Fab, an open-source semiconductor fab started at Carnegie Mellon in January 2023, has been copied at Waterloo, Ohio State, UC Irvine, Wrocław and IIT Bombay.
    url: https://hackerfab.org
    year: 2026
  - text: Tiny Tapeout runs shared chip runs on SkyWater, IHP and GlobalFoundries processes, several a year through 2025 and 2026, so a small design can reach silicon for little money.
    url: https://tinytapeout.com/
    year: 2026
  - text: Multibeam sells a multicolumn electron-beam lithography system that writes patterns straight onto the wafer with no masks, which it rates at a hundred times faster time to pattern.
    url: https://www.multibeamcorp.com/
    year: 2026
  - text: TSMC's three fabs in Phoenix, Arizona, for 4 nm down to 2 nm chips, are expected to cost more than 65 billion dollars, with 6.6 billion dollars of US CHIPS Act funding, the scale a leading-edge fab now takes.
    url: https://www.nist.gov/chips/tsmc-arizona-phoenix
    year: 2025
gap: >-
  Small fabs today make simple chips slowly or do only some steps: a garage process at 10 µm, one
  half-inch wafer at a time. A set of masks costs more than a small run is worth, maskless writing
  is slow, and a cleanroom is a second building to run around the tools. No small fab yet makes a
  whole chip at 130 nm, wafer to package, at a price that competes.
inventions: [vacuum-fab]
scene:
  kind: field
  focus: Container fabs on city blocks, each one lit while it runs a batch.
  params: { unit: fab, count: 400, terrain: city }
