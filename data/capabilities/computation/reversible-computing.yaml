id: reversible-computing
title: Logic that recycles its own energy
domain: computation
stage: k09
needs: [abundant-compute]
summary: >-
  Landauer showed in 1961 that only erasing information must cost energy, {landauer-300k} per bit
  at room temperature. Everything else a computer does could, in principle, be done with almost no
  loss, if the charge that switches each gate is gently drawn back out and reused instead of dumped
  to ground. As Earth nears its heat ceiling, {earth-cap}, computing that recycles its energy is
  how thinking keeps growing without heating the planet.
target: >-
  Commercial chips whose logic recovers most of its switching energy through a resonant power
  clock, using a hundred to a thousand times less energy per operation than conventional chips of
  the same year, by the time Earth's industry reaches {power-k09} in {year-k09}.
exists:
  - text: Landauer's paper Irreversibility and Heat Generation in the Computing Process set the least energy of erasing a bit at kT ln 2.
    url: https://doi.org/10.1147/rd.53.0183
    year: 1961
  - text: Bennett proved that any computation can be done in a logically reversible way, keeping a record instead of erasing it.
    url: https://doi.org/10.1147/rd.176.0525
    year: 1973
  - text: Michael Frank argued in IEEE Spectrum that computing's future efficiency depends on reversible, adiabatic circuits.
    url: https://spectrum.ieee.org/the-future-of-computing-depends-on-making-it-reversible
    year: 2017
  - text: Vaire Computing taped out its first reversible computing chip in 2025, recovering 50 percent of the energy in its resonator circuit; Frank's Sandia work projects gains of up to 4,000 times.
    url: https://spectrum.ieee.org/reversible-computing
    year: 2025
  - text: Takeuchi, Yamanashi and Yoshikawa built a reversible logic gate from adiabatic superconducting circuits.
    url: https://doi.org/10.1038/srep06354
    year: 2014
  - text: The first measurement of Landauer's bound found the heat of erasure settling at kT ln 2 for slow erasures.
    url: https://www.nature.com/articles/nature10872
    year: 2012
gap: >-
  Adiabatic logic only saves energy if its power clock is a resonator that hands the energy back
  each cycle, and on-chip inductors lose much of it. Reversible designs need new logic styles,
  new design tools and more transistors per function, and they trade speed for energy. No
  reversible chip yet beats a conventional one on a whole workload.
inventions: [acoustic-clock-logic]
scene:
  kind: machine
  focus: A chip whose gates glow as charge flows in and back out again, the clock rocking like a pendulum.
  params: { shape: chip, spin: 0.3 }
