id: industrial-ai
title: AI that designs and runs industry
domain: computation
stage: k08
needs: [abundant-compute, ai-safety]
summary: >-
  A hundredfold buildout cannot wait for a hundredfold more engineers. AI already plans chemistry
  experiments, proposes new crystals, schedules data centres and steers a distillation column. The
  climb needs it to go further: to design whole factories from a specification, write their control
  code, run them, and learn from every one it builds, while people set the goals and the limits.
target: >-
  An AI that takes a product and a site and returns a plant design, its control code and its bill of
  materials, verified in simulation, nine in ten of which work the first time they are built; and AI
  operators that run plants within limits people set, so that industry can double every
  {doubling-time} by the time the first seed factory flies in {seed-year}.
exists:
  - text: Coscientist, driven by GPT-4, planned and ran chemistry experiments on its own, including optimising palladium-catalysed cross-coupling reactions.
    url: https://www.nature.com/articles/s41586-023-06792-0
    year: 2023
  - text: Berkeley Lab's A-Lab ran for 17 days of continuous operation and made 36 of 57 target inorganic compounds, planning its syntheses from the literature and interpreting its own results.
    url: https://www.nature.com/articles/s41586-023-06734-w
    year: 2023
  - text: Google DeepMind's GNoME found 2.2 million crystal structures below the stability line of previously known materials, improving the efficiency of materials discovery by an order of magnitude.
    url: https://www.nature.com/articles/s41586-023-06735-9
    year: 2023
  - text: Google DeepMind's AlphaEvolve found a scheduling rule for Google's data centres that has recovered, on average, 0.7 percent of the company's worldwide computing for more than a year.
    url: https://deepmind.google/blog/alphaevolve-a-gemini-powered-coding-agent-for-designing-advanced-algorithms/
    year: 2025
  - text: Yokogawa's reinforcement-learning controller ran a distillation column at an ENEOS Materials chemical plant for almost a year, steering valves that had needed experienced operators, and in 2023 became the first such AI formally adopted to control a plant directly.
    url: https://www.yokogawa.com/news/press-releases/2023/2023-03-30/
    year: 2023
  - text: DeepMind's control system cut the energy used to cool Google's data centres by up to 40 percent.
    url: https://deepmind.google/discover/blog/deepmind-ai-reduces-google-data-centre-cooling-bill-by-40/
    year: 2016
  - text: A deep reinforcement learning method laid out chip floorplans in hours that matched or beat human experts, and was used on Google's TPUs.
    url: https://www.nature.com/articles/s41586-021-03544-w
    year: 2021
gap: >-
  AI works on pieces: one experiment, one material, one scheduling rule, one control loop. Nothing
  yet takes a specification to a whole plant that is built and works first time; the A-Lab made 36
  of 57 targets inside a lab that people designed. The longest AI control of a real plant is one
  distillation column for about a year. Nothing proves an AI operator stays inside the limits it is
  given when it is pushed, and plant data is scattered and private, so the systems have little to
  learn from.
inventions: [plant-compiler, the-governor]
scene:
  kind: network
  focus: Designs flowing out from a central model to plants across the map, and measurements flowing back.
  params: { shape: flat, nodes: 900, clusters: 14, links: 0.5, pulses: 0.8 }
