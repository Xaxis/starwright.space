id: quantum-computing
title: Quantum computers that correct their own errors
domain: computation
stage: k08
needs: []
summary: >-
  Some of the climb's hardest design problems are quantum chemistry: catalysts that fix nitrogen or
  split water cheaply, battery and magnet materials, the surfaces where reactions happen. Classical
  computers can only approximate them. A quantum computer that corrects its own errors can
  simulate them directly, and design the materials the buildout runs on.
target: >-
  Error-corrected machines with thousands of logical qubits running billions of gates, enough to
  compute the reaction energies of molecules like FeMoco, the cofactor of the enzyme that fixes
  nitrogen, which is estimated to need about four million physical qubits running for four days. In
  service for materials and catalyst design well before {year-k08}.
exists:
  - text: Google's Willow chip ran the first surface code below threshold, 101 qubits at distance 7 with 0.143 percent error per cycle, the error falling by a factor of 2.14 at each step up in code size.
    url: https://www.nature.com/articles/s41586-024-08449-y
    year: 2024
  - text: Quantinuum's Helios has 98 fully connected trapped-ion qubits, 50 logical qubits and 99.921 percent two-qubit gate fidelity.
    url: https://www.quantinuum.com/products-solutions/quantinuum-systems/helios
    year: 2026
  - text: Harvard, MIT and QuEra used reconfigurable arrays of up to 448 neutral atoms to run all the key elements of a universal fault-tolerant architecture, with surface codes 2.14 times below threshold.
    url: https://arxiv.org/abs/2506.20661
    year: 2025
  - text: Caltech trapped more than 6,100 neutral-atom qubits in one optical tweezer array, with coherence times of 12.6 seconds.
    url: https://arxiv.org/abs/2403.12021
    year: 2025
  - text: IBM plans Starling, a fault-tolerant machine running 100 million gates on 200 logical qubits, by 2029 at Poughkeepsie.
    url: https://www.ibm.com/quantum/blog/large-scale-ftqc
    year: 2025
  - text: Lee and colleagues estimated that simulating FeMoco needs about four million physical qubits running for under four days, at 0.1 percent gate error and 1 microsecond error-correction cycles.
    url: https://arxiv.org/abs/2011.03494
    year: 2021
  - text: Lecocq and colleagues at NIST note that each superconducting qubit needs several coaxial lines from room temperature, whose heat load and bulk limit a processor to a few thousand qubits.
    url: https://www.nature.com/articles/s41586-021-03268-x
    year: 2021
gap: >-
  The best machines hold tens of logical qubits. FeMoco needs about four million physical qubits,
  some forty thousand times Helios's 98 and over six hundred times the largest atom array, and each
  logical qubit costs hundreds to thousands of physical ones. Superconducting machines run out of
  fridge cooling and wiring at a few thousand qubits; atom machines have yet to run deep circuits
  for days without losing atoms.
