id: abundant-compute
title: Computing for everyone, near the limits of physics
domain: computation
stage: k08
needs: [terawatt-solar-factories, photonic-computing, grid-storage]
summary: >-
  Computing is how the climb designs its machines, runs its factories and learns what to build next.
  It is the fastest-growing use of electricity, and it is still wasteful: a chip today spends
  {gpu-vs-landauer} more energy on each operation than the least physics allows, {landauer-300k} per
  bit erased at room temperature. Closing part of that gap lets computing multiply without taking
  the power the rest of the climb needs.
target: >-
  Enough computing that every person and every factory can use what they need as the climb passes
  {power-k08} in {year-k08}, grown on sunlight, at an energy per operation within a thousand times
  of {landauer-300k} against {gpu-energy-per-op} on the best accelerator today, so that computing
  stays a small share of the power while it multiplies many times over.
exists:
  - text: Data centres used about 485 TWh in 2025, 17 percent more than in 2024, and AI-focused data centres used 50 percent more. The IEA's central case roughly doubles the total to 950 TWh by 2030, about 3 percent of the world's electricity.
    url: https://www.iea.org/reports/key-questions-on-energy-and-ai/executive-summary
    year: 2026
  - text: Lawrence Berkeley National Laboratory found that US data centres used 176 TWh in 2023, 4.4 percent of US electricity, up from 58 TWh in 2014, and expects 325 to 580 TWh by 2028.
    url: https://www.energy.gov/articles/doe-releases-new-report-evaluating-increase-electricity-demand-data-centers
    year: 2024
  - text: Epoch AI estimates that the AI computing capacity sold each quarter has grown about 2.5 times a year since 2024, doubling about every 9 months, and reached 6.3 million H100-equivalents in the second quarter of 2026.
    url: https://epoch.ai/data-insights/ai-computing-capacity-additions-doubling
    year: 2026
  - text: Epoch AI's trends put GPU energy efficiency rising 34 percent a year since 2008, a doubling every 2.4 years.
    url: https://epoch.ai/trends
    year: 2026
  - text: AMD's Instinct MI355X, the accelerator this project's model takes as its reference, is rated at 5 thousand trillion dense 8-bit operations a second at a typical board power of 1,400 W.
    url: https://www.amd.com/en/products/accelerators/instinct/mi350/mi355x.html
    year: 2025
  - text: The most efficient supercomputer on the November 2026 Green500, KAIROS in Toulouse, does 73.28 billion 64-bit floating-point operations per joule on the HPL benchmark.
    url: https://top500.org/lists/green500/2026/11/
    year: 2026
  - text: Naffziger and Koomey found that computing's peak energy efficiency doubled about every 1.6 years from the first computers until about 2000, and only about every 2.6 years after.
    url: https://www.electronicdesign.com/technologies/embedded/digital-ics/processors/microprocessors/article/21802037/energy-efficiency-of-computing-whats-next
    year: 2016
gap: >-
  Demand is outrunning efficiency. The capacity sold each quarter doubles about every 9 months; GPU
  efficiency doubles every 2.4 years, so computing's share of electricity is rising. Chips still
  spend {gpu-vs-landauer} the Landauer bound on each operation, most of it charging and discharging
  wires and moving numbers to and from memory, and the target is nearly five orders of magnitude
  closer: about forty years at the GPU trend since 2008. Data centres also want power around the
  clock, which on a sun-powered grid means storage they mostly do not have.
inventions: [noon-chain, charge-well-engine]
scene:
  kind: compute
  focus: Halls of racks growing across a desert grid, each rack drawing less power per operation as the scene runs.
  params: { kind: datacentre, racks: 2000, radiators: 0.2 }
