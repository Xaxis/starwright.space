id: space-economy
title: An economy that runs in space
domain: economics
stage: k09
needs: [cheap-launch]
summary: >-
  Space industry today mostly sells to Earth: launches, satellite links, pictures. The climb needs
  an economy in space that buys and sells there, propellant at depots, oxygen and metal from the
  Moon, power from collectors, so that factories in orbit pay their own way and grow without waiting
  for budgets on Earth.
target: >-
  By the time the seed factory starts work in {seed-year}, markets in Earth orbit and on the Moon
  where propellant, water, oxygen, metal and power are bought and sold at published prices,
  thousands of tonnes a year, with enough private demand that space industry can double every
  {doubling-time}.
exists:
  - text: The Space Foundation put the global space economy at 686 billion US dollars in 2025, up 12 percent on the year before, with commercial activity 79 percent of it.
    url: https://www.spacefoundation.org/wp-content/uploads/2026/07/SF-GSE-REPORT-2026July-FOR-RELEASE.pdf
    year: 2026
  - text: The World Economic Forum and McKinsey projected in 2024 that the space economy would reach 1.8 trillion dollars by 2035, from 630 billion in 2023.
    url: https://www3.weforum.org/docs/WEF_Space_2024.pdf
    year: 2024
  - text: In 2018 NASA started Commercial Lunar Payload Services, buying deliveries to the Moon from private landers under contracts worth up to 2.6 billion dollars over ten years.
    url: https://www.nasa.gov/news-release/nasa-announces-new-partnerships-for-commercial-lunar-payload-delivery-services/
    year: 2018
  - text: In 2020 NASA agreed to buy lunar regolith collected by four companies for between 1 and 15,000 dollars each, 25,001 dollars in all, with ownership passing to NASA on the Moon.
    url: https://www.nasa.gov/news-release/nasa-selects-companies-to-collect-lunar-resources-for-artemis-demonstrations/
    year: 2020
  - text: In May 2025 the US Department of Energy agreed to buy three litres of helium-3 gathered on the Moon from Interlune, for delivery by April 2029, the first government purchase of a natural resource from space.
    url: https://www.interlune.space/press-release/u-s-department-of-energy-buys-helium-3-from-u-s-space-resources-company-interlune-in-historic-agreement
    year: 2025
  - text: In September 2025 Bluefors agreed to buy up to 10,000 litres of lunar helium-3 a year from Interlune, for delivery from 2028 to 2037.
    url: https://www.interlune.space/press-release/bluefors-to-source-helium-3-from-the-moon-with-interlune-to-power-next-phase-of-quantum-industry-growth
    year: 2025
  - text: In 2016 United Launch Alliance said it would pay about 3,000 dollars a kilogram for propellant in low Earth orbit and 1,000 dollars a kilogram at L1, and put the going rate on the lunar surface at about 500 dollars a kilogram.
    url: https://www.space.com/33297-satellite-refueling-business-proposal-ula.html
    year: 2016
gap: >-
  Almost every buyer of space goods today is a government or a company on Earth: four fifths of the
  686 billion dollar space economy is commercial, but nearly all of it sells services to the ground.
  The first contracts for a resource from the Moon, three litres of helium-3 for the US government
  and up to 10,000 litres a year for Bluefors, are for delivery to Earth. No one has yet sold a
  tonne of anything made in space to someone else in space, and transferring propellant between
  ships, which every depot needs, was still a plan in late 2026. The first resource plants cannot
  borrow against promises that are not binding contracts.
inventions: [depot-futures]
scene:
  kind: orbit
  focus: Depots in orbit and on the Moon, ships trading propellant between them.
  params: { stations: 0.5, depots: 0.7, collectors: 0.2 }
