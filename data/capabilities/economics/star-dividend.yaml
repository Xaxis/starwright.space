id: star-dividend
title: A share of the Sun for everyone
domain: economics
stage: type-2
needs: [shared-abundance, solar-system-governance, interplanetary-markets]
summary: >-
  The swarm turns the Sun's light into {type-2-power} of power, far more than people could ever
  spend on themselves, so the question becomes who decides what it is for. If it all belongs to
  whoever built the collectors, a few owners would hold a star's worth of power over everyone else.
  The climb needs a way to share the Sun's output that every person, on every world, can see is
  fair.
target: >-
  Every person holds an equal, permanent claim to at least 1 percent of the swarm's output, a share
  of {type-2-power} paid as power or its value, while markets allocate the rest to the uses that
  need it, under rules set by everyone who holds a share.
exists:
  - text: The 1979 Moon Agreement, which declares the Moon and its natural resources the common heritage of mankind, has 17 parties, after Saudi Arabia's withdrawal took effect in January 2024.
    url: https://treaties.un.org/Pages/ViewDetails.aspx?src=TREATY&mtdsg_no=XXIV-2&chapter=24&clang=_en
    year: 2024
  - text: Vietnam became the 78th nation to sign NASA's Artemis Accords on 28 October 2026.
    url: https://www.nasa.gov/artemis-accords/
    year: 2026
  - text: The UN space committee's working group on space resources issued draft principles in October 2026 that leave sharing the benefits of space resources voluntary.
    url: https://www.unoosa.org/unoosa/uploads/documents/pdf/copuos/lsc/space-resources/TranslatedDraftPrinciples2026/2615648E.pdf
    year: 2026
  - text: The International Seabed Authority governs the deep seabed and its resources as the common heritage of humankind on behalf of its 172 members.
    url: https://isa.org.jm/about-isa/
    year: 2026
  - text: Alaska's Permanent Fund has paid an equal dividend to every resident from resource income each year since 1982.
    url: https://pfd.alaska.gov/Division-Info/summary-of-dividend-applications-payments
    year: 2025
  - text: Posner and Weyl proposed in 2017 that owners of shared assets declare their own value, pay a tax on it and must sell to anyone who offers that price, which keeps assets in the hands that value them most.
    url: https://doi.org/10.1093/jla/lax001
    year: 2017
gap: >-
  Common heritage is written into treaties but has never been paid out to people. The Moon Agreement
  has 17 parties, while 78 nations have signed the Artemis Accords, and the UN's draft principles of
  2026 leave sharing benefits voluntary. Resource dividends exist only within single countries.
  Nothing yet says how the output of one machine the size of a solar system should be shared among
  the people of many worlds.
inventions: [heritage-dividend]
scene:
  kind: swarm
  focus: The swarm closed around the Sun, its output split into a share for every person and a share for everything else.
  params: { built: 1 }
