id: breakthrough-funding
title: Funding the breakthroughs the climb needs
domain: economics
stage: k08
needs: []
summary: >-
  Most of the climb's inventions, a seed factory, film collectors, mass drivers, are too big for a
  university lab, too early for venture capital and too risky for a company. Agencies such as DARPA,
  newer ones such as ARIA, and focused nonprofits have shown how to fund goal-driven programmes a
  market would not. The climb needs many more of them, aimed at its own gaps, and a fast way to fund
  the first decisive experiment of every invention this project lays out.
target: >-
  Every invention on the climb gets its first experiment funded within 12 months of being proposed,
  and its prototype within 3 years of a passed and repeated test, from programme funders, prizes and
  purchase commitments that judge it on measured milestones and publish every result, pass or fail.
  At the median cost of the first experiments this project lists, a few million dollars, that takes
  a few hundred million dollars a year for first tests and tens of billions for the prototypes and
  pilots that follow.
exists:
  - text: The National Academies' 2017 assessment of ARPA-E found programme directors set milestones with each performer and review them quarterly; 25 of 440 completed projects were ended early, most often for missing milestones.
    url: https://www.nationalacademies.org/read/24778/chapter/5
    year: 2017
  - text: DARPA's enacted budget for fiscal 2026 was 4.322 billion dollars.
    url: https://www.darpa.mil/about
    year: 2026
  - text: ARPA-E's enacted budget fell from 460 million dollars in fiscal 2025 to 350 million in fiscal 2026, and the request for 2027 is 200 million.
    url: https://www.energy.gov/documents/doe-fy-2027-volume-2-arpa-e
    year: 2026
  - text: The UK's 2025 Spending Review gave ARIA, its Advanced Research and Invention Agency, at least 1 billion pounds over the review period.
    url: https://www.gov.uk/government/publications/spending-review-2025-document/spending-review-2025-html
    year: 2025
  - text: Focused Research Organizations, incubated by Convergent Research, are nonprofits given 20 to 50 million dollars for 3 to 7 years to hit set technical milestones and produce public tools and data.
    url: https://www.convergentresearch.org/about-fros
    year: 2026
  - text: Kremer, Levin and Snyder reported that the 1.5 billion dollar advance market commitment for pneumococcal vaccines brought three vaccines to market and immunised more than 150 million children, saving an estimated 700,000 lives.
    url: https://doi.org/10.1257/pandp.20201017
    year: 2020
  - text: XPRIZE's water scarcity competition, with a 119 million dollar purse, advanced its semifinalists in May 2026.
    url: https://www.xprize.org/
    year: 2026
gap: >-
  Programme funders are few, national and small next to the climb: DARPA spends about 4 billion
  dollars a year, ARIA about a quarter of a billion pounds a year, ARPA-E 350 million and falling,
  while a single pilot plant on the climb can cost hundreds of millions. Each programme director can
  run only a few programmes, so few ideas get a hearing, and grants judge how plausible an idea
  looks rather than paying for the one test that would settle it. Few funders pay for work past the
  prototype, so pilots fall between research grants and project finance, and almost none treat space
  industry or new institutions as inventions to fund.
inventions: [first-test-fund, wright-commitment]
