id: buildout-finance
title: Paying for a hundredfold buildout
domain: economics
stage: k08
needs: []
summary: >-
  Growing from {power-now} to {power-k08} means building more power plants, lines and factories by
  {year-k08} than in all of history, and most of the growth must come in countries that use little
  energy today. Clean power is cheap to run but costly to build, so its price is mostly the price of
  money: where borrowing costs more, the same solar field yields dearer power. The climb needs
  capital that is cheap and plentiful everywhere, not only in rich countries.
target: >-
  Capital for clean energy, grids and industry at a cost close to the rates rich countries pay, in
  every country, growing in step with energy use that grows at {earth-growth}, so that the world
  reaches {power-k08} by {year-k08}.
exists:
  - text: The IEA expected global energy investment to reach 3.3 trillion US dollars in 2025, about 2.2 trillion of it for renewables, nuclear, grids, storage, low-emission fuels, efficiency and electrification.
    url: https://www.iea.org/reports/world-energy-investment-2025/executive-summary
    year: 2025
  - text: The IEA found in 2024 that the cost of capital for utility-scale solar in emerging and developing economies outside China is well over twice that in advanced economies.
    url: https://www.iea.org/reports/reducing-the-cost-of-capital/executive-summary
    year: 2024
  - text: TCX, a fund founded in 2007 to let lenders finance poorer countries in their own currencies, hedged in 104 currencies across 121 countries in 2026.
    url: https://www.tcxfund.com/
    year: 2026
  - text: Mission 300, run by the World Bank Group and the African Development Bank Group, aims to connect 300 million people in Africa to electricity by 2030.
    url: https://www.worldbank.org/en/programs/energizing-africa
    year: 2024
  - text: Way, Ives, Mealy and Farmer found in 2022 that a fast transition to clean energy is likely to save many trillions of dollars against a fossil-fuel system, because clean technologies keep getting cheaper as they are built.
    url: https://doi.org/10.1016/j.joule.2022.08.009
    year: 2022
gap: >-
  Clean energy investment goes mostly to a few large economies. Poorer countries pay much more to
  borrow, in currencies that can fall, so projects that would pay off are never built. Guarantees and
  currency hedges exist but are small next to the need, and no instrument yet turns the learning
  curve, the fact that each doubling of a technology makes it cheaper, into money up front.
inventions: [wright-commitment]
scene:
  kind: globe
  focus: Money reaching the sunniest places on Earth, their deserts filling with panels as capital there gets cheaper.
  params: { solar: 0.5, grid: 0.4, lights: 0.8, look: deserts }
