id: open-invention-finance
title: Paying inventors without locking ideas up
domain: economics
stage: k08
needs: [open-knowledge-base]
summary: >-
  Patents pay inventors by letting them charge more for a while, which also stops others building on
  the invention. For the climb that trade is costly: a seed factory or a cheaper way to make solar
  cells is worth most when every country and every world can copy it freely. The evidence is that
  locked-up knowledge slows the work that follows it. The climb needs ways to reward inventors at
  least as well as patents do while leaving the ideas open to all.
target: >-
  The key patents and know-how of the climb free for anyone to build within 5 years of their grant,
  with their inventors paid more than the patent would have earned them, its auction value times a
  markup of 1.5 to 2, so that open does not mean unpaid.
exists:
  - text: Kremer proposed in 1998 that governments buy patents at a price set by auction, times a markup, and place them in the public domain, with a few patents sold to the top bidder to keep bids honest.
    url: https://doi.org/10.1162/003355398555865
    year: 1998
  - text: In 1839 the French government bought the patent on the daguerreotype process and placed it in the public domain.
    url: https://www.nber.org/papers/w6304
    year: 1997
  - text: Moser and Voena found that when the US licensed German-owned chemical patents to American firms under the Trading with the Enemy Act, domestic invention in those fields rose by 20 percent.
    url: https://doi.org/10.1257/aer.102.1.396
    year: 2012
  - text: Williams found that Celera's intellectual property on human gene sequences cut later scientific research and product development on those genes by 20 to 30 percent.
    url: https://doi.org/10.1086/669706
    year: 2013
  - text: The Medicines Patent Pool reports that from 2010 to 2025 licences from 23 patent holders to 93 generic makers supplied 62 billion doses to 148 countries and saved 2.6 billion dollars.
    url: https://medicinespatentpool.org/progress-achievements/impact
    year: 2026
  - text: The WHO Pandemic Agreement, adopted on 20 May 2025, asks manufacturers in its pathogen-sharing system to give WHO rapid access to 20 percent of their real-time production in a pandemic.
    url: https://www.who.int/news/item/20-05-2025-world-health-assembly-adopts-historic-pandemic-agreement-to-make-the-world-more-equitable-and-safer-from-future-pandemics
    year: 2025
  - text: A 2022 White House policy requires research funded by US federal agencies to be free to read with no embargo, with agencies to comply by the end of 2025.
    url: https://bidenwhitehouse.archives.gov/ostp/news-updates/2022/08/25/ostp-issues-guidance-to-make-federally-funded-research-freely-available-without-delay/
    year: 2022
gap: >-
  Open access now covers much publicly funded research, but not the patents and know-how of the
  companies that turn research into products, and the evidence says that cost is real: a fifth to
  three tenths less follow-on research where gene sequences were locked, a fifth more invention
  where patents were opened. Patent buyouts have been proposed since 1998 and done once, famously,
  in 1839, but never run as a standing fund. The Medicines Patent Pool licenses rather than buys,
  and only for medicines. No fund exists to buy the climb's key patents into the open.
inventions: [climb-buyout]
scene:
  kind: network
  focus: Patents as locked nodes, opening one by one as they are bought, their links spreading to new builders.
  params: { shape: flat, nodes: 1000, clusters: 20, links: 0.5, pulses: 0.4 }
