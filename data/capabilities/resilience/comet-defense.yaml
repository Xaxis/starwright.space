id: comet-defense
title: Deflecting a comet on months of warning
domain: resilience
stage: planet
needs: [planetary-defense, interplanetary-transport]
summary: >-
  Asteroids give decades of warning once they are found. A comet falling in for the first time
  from the Oort cloud may be seen only a year or two before it arrives, moving far faster than any
  asteroid. By {year-planet} the industry spans the inner solar system and can hold interceptors
  ready far from Earth, so even a comet found late can be met far out.
target: >-
  Interceptors parked in deep space that can reach a newly found long-period comet within weeks,
  measure what each hit does, and change its path enough to miss Earth, the Moon or any settled
  world, with as little as 1 year of warning.
exists:
  - text: ESA's Comet Interceptor, due to launch in late 2028 or early 2029, will wait at the Sun-Earth L2 point for a long-period comet or interstellar object not yet discovered, then fly out to meet it.
    url: https://www.esa.int/Science_Exploration/Space_Science/Comet_Interceptor/Comet_Interceptor_factsheet
    year: 2026
  - text: The interstellar comet 3I/ATLAS was found on 1 July 2025 and reached perihelion about four months later, the short notice a fast interloper gives.
    url: https://science.nasa.gov/solar-system/comets/3i-atlas/3i-atlas-facts-and-faqs/
    year: 2025
  - text: Comet C/2013 A1 (Siding Spring) was discovered on 3 January 2013, far out from the Sun, and passed Mars at 139,500 km on 19 October 2014; for a time a collision with Mars could not be ruled out.
    url: https://mars.nasa.gov/comets/sidingspring/
    year: 2014
  - text: Comet Shoemaker-Levy 9 was discovered in March 1993, already torn into more than 20 pieces by Jupiter's gravity; the fragments hit Jupiter in July 1994.
    url: https://science.nasa.gov/solar-system/comets/p-shoemaker-levy-9/
    year: 1994
  - text: NASA's 2018 planetary defence strategy notes that a large comet from the outer solar system could appear and reach Earth with warning as short as a few months.
    url: https://www.nasa.gov/wp-content/uploads/2022/03/ostp-neo-strategy-action-plan-jun18.pdf
    year: 2018
  - text: NASA's NEO Surveyor, launching no earlier than September 2027, will look for comets as well as asteroids, in infrared light.
    url: https://science.nasa.gov/mission/neo-surveyor/
    year: 2026
gap: >-
  Nothing can launch toward a newly found comet in less than months, and the later a push comes,
  the larger it must be to make the comet miss. Comets are fragile and active, venting gas that
  changes their paths on its own, so a deflection is harder to plan and to check. Comet Interceptor
  will wait in space, but only to fly past one comet, not to push it; no interceptor is kept ready
  to deflect, and a late comet can give as little as 4 months from discovery to perihelion.
inventions: [impactor-train]
scene:
  kind: launch
  focus: A train of interceptors leaving a deep-space depot toward a comet still far out.
  params: { method: rocket, cadence: 0.7, world: asteroid }
