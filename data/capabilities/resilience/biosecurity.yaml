id: biosecurity
title: Making engineered pandemics hard to start
domain: resilience
stage: k08
needs: [programmable-biology]
summary: >-
  The climb needs biology as an engineering discipline, and the same tools that make crops and
  medicines could make a pathogen worse than any natural one. The defence is layered: every order
  for synthetic DNA screened, the most dangerous research kept under shared rules, and some lines,
  such as mirror life, not crossed at all.
target: >-
  Every gene synthesis provider and benchtop synthesizer in the world screening every order of 50 or
  more nucleotides, and every customer, against an up-to-date list of hazards, verifiably and for
  free, under shared international rules, with no gap a determined bad actor could slip through.
exists:
  - text: The International Gene Synthesis Consortium, an industry group, screens both the sequences of synthetic gene orders and the customers who place them, under a Harmonized Screening Protocol updated to version 3.1 in June 2026.
    url: https://genesynthesisconsortium.org/
    year: 2026
  - text: SecureDNA offers a free, cryptographically private system that screens every DNA order of 30 or more nucleotides against controlled sequences and their predicted functional variants.
    url: https://securedna.org/
    year: 2026
  - text: IBBIS gives away commec, a free open-source tool that screens a synthesis order against a hazard database in under a second and runs locally, so no sequence leaves the user.
    url: https://ibbis.bio/our-work/common-mechanism/
    year: 2026
  - text: A US national policy issued in November 2026 requires benchtop DNA synthesisers to make a sequence only on a valid authorisation from a verified screener, for orders of 50 nucleotides or more.
    url: https://www.whitehouse.gov/wp-content/uploads/2026/11/NSTM-6-NASS-Policy.pdf
    year: 2026
  - text: In December 2024 a group of scientists warned in Science that mirror bacteria, built from mirror-image molecules, could spread through the environment unchecked by natural controls and act as dangerous pathogens, and called for them not to be made.
    url: https://purl.stanford.edu/cv716pj4036
    year: 2024
  - text: In October 2025 Microsoft researchers showed that AI protein-design tools could rewrite toxins into tens of thousands of variants, many of which slipped past synthesis screening until the screeners were patched.
    url: https://erichorvitz.com/paraphrase.htm
    year: 2025
  - text: The Biological Weapons Convention bans biological weapons but has no inspectors, and its 189 states parties are still negotiating how to strengthen it.
    url: https://disarmament.unoda.org/en/our-work/weapons-mass-destruction/biological-weapons/biological-weapons-convention
    year: 2026
gap: >-
  The United States and the United Kingdom now push screening toward every provider and every
  benchtop machine, but most countries leave it voluntary, and the Convention still has no
  inspectors. Screening lists name known threats, and the 2025 work showed AI design tools can
  rewrite a hazard into forms no list holds; the patches that caught them have to keep pace with
  the tools.
inventions: [fold-screen]
scene:
  kind: cell
  focus: A microbe under the screen, its genome read and checked before it can be made.
  params: { type: microbe, organelles: 0.4, divide: false, glow: 0.6 }
