id: solar-storm-resilience
title: Riding out a Carrington-class solar storm
domain: resilience
stage: k08
needs: []
summary: >-
  Every century or two the Sun throws a storm at Earth strong enough to drive currents through
  long power lines and burn out the transformers that feed whole regions. A civilization that runs
  on electricity, and then on satellites, has to treat that as a certainty, not a risk. The fix is
  mostly engineering already understood: warning, blocking the currents, and spares.
target: >-
  Grids, pipelines and satellites that come through a storm larger than 1859's with no
  long outage: hours of warning from monitors upstream of Earth, currents blocked at every large
  transformer, a shared stock of spares that can replace any failed unit in days, and satellites
  that can ride out a sudden rise in drag.
exists:
  - text: The Carrington Event of 1 and 2 September 1859 drove currents through telegraph systems across Europe and North America until they failed, in some cases shocking their operators.
    url: https://en.wikipedia.org/wiki/Carrington_Event
    year: 1859
  - text: In March 1989 a smaller storm tripped protection on the Hydro-Quebec grid and cut power to more than six million people for nine hours.
    url: https://assets.lloyds.com/assets/pdf-solar-storm-risk-to-the-north-american-electric-grid/1/pdf-Solar-Storm-Risk-to-the-North-American-Electric-Grid.pdf
    year: 1989
  - text: Lloyd's and AER estimated a Carrington-level storm could leave 20 to 40 million people in the United States without power for 16 days to 1 to 2 years, at a cost of 0.6 to 2.6 trillion dollars, depending mostly on how many spare transformers exist.
    url: https://www.lloyds.com/news-and-insights/risk-reports/library/solar-storm
    year: 2013
  - text: In February 2022 a modest G2 storm warmed the upper atmosphere; 38 of 49 newly launched Starlink satellites re-entered from the extra drag.
    url: https://en.wikipedia.org/wiki/Starlink
    year: 2022
  - text: The storm of 10 and 11 May 2024 reached G5, the top of NOAA's scale, the most intense since 2003.
    url: https://en.wikipedia.org/wiki/May_2024_solar_storms
    year: 2024
  - text: NOAA's SOL-1 (formerly SWFO-L1) launched on 24 September 2025 to watch the solar wind from the Sun-Earth L1 point, upstream of Earth.
    url: https://en.wikipedia.org/wiki/Space_Weather_Follow_On-Lagrange_1
    year: 2025
  - text: NERC's standard TPL-007-4 requires North American grid planners to assess how their systems perform during geomagnetic disturbance events.
    url: https://www.nerc.com/pa/Stand/Reliability%20Standards/TPL-007-4.pdf
    year: 2020
gap: >-
  Warning from L1 is less than an hour. Few grids have blocking devices on their transformers, and
  large transformers are built to order, so a storm that destroys dozens could leave regions dark
  for months. Satellites in low orbits have little margin for a jump in drag. As space industry
  grows, more of the climb sits outside the atmosphere that shields the ground.
inventions: []
scene:
  kind: globe
  focus: Aurora over the poles as a storm arrives, and the grid holding its lights beneath it.
  params: { grid: 1, lights: 0.8, look: poles }
