id: carbon-drawdown
title: Taking carbon back out of the air
domain: environment
stage: k08
needs: [earth-monitoring, terawatt-solar-factories]
summary: >-
  Stopping emissions stops the rise; it does not bring the carbon back down. The air holds {co2-now}
  of CO2 and the excess will warm the planet for centuries unless it is removed. Removal takes
  energy, rock and land. On the way to {power-k08} energy stops being the limit, so the questions
  become how cheaply machines, rocks and plants can pull carbon out, how well each tonne can be
  measured, and where it can be stored for good.
target: >-
  Close the gap of about 5 billion tonnes a year of removal by 2050 between what countries plan and
  what Paris-consistent pathways need, then keep growing until the air returns toward 350 ppm, with
  every tonne measured and stored for thousands of years.
exists:
  - text: The State of Carbon Dioxide Removal report counts 2.2 billion tonnes of CO2 removed a year, 99.9 percent of it by forests and soils; novel methods remove about 2 million tonnes a year, and the gap between countries' plans and Paris-consistent scenarios grows to 5.2 billion tonnes a year by 2050.
    url: https://www.stateofcdr.org/asset/The-State-of-CDR-Executive-summary_Engish-June-2026.pdf
    year: 2026
  - text: CDR.fyi counts 50.5 million tonnes of durable removal bought since 2021 and about 3 percent of it delivered by late 2026; Microsoft has bought 74 percent of it, and its purchases fell 90 percent in 2026.
    url: https://www.cdr.fyi/blog/durable-cdr-market-update-carbon-unbound-europe-2026
    year: 2026
  - text: Climeworks' Mammoth plant in Iceland, built for up to 36,000 t a year, captured 105 t of CO2 in its first ten months of operation.
    url: https://heimildin.is/grein/24581/
    year: 2025
  - text: 1PointFive's Stratos plant in Texas, designed to capture up to 500,000 t of CO2 a year from the air, was going through start-up in January 2026.
    url: https://www.1pointfive.com/news/1pointfive-and-bain-company-announce-agreement-for-direct-air-capture-carbon-removal-credits
    year: 2026
  - text: Northern Lights can store 1.5 million t of CO2 a year under the North Sea, and plans to take more than 5 million t a year by 2028.
    url: https://norlights.com/news/northern-lights-phase-2-expanding-europes-co%e2%82%82-storage-capacity/
    year: 2026
  - text: In a three-year field trial in Minnesota, coarse crushed basalt caused no significant change in any of the soils it was spread on, while steel slag on acidic soil did.
    url: https://doi.org/10.3389/fclim.2025.1657058
    year: 2026
  - text: Woods Hole's LOC-NESS team released alkaline sodium hydroxide into the Gulf of Maine for six hours in August 2025, in a test of ocean alkalinity enhancement that had no measurable impact on ocean life.
    url: https://www.whoi.edu/press-room/news-release/oae-prelim/
    year: 2026
gap: >-
  Novel removal is about 2 million tonnes a year, under a two-thousandth of the 2050 gap. Buyers
  have contracted 50 million tonnes but received 3 percent, and one buyer holds three quarters of
  the market and is pulling back. Direct air capture plants have captured far less than their design
  rates: Mammoth took in 105 t in ten months against a design of 36,000 t a year. Rock weathering is
  cheaper but slow to verify, and coarse rock may do nothing measurable in three years. Permanent
  storage open to all is counted in millions of tonnes a year, against billions needed.
inventions: [shaded-sink]
scene:
  kind: field
  focus: Rows of air-capture towers and rock-spread fields drawing carbon from the sky.
  params: { unit: tower, count: 800, terrain: plain }
