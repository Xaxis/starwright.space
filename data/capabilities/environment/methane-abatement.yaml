id: methane-abatement
title: Cutting methane fast
domain: environment
stage: k08
needs: [earth-monitoring]
summary: >-
  Methane traps far more heat than CO2 while it lasts in the air, about a decade, so cutting it is the
  fastest brake on warming there is. It leaks from oil, gas and coal, and comes from cattle, rice
  paddies and landfills. Most of the energy sector's leaks could be stopped with tools that already
  exist, many at no net cost.
target: >-
  Cut human methane emissions at least 30 percent below 2020 levels by 2030 and by more than half by
  2040, and remove methane where it is concentrated, so that the amount in the air starts to fall.
exists:
  - text: The Global Methane Pledge, launched at COP26 in 2021 and now joined by 159 countries and the European Commission, commits to cut methane at least 30 percent from 2020 levels by 2030.
    url: https://www.globalmethanepledge.org/
    year: 2021
  - text: The IEA's Global Methane Tracker 2026 puts fossil fuel methane at 124 Mt a year, about 70 percent of it avoidable with existing technology and more than 35 Mt at no net cost.
    url: https://www.iea.org/files/8a2639fd-7883-4fe7-bbe7-4f97bc39e2ff/GlobalMethaneTracker2026.pdf
    year: 2026
  - text: The feed additive Bovaer (3-NOP) cuts methane from dairy cattle by about 30 percent on average and is authorised in 70 countries.
    url: https://www.dsm-firmenich.com/anh/products-and-services/products/methane-inhibitors/bovaer.html
    year: 2026
  - text: CH4 Global's seaweed-based feed for beef feedlots claims methane cuts of up to 90 percent, with beef from treated cattle on sale since September 2025.
    url: https://www.ch4global.com/
    year: 2025
  - text: NOAA measured global methane at 1,936 ppb in August 2026, after a rise of 4.4 ppb in 2025.
    url: https://gml.noaa.gov/ccgg/trends_ch4/
    year: 2026
gap: >-
  Methane in the air is still rising. Oil and gas leaks are cheap to fix but scattered across
  millions of sites, and many go unreported. Feed additives work only for animals fed in barns and
  feedlots, not for the grazing herds that are most of the world's cattle. Nothing yet removes methane
  from barn or mine air at the low concentrations where most of it is.
inventions: [barn-breather]
scene:
  kind: field
  focus: Dairy barns and feedlots across a plain, their vents clearing as the methane is caught.
  params: { unit: farm, count: 400, terrain: plain }
