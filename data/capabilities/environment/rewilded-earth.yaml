id: rewilded-earth
title: Giving Earth's land back to the wild
domain: environment
stage: type-1
needs: [biodiversity, abundant-food, orbital-industry]
summary: >-
  By Type I, reached in {year-type-1}, most heavy industry, computing and power collection run in
  space, and food is grown on far less land. Earth no longer has to carry them. Farming uses 44
  percent of habitable land today, most of it for livestock that supply less than a fifth of
  humanity's calories. As that land is freed, Earth can become wilder than it has been for thousands
  of years.
target: >-
  Half of Earth's {earth-land-area} of land returned to nature and linked by corridors that large
  animals use, with lost species brought back where their habitat returns and the land's carbon
  restored, while the people who live on and near that land are paid and live well.
exists:
  - text: Our World in Data finds agriculture uses 44 percent of the world's habitable land, 80 percent of it for livestock, which supply 17 percent of the world's calories.
    url: https://ourworldindata.org/global-land-for-agriculture
    year: 2019
  - text: Strassburg and colleagues found that restoring 15 percent of converted land in priority areas could avoid 60 percent of expected extinctions and sequester 299 billion tonnes of CO2.
    url: https://doi.org/10.1038/s41586-020-2784-9
    year: 2020
  - text: The EU Nature Restoration Regulation, in force since 18 August 2024, requires restoration measures on at least 20 percent of the EU's land and sea by 2030, with national plans due by September 2026.
    url: https://environment.ec.europa.eu/topics/nature-and-biodiversity/nature-restoration-regulation_en
    year: 2024
  - text: The Knepp estate in England sold its dairy herds and machinery in 2000 and let 3,500 acres of farmland go wild.
    url: https://knepp.co.uk/rewilding/background/
    year: 2002
  - text: Yellowstone released 41 wolves between 1995 and 1997, and the park's wolves have numbered 83 to 123 since 2009.
    url: https://www.nps.gov/yell/learn/nature/wolf.htm
    year: 2026
  - text: Rewilding Argentina reports that at least 50 jaguars live free in Iberá Park in 2026, where it has been returning them to the wild.
    url: https://www.rewildingargentina.org/projects/ibera
    year: 2026
  - text: Rewilding Europe counts around 7,500 European bison alive today, about 4,000 of them roaming free.
    url: https://rewildingeurope.com/rewilding-in-action/wildlife-comeback/bison/
    year: 2026
gap: >-
  Rewilding today works on estates and parks, from a few square kilometres to a few thousand,
  against the tens of millions of square kilometres that half of Earth's land would take. The
  largest commitment, the EU's, asks for restoration measures on a fifth of its land and sea, not
  for land to be handed back to the wild. No one has returned a region's farmland to nature at
  continental scale, and schemes that pay farmers to rest land, such as the US Conservation Reserve
  Program, rent it for 10 to 15 years, too short for forests and herds. The food, livelihoods and
  rights of the people on that land must come first, and animals moved into new ranges can fail or
  harm the places they are brought to.
inventions: [wild-lease]
scene:
  kind: globe
  focus: Continents turning green as farmland returns to forest and grassland, city lights gathered close.
  params: { green: 1, ice: 0.8, lights: 0.5, look: forests }
