id: sunlight-reflection
title: Cooling the planet quickly if warming runs ahead
domain: environment
stage: k08
needs: [earth-monitoring, planetary-coordination]
summary: >-
  Even as emissions fall and carbon is drawn down, the Earth will keep warming for decades.
  Reflecting a small share of sunlight back to space is the only known way to cool the planet within
  years: Pinatubo's eruption did it for almost two years in 1991. Whether to do it is a choice for
  the world's governments. Knowing whether it can be done safely is a job for research, and it has
  to start long before anyone might need it.
target: >-
  Know, from outdoor experiments and observation, how to reflect enough sunlight to offset 1 W/m² of
  warming, about 0.3 percent of the sunlight reaching Earth, what that does to rain, ozone and each
  region, and how to stop safely, so that any decision to use it, or not, is well informed by 2040.
exists:
  - text: The UK's Advanced Research and Invention Agency funds 22 teams in its 56.8 million pound Exploring Climate Cooling programme, including a limited number of small, controlled outdoor experiments.
    url: https://www.aria.org.uk/opportunity-spaces/resilient-climate-and-ecosystems/exploring-climate-cooling
    year: 2025
  - text: By April 2026 ARIA's teams were doing field work on sea ice in Nunavut and testing cloud brightening over the Great Barrier Reef, while its other three outdoor experiments were still in design and site selection.
    url: https://www.aria.org.uk/insights/2026/exploring-climate-cooling-a-year-of-progress
    year: 2026
  - text: NASA records that Mount Pinatubo put about 15 million tons of sulphur dioxide into the stratosphere in June 1991 and cooled the globe by about 0.6 °C for almost two years.
    url: https://science.nasa.gov/earth/earth-observatory/global-effects-of-mount-pinatubo-1510
    year: 1991
  - text: Keith and colleagues calculated that about 2.1 million tonnes a year of calcite particles could offset 1 W per square metre while increasing column ozone by 3.8 percent, unlike sulphate, which thins it.
    url: https://doi.org/10.1073/pnas.1615572113
    year: 2016
  - text: Stardust Solutions raised 60 million US dollars in October 2025, led by Lowercarbon Capital, to develop a reflective particle for the stratosphere that it says could be ready to deploy by the end of the decade.
    url: https://heatmap.news/climate-tech/stardust-geoengineering
    year: 2025
  - text: Southern Cross University's team sprayed 68 ml of sea water a second from 320 nozzles on a ship near the Great Barrier Reef in 2022, and aircraft found the spray plume just below the clouds, 700 to 900 m up.
    url: https://doi.org/10.1088/1748-9326/adccd7
    year: 2025
  - text: The Royal Society's 2025 briefing records that bans on solar geoengineering had passed in four US states and been proposed in 30 more, and that a cloud-brightening test in Alameda, California was stopped in June 2024.
    url: https://royalsociety.org/-/media/policy/projects/solar-radiation-modification/solar-radiation-modification-policy-briefing.pdf
    year: 2025
gap: >-
  Only a handful of small outdoor experiments have run, the largest spraying less than a tenth of a
  litre of sea water a second, and no research team has measured a release in the stratosphere; the
  only releases there come from a start-up, Make Sunsets, whose balloons of sulphur dioxide drew a
  demand for information from the US EPA in 2025. Sulphate aerosols, the best understood option,
  thin the ozone layer and heat the stratosphere; calcite, silica and engineered particles are
  untested outside the laboratory. Nobody can yet predict how regional rain would change. The rules
  that exist are mostly bans, in US states and in an EU scientific call for a moratorium, and no
  international body exists that could decide who may deploy it, or stop it.
inventions: [mesosphere-flake]
scene:
  kind: globe
  focus: Sunlight glancing off a faint bright veil high above the oceans.
  params: { look: oceans, ice: 0.5 }
