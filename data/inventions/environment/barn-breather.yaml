id: barn-breather
title: The Barn Breather
domain: environment
for: [methane-abatement]
pitch: >-
  A roof unit for cattle barns that oxidises the dilute methane in their exhaust air on a copper
  zeolite catalyst, keeping the heat it needs in a regenerative ceramic bed and topping it up from
  rooftop solar power, turning each methane molecule into one of CO2, which warms the climate about
  thirty times less over twenty years.
principle: >-
  Methane in barn air is dilute, 5 to 100 parts per million, far too thin to burn. Copper ions held
  in the cages of a zeolite, an aluminosilicate mineral, oxidise methane at those concentrations at
  200 to 350 °C, as Brenneis and colleagues at MIT and a KU Leuven and Stanford team have shown. The
  catch is energy, and the numbers are tight. At 50 ppm a cubic metre of air holds about 33 mg of
  methane, whose oxidation releases about 1.8 kJ, enough to warm that air by only 1.5 °C. Heating
  the air to 300 °C takes about 340 kJ. A regenerative bed, ceramic that the hot outgoing air heats
  and the cold incoming air takes heat back from, switching direction every minute as in the
  oxidisers that clean coal-mine ventilation air, can return 95 percent of that, leaving about 17 kJ
  per cubic metre to supply. The gain is the methane: 33 mg is worth about 2.6 g of CO2 over twenty
  years, at about 80 times CO2 by mass, net of the CO2 the oxidation makes. Supplying 17 kJ, about
  4.7 Wh, from grid power at 0.4 kg of CO2 per kWh emits about 1.9 g, so the unit barely pays; from
  rooftop solar at about 0.04 kg per kWh it emits about 0.2 g, a gain of more than ten to one. At 99
  percent recovery the trim heat falls to about 3 kJ. So the Breather runs on solar power, recovers
  at least 95 percent of its heat, and treats the air where and when methane is richest: barns
  closed for winter, when ventilation falls and concentrations reach 100 ppm, and the vents above
  manure stores, at hundreds to thousands of ppm.
buildsOn:
  - text: Brenneis and colleagues at MIT oxidised methane in simulated air at 2 ppm to 2 percent on a copper zeolite at 200 to 310 °C, converting 40 percent to all of it depending on how the bed was run, with stable activity over 300 hours.
    url: https://doi.org/10.1021/acsenvironau.1c00034
    year: 2021
  - text: A KU Leuven and Stanford team showed copper zeolites removing methane at 2 ppm in air, oxidising it to CO2 at 350 °C.
    url: https://doi.org/10.1021/acscatal.6c01909
    year: 2026
  - text: Abernethy, Kessler and Jackson found that oxidising methane above 1,000 ppm could avoid 0.2 °C of warming and above 10 ppm 0.4 °C, if thermal reactors run within about 3 °C of ambient on net.
    url: https://doi.org/10.1088/1748-9326/acf603
    year: 2023
  - text: Parker and colleagues measured 2 to 102 ppm of methane in New England dairy barns in winter, and found a catalytic oxidiser at 400 °C with 90 percent heat recovery is climate-positive above about 10 ppm on wind power and 33 ppm on solar power.
    url: https://doi.org/10.1021/acs.est.5c06595
    year: 2025
  - text: Kuipers and colleagues found that methane in open dairy barns averages 5 to 100 ppm, and that no technology yet captures and oxidises it cost- and climate-effectively at those levels, most needing more than 500 ppm.
    url: https://doi.org/10.3168/jds.2024-26154
    year: 2025
  - text: A regenerative thermal oxidiser tested at an inactive West Virginia coal mine destroyed 95 percent or more of the methane in 30,000 cubic feet a minute of simulated ventilation air.
    url: https://doi.org/10.2172/969298
    year: 2008
  - text: Melse and van der Werf's compost biofilter removed up to 85 percent of methane from manure-storage air at 500 to 5,500 milligrams per cubic metre.
    url: https://doi.org/10.1021/es048048q
    year: 2005
experiment:
  goal: Show that a copper zeolite bed with regenerative heat recovery destroys most of the methane in real dairy barn air, with a net climate gain on solar power.
  setup: >-
    A unit treating 2,000 cubic metres of air an hour at the ridge vent of a working dairy barn,
    with a regenerative ceramic heat exchanger, a 50 kg copper-mordenite bed, an electric trim
    heater fed by rooftop panels and a battery, and methane analysers at inlet and outlet. At 95
    percent recovery the unit needs about 9 kW of trim heat, so about 50 kW of panels with storage.
    A second unit runs on the vent of the farm's manure store.
  measure: Methane in and out; air flow; heat recovered; net energy drawn per tonne of methane destroyed; catalyst activity over months of barn dust, ammonia and humidity.
  succeedsIf: More than 70 percent of the methane destroyed at inlet concentrations of 20 to 100 ppm, with net energy use whose own emissions are under a tenth of the CO2-equivalent removed, sustained for six months.
  costUsd: 900000
  months: 15
path:
  - phase: bench
    what: One unit on one barn vent and one on a manure store.
    scale: About 2,000 cubic metres of air an hour each.
    proves: Methane destroyed per unit of energy in real barn air.
  - phase: prototype
    what: Units across a large dairy barn closed for winter, and one each on a manure store and a coal mine vent.
    scale: A barn of 500 cows.
    proves: The share of a whole barn's methane caught, season by season.
  - phase: pilot
    what: Units on 100 barns in three climates.
    scale: About 50,000 cattle.
    proves: Cost per tonne of CO2-equivalent, and maintenance in farm hands' hands.
  - phase: first-plant
    what: A factory making units for every enclosed barn, feedlot shed and manure store in one country.
    scale: About 5,000 barns and manure stores, about 1 million cattle.
    proves: The Breather can be built and sold at scale.
  - phase: fleet
    what: Units on barns, manure stores, mine vents, landfills and sewage works worldwide.
    scale: About 5 Mt of methane a year destroyed at barns, mines and landfills.
    proves: Concentrated methane sources can be cleaned up as well as cut back.
  - phase: civilization
    what: Every concentrated source of methane cleaned, alongside fixed leaks and new feeds.
    scale: About 20 Mt of methane a year, every housed animal, mine vent and landfill.
    proves: The amount of methane in the air falls back.
risks: >-
  A whole barn moves a great deal of air: heating all of it would take megawatts even with 90
  percent heat recovery, as Parker and colleagues found. The Breather therefore starts with the
  richest streams, winter barns and manure stores, and pushes heat recovery towards 99 percent,
  where the trim heat falls fivefold. Barn air carries dust, ammonia and moisture that may poison
  the catalyst; filters and regular regeneration come first, and other metal zeolites next. Most
  cattle graze outdoors, beyond the reach of any vent; the Breather covers only housed animals, and
  feed additives and breeding must cover the rest. If heat recovery falls short, net emissions could
  eat into the gain; then units run only on the richest air or only on surplus solar power.
scene:
  kind: machine
  focus: A ridge vent on a barn roof, its ceramic bed glowing faintly as clean air flows out.
  params: { shape: membrane, spin: 0.2 }
