id: protein-ladder
title: The Protein Ladder
domain: materials
for: [abundant-minerals, materials-recycling]
pitch: >-
  A short ladder of columns, each packed with a protein tuned to grip one rare earth a little harder
  than its neighbour, that separates all fifteen lanthanides in a dozen stages of water chemistry
  instead of hundreds of stages of solvent.
principle: >-
  The rare earths are hard to separate because their ions shrink by only 1 to 2 picometres from one to
  the next, from 103 picometres for lanthanum to 86 for lutetium. Solvent extraction exploits that tiny
  difference once per stage, so a plant needs hundreds of mixer-settler stages. Lanmodulin, a protein
  bacteria use to gather lanthanides, binds them through EF-hand loops far more tightly than it binds
  common ions such as calcium, and a metal-sensitive variant separated neodymium from dysprosium to
  over 98 percent purity in one stage, the work of many. The Protein Ladder
  immobilises a different engineered variant in each column, each chosen to split one pair of
  neighbours (light from heavy first, then pair by pair), and runs them as a simulated moving bed,
  the continuous counter-current chromatography the sugar industry uses: inlets and outlets step
  round a ring of columns so the solid appears to move against the liquid. Metal is loaded at
  near-neutral pH and released with dilute acid or citrate; the protein is reused for hundreds of
  cycles. Feed is any dilute leachate: magnet scrap, coal ash, phosphogypsum, mine tailings.
buildsOn:
  - text: Mattocks and colleagues' metal-sensitive lanmodulin dimer, which separated neodymium from dysprosium to more than 98 percent purity in one column stage (Nature, 2023).
    url: https://www.nature.com/articles/s41586-023-05945-5
    year: 2023
  - text: Simulated moving bed chromatography, run continuously at industrial scale for sugars and fine chemicals.
    url: https://en.wikipedia.org/wiki/Simulated_moving_bed
    year: 1961
  - text: Lynas, which runs one of the few solvent extraction separation plants outside China, as the baseline to beat on cost and purity.
    url: https://lynasrareearths.com/
    year: 2026
  - text: Cyclic Materials' collection and recovery of rare earths from end-of-life products, a source of magnet feed.
    url: https://cyclicmaterials.earth/
    year: 2026
experiment:
  goal: Separate the four magnet rare earths (neodymium, praseodymium, dysprosium, terbium) from leached magnet scrap to magnet grade in a few protein stages.
  setup: >-
    Three engineered lanmodulin variants immobilised on porous silica in eight 1-litre columns, run
    as a small simulated moving bed. The feed is an acid leach of 10 kg of shredded
    neodymium-iron-boron magnets, with the iron removed first by precipitation.
  measure: Purity and recovery of each element out; number of stages used; cycles before the protein loses a fifth of its capacity; acid and base used per kilogram of oxide.
  succeedsIf: Neodymium-praseodymium and dysprosium-terbium each come out above 99.5 percent purity with over 95 percent recovery in no more than four stages, and the protein keeps 80 percent of its capacity after 500 cycles.
  costUsd: 1500000
  months: 15
path:
  - phase: bench
    what: The eight-column ring on magnet leachate.
    scale: About 1 kilogram of oxide a week.
    proves: Magnet-grade purity in a handful of stages, and the protein's working life.
  - phase: prototype
    what: All fifteen lanthanides plus yttrium separated from a mixed concentrate, with a variant for each split.
    scale: About 1 tonne of oxide a year.
    proves: The full ladder works on real ore, not just on magnets.
  - phase: pilot
    what: A plant beside a coal ash pond or phosphate works, fed its waste leachate.
    scale: About 100 tonnes of oxide a year.
    proves: Dilute waste is a paying ore when separation is cheap.
  - phase: first-plant
    what: A commercial separation plant outside the countries that refine today, with its own protein fermentation.
    scale: About 5,000 tonnes of oxide a year.
    proves: Cost per kilogram below solvent extraction, with no organic solvent waste.
  - phase: fleet
    what: Ladders at mines, recyclers and ash ponds on every continent.
    scale: About 100,000 tonnes of oxide a year.
    proves: The choke point in rare earths is gone.
  - phase: civilization
    what: Ladders that win rare earths and other trace metals from regolith leachate on the Moon, where the protein is grown in the habitat's bioreactors.
    scale: The trace metals in a {seed-mass} seed's throughput.
    proves: Trace elements can be won anywhere water and biology can go.
risks: >-
  Proteins may foul or denature in real leachates full of iron, aluminium and organics; the fallback
  is a cleaner pre-treatment, or tougher variants evolved in the lab against that feed. Adjacent
  heavy rare earths differ least, and some splits may need more stages than planned; a hybrid plant
  would leave those to a short solvent cascade. Protein cost may dominate at scale unless lifetimes
  reach thousands of cycles, which is the number the bench must find.
scene:
  kind: lattice
  focus: A lanmodulin protein closing around one rare earth ion and passing its neighbour by.
  params: { structure: protein, defects: 0.05 }
