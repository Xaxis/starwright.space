id: carbonyl-burrow
title: The Carbonyl Burrow
domain: materials
for: [asteroid-mining]
pitch: >-
  A sealed refinery that eats into a metal asteroid without cutting it: warm carbon monoxide flows
  over the metal face, turns iron, nickel and cobalt into gases, and carries them out to be laid
  down again as pure metal parts, leaving the platinum metals behind as a rich sludge.
principle: >-
  Nickel reacts with carbon monoxide near 50 degrees Celsius to form nickel tetracarbonyl, a gas that
  decomposes back to pure metal near 230 degrees; iron forms iron pentacarbonyl at raised pressure
  near 150 degrees, and cobalt a carbonyl in the same range. The Mond process has used this to refine
  nickel for over a century, and it is reversible, so the carbon monoxide is recycled, under 0.1
  percent lost per pass. Few other elements form carbonyls under these conditions, so the platinum
  group metals that metal asteroids are expected to carry are left behind untouched. The
  Burrow is a pressure-tight bell sealed by a soft-metal gasket against a patch of the asteroid's
  metal face that it first mills flat. Concentrated sunlight warms the face; carbon monoxide
  circulates, reacts and leaves loaded with carbonyl vapour; the bell advances as the face recedes, at
  least a millimetre a day below 20 bar.
  Outside, the vapour passes over heated mandrels, where it deposits pure metal in the shape of the
  mandrel (vapour forming), so the refinery's output is finished shells, sheets and tubes, not ore.
  No drill, no chips, nothing thrown loose in weightlessness.
buildsOn:
  - text: The Mond process, which since the 1890s has refined nickel by forming and decomposing nickel carbonyl.
    url: https://en.wikipedia.org/wiki/Mond_process
    year: 1890
  - text: CVMR, which refines nickel, iron and other metals by chemical vapour metal refining and sells them as fine powders.
    url: https://cvmr.ca/
    year: 2026
  - text: NASA's Psyche mission to a metal-rich asteroid, which will show what such a body is made of and how it is built.
    url: https://science.nasa.gov/mission/psyche/
    year: 2023
  - text: AstroForge's commercial missions toward refining asteroid metal.
    url: https://www.astroforge.com/
    year: 2026
experiment:
  goal: Measure how fast warm carbon monoxide eats into solid iron-nickel meteoritic metal, and how cleanly it leaves the platinum metals behind.
  setup: >-
    A pressure cell holding a 50 kg slab of iron meteorite (or an iron-nickel-cobalt alloy spiked
    with platinum group metals to meteoritic grade), its exposed face heated by a lamp array, with
    carbon monoxide circulating at controlled pressure and temperature to a decomposer with heated
    mandrels.
  measure: Face recession rate and metal removed per square metre per hour across temperature and pressure; composition of the deposited metal; enrichment of platinum metals in the residue; carbon monoxide lost per cycle.
  succeedsIf: The face recedes at least 1 mm a day below 20 bar, the deposited metal is over 99.5 percent iron, nickel and cobalt, the residue carries over 90 percent of the platinum metals, and less than 0.1 percent of the carbon monoxide is lost per pass.
  costUsd: 2000000
  months: 18
path:
  - phase: bench
    what: The pressure cell on meteorite metal.
    scale: About 5 kilograms of metal a week.
    proves: Rates, purity and residue enrichment on real asteroid-like metal.
  - phase: prototype
    what: A sealed bell clamped to a metre-wide slab in a vacuum chamber, advancing as it eats.
    scale: About 1 tonne a month.
    proves: The seal holds and the bell can follow a receding, uneven face.
  - phase: pilot
    what: A Burrow on a small metal near-Earth asteroid, returning platinum metal concentrate and making its own tanks.
    scale: About 50 tonnes a year.
    proves: The chemistry works in microgravity on a real body.
  - phase: first-plant
    what: Burrows across a metal asteroid, feeding a factory there.
    scale: About 5,000 tonnes a year.
    proves: Asteroid metal at a cost below lunar metal.
  - phase: fleet
    what: Burrows made by the factories they feed, spreading through the belt.
    scale: Millions of tonnes a year and doubling every {doubling-time}.
    proves: The belt can feed industry without people on site.
  - phase: civilization
    what: The metal for the swarm's frames and machines, from the belt's {asteroid-belt-mass}, of which the industry can use {asteroid-usable}.
    scale: A large share of the {swarm-full-mined} the swarm must process.
    proves: The asteroids feed the climb to Type II.
risks: >-
  Carbonyl formation may be too slow on massive metal, which reacts best when finely divided; the
  next try would roughen the face with a laser or an electrochemical etch to raise its area. Sulfur
  and carbon in the metal may passivate the face or poison the reaction; the bench measures this on
  real meteorites. Sealing against a cratered, rough surface may leak; a fallback is to carve blocks
  free and feed them into a closed retort.
scene:
  kind: machine
  focus: A pressure bell clamped to a metal asteroid, its decomposer outside laying down bright metal shells.
  params: { shape: vehicle, spin: 0.1 }
