id: ribbon-draw
title: The Ribbon Draw
domain: manufacturing
for: [collector-film-manufacture]
pitch: >-
  Draw collector film the way optical fibre is drawn: soften a slab of rock-made glass and pull it,
  in vacuum and weightlessness, into a ribbon a few micrometres thick and metres wide, coating it in
  line as it runs, at metres per second.
principle: >-
  Hot glass flows like thick honey and can be stretched almost without limit while it stays soft;
  optical fibre is drawn from a rod tens of millimetres across down to a hair at tens of metres per
  second, and thin display glass is made by drawing a sheet down from a slot. Mass is conserved, so
  a slab drawn a thousand times longer becomes a thousand times thinner, with edge rollers holding
  its width while its thickness falls. On Earth gravity sags the ribbon and air cools it unevenly;
  in orbit there is neither, and a micrometre ribbon radiates its heat to space in a fraction of a
  second, so it sets almost as it leaves the hot zone, its thickness held by the temperature profile
  across the slot. The Ribbon Draw is a slab feeder, a heated slot and draw zone with zoned radiant
  heaters, edge rollers, and then the coating stations that need no chamber in space: evaporators
  that lay down aluminium and the absorber, then a thin glass cover, as the ribbon passes. A
  metre-wide ribbon at 10 m/s is 10 square metres a second, about 300 square kilometres a year per
  line, from a fraction of a kilogram of glass a second.
buildsOn:
  - text: Nippon Electric Glass's G-Leaf, ultra-thin glass handled roll to roll below 100 micrometres.
    url: https://www.neg.co.jp/en/products/g-leaf/index.html
  - text: Basalt fibre, drawn from melted rock, proof that rock glass can be drawn continuously.
    url: https://en.wikipedia.org/wiki/Basalt_fiber
  - text: First Solar's in-line deposition of thin-film cells directly onto glass, the model for coating in line.
    url: https://www.firstsolar.com/
  - text: IKAROS's membrane with integrated thin-film cells, the collector the ribbon replaces.
    url: https://en.wikipedia.org/wiki/IKAROS
experiment:
  goal: Draw lunar simulant glass into a continuous ribbon about ten micrometres thick, and coat it in line, at a speed that scales.
  setup: >-
    A redraw tower in a vacuum chamber, fed a 2 mm by 200 mm slab of glass melted from lunar mare
    simulant, with a zoned radiant draw furnace, edge rollers, a laser thickness gauge, an in-line
    aluminium evaporator, and a winding drum.
  measure: Thickness and its variation along and across the ribbon; draw speed; pinholes and inclusions per square metre; bend radius before breaking; reflectance of the coated ribbon; continuous length before a break.
  succeedsIf: The tower draws 100 m of continuous ribbon at least 50 mm wide and 10 micrometres thick within 10 percent, at 1 m/s or faster, with fewer than one pinhole per square metre, bending to a 5 mm radius, and coated to at least 85 percent reflectance.
  costUsd: 2200000
  months: 18
path:
  - phase: bench
    what: The redraw tower on simulant glass.
    scale: Hundreds of metres of narrow ribbon.
    proves: Rock glass can be drawn to collector thickness.
  - phase: prototype
    what: A half-metre-wide draw flown on a free-flying platform in orbit, fed Earth glass.
    scale: Square kilometres before it is retired.
    proves: Drawing and coating work in weightlessness and vacuum, without a chamber.
  - phase: pilot
    what: A line beside the lunar seeds, fed glass from the regolith refinery and launched to orbit as slabs.
    scale: Hundreds of square kilometres a year.
    proves: Collector film from rock at a known cost.
  - phase: first-plant
    what: A ring of lines making the first collectors at scale, built by the seeds.
    scale: The share of output that becomes collectors, {collector-share}.
    proves: Film supply keeps pace with the industry's doubling every {doubling-time}.
  - phase: fleet
    what: Lines built near Mercury and the asteroids, each copied by the factories it serves.
    scale: Square kilometres a minute per plant, across the inner system.
    proves: The swarm's area can be made as fast as its mass can be mined.
  - phase: civilization
    what: The film of the whole swarm.
    scale: "{swarm-full-area} at {collector-density}"
    proves: A star can be wrapped in drawn glass.
risks: >-
  Thickness may wander as the ribbon thins, because thin spots cool and stiffen faster and slow
  their own thinning (which helps) or thin further (which does not); the bench measures which, and
  closed-loop heater control on the laser gauge is the first answer. Ribbons may break at every
  inclusion; melt fining and filtering would be added, and the line designed to rethread itself.
  Absorber layers may need a cooler substrate than the line provides; then the ribbon is wound and
  coated on a second pass.
scene:
  kind: machine
  focus: A glowing slab of glass drawn down into a bright ribbon that streams out into space.
  params: { shape: sail, spin: 0.2 }
