id: orbital-risk-permits
title: Orbital Risk Permits
domain: governance
for: [orbital-traffic]
pitch: >-
  A cap on the total collision risk each band of orbits may carry, split into tradable permits: an
  operator must hold permits for the risk its satellites add, and gets them back when it removes
  them.
principle: >-
  Debris is a textbook negative externality: each operator gains from launching but bears only a
  small part of the collision risk it creates for others, so a shared orbit is overused: Hardin's
  tragedy of the commons, here with a tipping point, the Kessler cascade. Rao, Burgess and Kaffine
  showed a fee per satellite-year could multiply the industry's value. Permits reach the same end by
  fixing quantity rather than price, which is the safer choice near a tipping point: Weitzman showed
  that when harm rises steeply past a threshold, setting the quantity beats setting the price. Each
  band of altitude gets a risk budget, set from a physics model of the debris so that the band stays
  below its runaway threshold. Each object is scored by its expected contribution to collisions over
  its life (mass, area, altitude, ability to manoeuvre, and the odds it is disposed of on time), as
  the Space Sustainability Rating already scores missions. Operators buy permits at auction and trade
  them. A satellite that leaves orbit on schedule returns its permits, and a removal company earns
  permits for every dead object it brings down, which gives the debris already in orbit a buyer.
buildsOn:
  - text: Rao, Burgess and Kaffine's 2020 estimate that orbital-use fees could more than quadruple the long-run value of the satellite industry.
    url: https://doi.org/10.1073/pnas.1921260117
  - text: Kessler and Cour-Palais's 1978 model of how collisions feed a growing debris belt.
    url: https://doi.org/10.1029/JA083iA06p02637
  - text: The FCC's 2022 rule that low-orbit satellites leave orbit within five years of their mission's end.
    url: https://docs.fcc.gov/public/attachments/FCC-22-74A1.pdf
  - text: The Space Sustainability Rating, begun by the World Economic Forum in 2016 and run since 2021 with EPFL, which scores missions on their debris risk.
    url: https://spacesustainabilityrating.org/
  - text: The US Acid Rain Program, the first national cap and trade scheme, which helped cut annual sulphur dioxide emissions by over 95 percent.
    url: https://www.epa.gov/acidrain/acid-rain-program-results
  - text: The EU Emissions Trading System, a cap and trade market running since 2005.
    url: https://climate.ec.europa.eu/eu-action/eu-emissions-trading-system-eu-ets/what-eu-ets_en
experiment:
  goal: Show that a risk-permit market keeps a simulated band of orbits below its runaway threshold at lower cost than per-satellite rules, and that operators can work with it.
  setup: >-
    Couple an open debris-evolution model to a trading platform. Forty engineers and business staff
    from satellite operators each run a simulated constellation with its real economics over 50
    simulated years, under three regimes in turn: today's rules, a fee per satellite-year, and
    tradable risk permits with credits for removing debris.
  measure: Collision risk in each band over time; whether any band crosses its runaway threshold; the value of services the constellations deliver; permits earned by removing debris.
  succeedsIf: Under permits no band crosses its threshold in any run, and delivered value is at least 20 percent higher than under today's rules, equal to or better than under the fee.
  costUsd: 600000
  months: 12
path:
  - phase: bench
    what: The coupled debris model and trading experiment with operators' staff.
    scale: 40 participants, 50 simulated years.
    proves: Permits hold the cap at least cost, and operators can use them.
  - phase: prototype
    what: A shadow market in which real operators report their satellites and plans, receive risk scores and trade permits with no money changing hands, alongside a national traffic system.
    scale: Tens of operators, thousands of satellites.
    proves: Risk scores can be computed for real objects and are accepted as fair.
  - phase: pilot
    what: One licensing state makes permits binding for the satellites it licenses, with credits for removed debris.
    scale: That state's share of low Earth orbit.
    proves: A binding market works with real money, and removal companies get paid.
  - phase: first-plant
    what: The main licensing states link their permit registers into one market per band of orbits.
    scale: Every major operator in low Earth orbit.
    proves: A shared cap can be run across borders.
  - phase: fleet
    what: The market extends to high orbits, the space between Earth and the Moon, and the lanes used by ships and mass-driver cargo.
    scale: Earth orbit to the Moon.
    proves: The same rules manage traffic of every kind.
  - phase: civilization
    what: Every orbit the swarm and its industry use carries a risk budget, so a trillion collectors fly without a cascade.
    scale: "The swarm at {swarm-radius} from the Sun"
    proves: Orbits stay a renewable resource as the climb fills them.
risks: >-
  Risk scores will be contested, and a wrong model sets the wrong cap; the model is published and
  recalibrated every year against the fragments actually observed. States outside the market could
  launch freely and ride on others' restraint; tying landing rights and spectrum coordination to
  holding permits makes that costly. Auction prices could shut out small operators and poorer
  countries; a share of permits can be reserved for them at no cost, as cap and trade schemes do for
  new entrants.
scene:
  kind: orbit
  focus: A crowded band of orbits thinning as permits retire dead satellites and debris.
  params: { stations: 0.4, depots: 0.3, radiators: 0.2 }
