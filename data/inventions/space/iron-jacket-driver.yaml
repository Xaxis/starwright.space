id: iron-jacket-driver
title: The Iron Jacket Driver
domain: space
for: [mass-drivers, lunar-industry]
pitch: >-
  A lunar mass driver with no buckets: each slug of regolith is cast inside a thin shell of iron
  from the lunar oxygen plant, and the shell itself is what the coils push.
principle: >-
  O'Neill's mass drivers carried payloads in buckets with their own superconducting coils, which
  had to be slowed and sent back after every shot. That halves a track's use and puts the most
  complex part where the forces are greatest. The Iron Jacket Driver drops the bucket. Making oxygen
  by electrolysing molten regolith leaves molten iron behind, and the driver casts that iron into
  thin shells around cores of regolith or slag. Each coil along the track switches on just ahead of
  a passing slug; its rising field induces currents in the conducting shell and, acting on them and
  on the iron's magnetism, pulls the slug forward, the principle of an induction coilgun. To reach
  lunar escape speed, about 2.4 km/s, at 1,000 g takes a track only about 300 m long. Nothing comes
  back down the track, which is just coils and switches, and every slug is both armature and cargo.
  A catcher at L2 collects the stream.
buildsOn:
  - text: NASA's 1977 Ames summer study (SP-428, 1979) designed lunar mass drivers launching up to 600,000 metric tons a year, with payloads in recirculating buckets carrying superconducting coils.
    url: https://ntrs.nasa.gov/citations/19790024054
    year: 1979
  - text: O'Neill and Kolm's first mass driver model, built at MIT in 1976 and 1977, fired at 40 m/s and 33 g.
    url: https://en.wikipedia.org/wiki/Mass_driver
    year: 1977
  - text: Allanore, Yin and Sadoway's anode for molten oxide electrolysis, which releases oxygen and leaves molten metal, the route by which lunar industry gets its iron (Nature, 2013).
    url: https://doi.org/10.1038/nature12134
    year: 2013
  - text: The Lunar Sourcebook finds the native iron grains in lunar soil mostly locked inside glassy agglutinates and "unlikely to be a convenient large-scale source of Fe", which is why the jackets use electrolysis iron instead.
    url: https://www.lpi.usra.edu/publications/books/lunar_sourcebook/pdf/Chapter11.pdf
    year: 1991
  - text: The US Navy's EMALS catapult drives a 91 m linear motor with up to 484 MJ per launch from flywheel alternators, in service since 2017.
    url: https://en.wikipedia.org/wiki/Electromagnetic_Aircraft_Launch_System
    year: 2017
experiment:
  goal: Launch iron-jacketed simulant slugs with a bucketless coilgun and measure its efficiency, the spread in launch speed and whether the jackets survive.
  setup: >-
    A 10 m coilgun of 40 stages in a vacuum tube, with solid-state switches and capacitor banks,
    firing 100 gram slugs: lunar simulant cores in 1 mm cast iron shells. Laser gates and high-speed
    cameras at the muzzle; a sand catcher at the end.
  measure: Muzzle speed and its shot-to-shot spread, the share of stored electrical energy that becomes motion, jacket deformation and heating, and whether the cores hold together.
  succeedsIf: Muzzle speed above 300 m/s with shot-to-shot spread under 0.1 percent, at least 30 percent of the stored energy turned into slug motion, and jackets intact.
  costUsd: 1500000
  months: 12
path:
  - phase: bench
    what: The 10 m coilgun on Earth.
    scale: 100 gram slugs at 300 m/s.
    proves: Bucketless launch with precise speed.
  - phase: prototype
    what: A 100 m track in a vacuum tunnel firing 1 kg slugs at 1 km/s.
    scale: Thousands of shots.
    proves: Speed and aim at a large share of lunar escape speed, and how fast the track wears.
  - phase: pilot
    what: The first lunar driver, a few hundred metres long and built largely by the seed industry, launching slugs to a catcher at L2.
    scale: Thousands of tonnes a year.
    proves: Aim over the 60,000 km to L2, and catching the stream.
  - phase: first-plant
    what: A driver feeding the factories at L2 or L5 every day.
    scale: Hundreds of thousands to millions of tonnes a year.
    proves: Lunar mass delivered to orbit for less than any mass lifted from Earth.
  - phase: fleet
    what: Drivers on the Moon, then built again on the asteroids and Mercury, where metal-rich rock suits the design.
    scale: Tens of drivers across the inner system.
    proves: The design travels to other worlds.
  - phase: civilization
    what: Mercury's drivers throwing the mass of the swarm.
    scale: "{swarm-full-mined} over the climb to Type II"
    proves: The climb is never short of mass.
risks: >-
  Iron saturates magnetically and conducts less well than aluminium or copper, which may cap the
  push at high speed; the fallback is a thin aluminium band around the jacket, also made from
  regolith. Slugs may drift off aim over tens of thousands of kilometres, so the plan adds trim coils
  just past the muzzle that nudge each slug onto line. Catching a stream of slugs at L2 is unproven,
  and a miss becomes debris between the Earth and the Moon; slugs are aimed so that a miss falls back
  to the Moon or leaves the Earth and Moon system, never into Earth orbit.
scene:
  kind: launch
  focus: Iron-jacketed slugs leaving a coil track on the Moon, one every few seconds.
  params: { method: mass-driver, cadence: 1, world: moon }
