id: spun-shell
title: The Spun Shell
domain: space
for: [space-habitats, interplanetary-transport]
pitch: >-
  A habitat hull made the way pipes are: molten slag poured into a spinning form in orbit, so that
  the spin that will give its people gravity also casts the walls that shield them.
principle: >-
  Centrifugal casting makes iron pipes by pouring melt into a mould spun to 60 to 80 g, and 8.4 m
  telescope mirrors are spin-cast from molten glass at 5 rpm; the spin flings the melt outward into
  an even, dense wall. In orbit there is no
  gravity to pull the melt off centre, so the method can scale up without a heavy mould. Slag left
  over from taking oxygen and metal out of lunar or asteroid rock is melted with concentrated
  sunlight and poured onto the inside of a spinning cylindrical membrane. The melt spreads into a
  wall of even thickness and cools as cast basalt or glass ceramic, and the next pour goes on top.
  The form already spins at the rate the habitat will use: a hull 250 m in radius turning twice a
  minute gives about Earth's gravity at the rim. Most of a habitat's mass is its shield, several
  tonnes on every square metre, and spin casting turns placing that mass into a continuous process
  fed by slag the industry makes anyway. Cast rock is strong in compression but weak in tension, so
  fibre or steel bands wound around the shell carry the hoop load of spin and air pressure, while the
  cast mass shields.
buildsOn:
  - text: Centrifugal casting makes cast iron pipes, bushes and cylinder liners in sand, metal or ceramic moulds spun fast enough to give 60 to 80 g, in castings up to 10 m long, 1.73 m across and 36 tonnes.
    url: https://www.open.edu/openlearn/science-maths-technology/engineering-technology/manupedia/centrifugal-casting
    year: 2017
  - text: The University of Arizona's mirror lab spin-casts 8.4 m telescope mirrors from 17.5 tonnes of borosilicate glass, melted at 1,165 °C in a furnace turning at 5 rpm that throws the melt up the mould's sides; each then anneals for just over a month and takes another month and a half to reach room temperature.
    url: https://news.arizona.edu/news/sixth-mirror-casting-brings-giant-magellan-telescope-closer-completion
    year: 2021
  - text: Kalenborn makes cast basalt from melted rock as wear-resistant pipes and plates, at a density of 2.9 grams per cubic centimetre, showing melted rock can be cast into dense, hard shapes.
    url: https://www.kalenborn.com/wp-content/uploads/2023/03/de-folder-abresist.pdf
    year: 2023
  - text: NASA's 1977 Space Settlements design study found 4.5 tonnes of shield per square metre sufficient against cosmic rays, and took 1 rpm as the upper limit for living quarters.
    url: https://ntrs.nasa.gov/citations/19770014162
    year: 1977
  - text: Globus and colleagues' Kalpana One design, a cylinder of about 250 m radius for 3,000 people at up to 2 rpm, uses up to ten tons of lunar or asteroid regolith shielding per square metre.
    url: http://alglobus.net/NASAwork/papers/2007KalpanaOne.pdf
    year: 2007
  - text: Meurisse and colleagues at ESA and DLR sintered lunar regolith simulant into bricks with concentrated sunlight, though only to below 5 MPa strength, and without fully melting it.
    url: https://doi.org/10.1016/j.actaastro.2018.06.063
    year: 2018
experiment:
  goal: Spin-cast a ring of molten lunar simulant in vacuum and measure whether the wall comes out even, dense and strong.
  setup: >-
    A horizontal-axis centrifuge 2 m across in a vacuum chamber, spun to about 20 times Earth's
    gravity at the rim so that the chamber's own gravity is a small error. A furnace melts 50 kg of
    lunar simulant and pours it onto the spinning rim, and the ring cools under controlled spin.
  measure: Wall thickness around the ring, porosity by CT scan, compressive and tensile strength, and cracking during cooling.
  succeedsIf: Wall thickness within 10 percent all round, porosity under 5 percent, compressive strength above 100 MPa, and no cracks through the wall.
  costUsd: 2000000
  months: 12
path:
  - phase: bench
    what: The 2 m ring cast in vacuum.
    scale: 50 kg rings.
    proves: Spin-cast simulant makes an even, dense wall.
  - phase: prototype
    what: A 10 m ring cast in orbit from simulant or early lunar slag, melted by a solar concentrator.
    scale: A 10 m ring, a few tonnes.
    proves: Casting without gravity, with sunlight as the furnace.
  - phase: pilot
    what: A 50 m ring near the Moon, the first habitat module whose shield is cast in place, banded with fibre and pressurised.
    scale: A 50 m ring, over 1,000 tonnes.
    proves: A crew shielded for years in spin gravity.
  - phase: first-plant
    what: A cylinder 500 m across for a few thousand people, like Kalpana One.
    scale: A 500 m cylinder, millions of tonnes of cast shell.
    proves: Homes built from slag the industry already makes.
  - phase: fleet
    what: Cast-hull cyclers between Earth and Mars, and habitats beside every industrial site, each cast from local slag.
    scale: Over 100 hulls.
    proves: Homes and ships made where they are needed.
  - phase: civilization
    what: Habitats for millions near the Moon, the asteroids and Mercury, from {year-type-1} on.
    scale: Over 1 billion tonnes of cast shell.
    proves: People live where the climb is built.
risks: >-
  Cast rock is weak in tension, so the shell depends on its wound bands, which add a step and a
  material. Molten rock may not wet or spread evenly on a membrane in free fall; the membrane's
  material and temperature are what the bench and prototype test first. Slag varies from one source
  to the next, so each is treated as a recipe to tune with additives, as cast basalt makers already
  do. A wall metres thick could take months to cool and may crack; casting in many thin layers is
  the first fallback.
scene:
  kind: habitat
  focus: A cylinder spinning in orbit as molten slag spreads across the inside of its wall.
  params: { type: cylinder, spin: 0.8, green: 0.2 }
