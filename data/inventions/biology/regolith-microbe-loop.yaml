id: regolith-microbe-loop
title: The Regolith Loop
domain: biology
for: [closed-life-support, biomining-microbes]
pitch: >-
  A single microbial loop that eats a crew's waste and raw regolith at one end and returns clean
  water, fertiliser, breathable oxygen and concentrated metal at the other, so a base off Earth both
  feeds itself and mines its own ground.
principle: >-
  On Earth these are separate industries; in a sealed habitat they are one problem, because every
  atom must be used again. The Regolith Loop joins closed life support to biomining in one consortium
  of engineered microbes. Waste-eating strains break down crew waste and inedible plant matter into
  carbon dioxide, water and nutrient salts, which feed algae and plants that return oxygen and food,
  the loop demonstrated on Earth for decades. In parallel, chemolithotrophic strains leach iron,
  aluminium and useful metals from crushed regolith, using the carbon dioxide and acids the waste
  loop produces, and concentrate them for the local foundry. The two halves share water, gases and
  energy: the mining half consumes carbon dioxide the crew exhales, the life-support half cleans the
  water the mining half fouls. Driven by sunlight, the loop turns a base from a consumer of supplies
  into a maker of them.
buildsOn:
  - text: Beihang University's Lunar Palace 1 ran a 370-day crewed closure at 98.2 percent material closure, the strongest proof a bioregenerative loop can sustain people.
    url: https://doi.org/10.1101/2021.01.12.426282
    year: 2018
  - text: ESA's MELiSSA built a five-compartment regenerative loop over three decades, the engineering template for coupling microbial compartments.
    url: https://en.wikipedia.org/wiki/MELiSSA
    year: 2023
  - text: NASA's in-situ resource utilization programme validates hardware for winning materials from regolith, the mining half the loop makes biological.
    url: https://www.nasa.gov/mission/in-situ-resource-utilization-isru/
    year: 2024
experiment:
  goal: Run a coupled waste-recycling and regolith-leaching microbial loop that closes water and gas while recovering metal.
  setup: >-
    A sealed bench loop with three linked compartments: a waste-digestion reactor, an algae and plant
    compartment, and a regolith-leaching reactor charged with lunar simulant, sharing water and gas
    lines, fed simulated crew waste and light. Run against uncoupled controls.
  measure: >-
    Water and oxygen closure across the whole loop; nutrient salts returned to the plant compartment;
    milligrams of target metal leached per kilogram of simulant per day.
  succeedsIf: >-
    The coupled loop holds at least 95 percent water and oxygen closure for 90 days while leaching
    useful metal from simulant at a measurable, steady rate, beating the uncoupled controls on both.
  costUsd: 15000000
  months: 36
path:
  - phase: bench
    what: The three-compartment loop on lunar simulant and simulated waste.
    scale: One crew-equivalent, bench scale.
    proves: Life support and biomining can share one loop and both work.
  - phase: prototype
    what: A larger loop with engineered strains tuned for space conditions.
    scale: A few people's worth of recycling and mining.
    proves: Engineered consortia raise closure and leaching rates together.
  - phase: pilot
    what: The loop flown to the Moon and run in real regolith, vacuum and radiation.
    scale: A small crewed base.
    proves: It runs on the real ground, not simulant, under space conditions.
  - phase: first-plant
    what: A base that feeds its crew and feeds metal to a local foundry from the loop.
    scale: A town-sized settlement.
    proves: A base makes more of its own supplies than it imports.
  - phase: fleet
    what: Loops seeded at bases across the Moon and asteroids, each adapted to local rock.
    scale: Inner solar system bases.
    proves: Settlements bootstrap life support and mining from local material.
  - phase: civilization
    what: Self-provisioning habitats as the norm, closing matter and mining their own ground.
    scale: Planet and space.
    proves: Off-world settlement no longer depends on resupply from Earth.
risks: >-
  Coupling may let a failure in one half poison the other; the design keeps the compartments
  separable, with buffers and the option to isolate. Engineered microbes leaching metal in a
  life-support loop raise contamination and containment concerns, so strains are kept dependent on
  the loop and unable to survive outside it. Leaching rates from real regolith may be low, which the
  lunar phase measures before any base depends on it.
scene:
  kind: habitat
  focus: A base habitat whose waste, plants and a regolith reactor trade water, gas and metal in one loop.
  params: { type: dome, spin: 0.2, green: 0.6 }
