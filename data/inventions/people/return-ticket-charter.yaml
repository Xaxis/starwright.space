id: return-ticket-charter
title: The Return Ticket Charter
domain: people
for: [habitat-communities, off-world-society]
pitch: >-
  A founding charter for every habitat that guarantees each resident a funded, scheduled way home,
  with elected councils and a tested way of settling conflicts, so no one lives under rules they
  cannot leave.
principle: >-
  Hirschman argued that people answer a failing organisation by exit or by voice, and that voice
  works best when exit is credible. In a sealed habitat exit is almost impossible, so whoever runs
  the habitat can rule unchecked, the risk of the company town in its most extreme form. The Return
  Ticket Charter restores exit. An escrow, funded when a resident arrives, pays for a seat on a
  regular ship home, and the habitat must keep such seats available on a published schedule. It
  strengthens voice: elected councils; the rules Ostrom found make shared resources last (clear
  boundaries, monitoring by members, graduated sanctions, cheap ways to settle disputes); and an
  ombudsperson answerable to an outside body. It also draws on what polar and analogue research
  suggests helps: privacy, varied work, a shared purpose and regular contact with home. The Rescue
  Agreement already obliges states to return astronauts in distress; the charter turns return into a
  standing right.
buildsOn:
  - text: Hirschman's Exit, Voice, and Loyalty (1970).
    url: https://www.hup.harvard.edu/books/9780674276604
  - text: Ostrom's Governing the Commons (1990), on the rules that let communities manage shared resources.
    url: https://www.cambridge.org/core/product/identifier/9780511807763/type/book
  - text: The 1968 Rescue Agreement, which requires that astronauts who land in distress be returned safely and promptly.
    url: https://www.unoosa.org/oosa/en/ourwork/spacelaw/treaties/rescueagreement.html
  - text: Palinkas and Suedfeld's 2008 review of the psychology of polar expeditions.
    url: https://doi.org/10.1016/S0140-6736(07)61056-3
  - text: The Mars-520 simulation's record of how a sealed crew's activity and sleep changed over 520 days.
    url: https://doi.org/10.1073/pnas.1212646110
  - text: HI-SEAS, the 365-day Mars habitat mission in Hawaii that ended in 2016.
    url: https://www.hawaii.edu/news/2016/08/28/global-media-document-historic-university-of-hawaii-mars-simulation/
experiment:
  goal: Test whether a charter with a guaranteed exit, elected councils and a structured way to settle conflicts lowers conflict and distress in isolated, confined crews.
  setup: >-
    Eight analogue missions of 12 to 20 people for eight months each, across two analogue sites or
    polar stations. Four run under the charter, with a real, funded right to leave at monthly
    intervals and elected councils; four run under conventional command.
  measure: Conflict incidents; depression and anxiety scores, measured monthly; sleep and activity; task performance; how many leave, and why; residents' sense of fairness.
  succeedsIf: Charter crews show at least 30 percent fewer serious conflicts and lower distress scores with no loss of task performance, and fewer than 20 percent of members use the exit.
  costUsd: 7000000
  months: 24
path:
  - phase: bench
    what: The eight analogue missions.
    scale: Eight crews, eight months each.
    proves: Exit and voice reduce conflict in isolation.
  - phase: prototype
    what: The charter adopted on commercial space stations with long-stay crews.
    scale: Tens of residents in orbit.
    proves: It works where leaving really is hard.
  - phase: pilot
    what: The first lunar settlement founded under the charter.
    scale: Hundreds of residents.
    proves: It holds with families and turnover.
  - phase: first-plant
    what: Every habitat licensed under the federation must adopt a charter of this kind before anyone moves in.
    scale: The first habitats for thousands.
    proves: The right to leave can be a condition of a licence.
  - phase: fleet
    what: Habitats across the inner system, each running its own affairs under its own charter.
    scale: Millions of residents.
    proves: Many communities can govern themselves well.
  - phase: civilization
    what: Every person living off Earth does so under rules they chose and is free to leave.
    scale: "The societies off Earth by {year-k15}"
    proves: Life in space can be free as well as safe.
risks: >-
  An escrow for a seat home is expensive while transport is dear; it can start as insurance pooled
  across habitats and fall in cost as transport does. Residents born in space may have no home on
  Earth to return to; the charter extends exit to moving between habitats. Analogue missions are
  smaller and shorter than real habitats, so the plan treats them as a first test and keeps
  measuring after people move in.
scene:
  kind: habitat
  focus: A habitat's docking ring, a return ship always waiting at one berth.
  params: { type: torus, spin: 0.6, green: 0.5 }
