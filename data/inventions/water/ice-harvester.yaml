id: ice-harvester
title: The Cold-Trap Ice Harvester
domain: water
for: [space-ice-mining]
pitch: >-
  A rover that lowers a sealed dome over a patch of shadowed lunar ground, warms the icy soil from
  inside with microwaves until the ice turns to vapour, and catches the vapour as clean ice on a cold
  trap, taking water out of the ground without digging it up.
principle: >-
  Ice in a polar cold trap is mixed through the soil at a few percent by mass, at 25 to 40 K. At 5.6
  percent, each kilogram of water comes with about 17 kg of dry soil. Warming that soil from 40 K to
  about 220 K, where ice turns to vapour quickly in vacuum, takes about 1.2 MJ, since regolith holds
  only about 0.4 kJ per kilogram per kelvin over that range; turning the ice to vapour takes another
  2.8 MJ. The floor is about 4 MJ, 1.1 kWh, per kilogram, and measured systems use about twice that.
  Heat applied at the surface reaches down slowly, because dry soil in vacuum is one of the poorest
  conductors known. Microwaves heat from within: at 2.45 GHz, with lunar soil's loss tangent near
  0.01, the power reaches tens of centimetres to a metre down. The harvester lowers a dome 3 m across
  with a flexible skirt, fires magnetrons through the dome's floor, and draws the vapour across a cold
  trap held near 190 K, where ice's vapour pressure is under a hundredth of that at 220 K, so water freezes
  out clean and the dust stays behind. When the patch is dry to half a metre the rover moves on. The
  trap must shed the vapour's 2.8 MJ per kilogram: a 10 kW harvester making about 100 kg a day rejects
  about 3 kW, which a two-sided radiator of about 25 square metres at 190 K sheds to the dark sky.
  Power comes by cable from solar arrays on the sunlit crater rim.
buildsOn:
  - text: Ethridge and Kaukler at NASA Marshall heated about 200 g of frozen, icy lunar simulant in vacuum with a 1,200 W microwave oven, removed at least 85 percent of the water in 5 minutes, and caught 99 percent of it on a cold trap.
    url: https://ntrs.nasa.gov/api/citations/20070018802/downloads/20070018802.pdf
    year: 2007
  - text: Sowers' NASA study of thermal mining heats icy ground under a tent and freezes the vapour out on cold traps, for 60 percent less mass and energy than digging.
    url: https://www.nasa.gov/general/thermal-mining-of-ices-on-cold-solar-system-bodies/
    year: 2019
  - text: Kornuta and colleagues sized a thermal mining plant for 2,450 t of lunar water a year, needing 580 kW of heat under a 32 m tent where ice is 4 percent by mass.
    url: https://www.osti.gov/servlets/purl/1503160
    year: 2019
  - text: Honeybee Robotics' Planetary Volatiles Extractor, a heated auger that captures water in vacuum, recovered 31 to 87 percent of the water in 15 tests at an average of 2.2 Wh per gram.
    url: https://www.hou.usra.edu/meetings/lunarisru2019/pdf/5076.pdf
    year: 2019
  - text: LCROSS measured about 5.6 percent water ice by mass in the soil of Cabeus crater, the basis for sizing a harvester's patches.
    url: https://experts.arizona.edu/en/publications/detection-of-water-in-the-lcross-ejecta-plume/
    year: 2010
  - text: NASA's PRIME-1 team got about 12 of 240 planned hours on the Moon in 2025 when their lander tipped over, a reminder that the first harvesters must survive rough landings and terrain.
    url: https://ntrs.nasa.gov/api/citations/20260003150/downloads/MSolo%20PRIME-1%20overview%20and%20results%20-%20LSSW.pdf
    year: 2026
experiment:
  goal: Measure the energy per kilogram, the share of the ice recovered by depth and the dust carried over when icy soil at polar temperatures is heated with microwaves under a sealed dome.
  setup: >-
    A thermal vacuum chamber holding a bed of lunar highland simulant 2 m square and 0.6 m deep, mixed
    with 5 percent ice by mass and held below 100 K by a liquid nitrogen shroud. A 1 m dome with a
    flexible skirt carries four 1.5 kW, 2.45 GHz magnetrons and draws vapour across a cold trap held
    at 190 K by a cryocooler, on load cells. After each run the bed is cored to map the ice that is left.
  measure: Water caught per kilowatt-hour; share of the ice under the dome recovered at each depth; vapour lost under the skirt; dust and other frozen gases in the trap; temperatures through the bed; magnetron efficiency.
  succeedsIf: Over ten runs the rig recovers more than 70 percent of the ice in the top 50 cm under the dome, at under 3 kWh of electricity per kilogram of water caught, with under 10 percent lost under the skirt and the melted, filtered water under 500 mg per litre of dissolved solids.
  costUsd: 6000000
  months: 24
path:
  - phase: bench
    what: The dome and magnetrons on the icy bed in the chamber.
    scale: About 10 kg of water a run.
    proves: Energy per kilogram, depth of recovery and the skirt's seal.
  - phase: prototype
    what: A full-size rover driving across a large cryogenic bed of icy simulant with boulders and slopes.
    scale: 10 kW, about 100 kg of water a day.
    proves: Sealing, harvesting and moving on uneven ground in real cold.
  - phase: pilot
    what: One rover landed in a south polar cold trap, cabled to solar arrays on the rim.
    scale: 10 kW on the Moon, about 35 t of water a year.
    proves: Water from the Moon at the predicted energy, and how the ice is really spread.
  - phase: first-plant
    what: Twenty-five rovers feeding a depot that stores water and splits some of it into propellant.
    scale: 250 kW, about 1,000 t of water a year.
    proves: Lunar water costs less where it is used than water landed from Earth.
  - phase: fleet
    what: Harvesters in many cold traps, and versions that bake water out of clays in asteroid rock.
    scale: About 25 MW, 100,000 t a year.
    proves: Water from many bodies, for many customers.
  - phase: civilization
    what: The water supply of space industry, for drink, air, shielding and propellant.
    scale: 10 million t a year, about 2.5 GW of harvesters.
    proves: Water in space comes from space.
risks: >-
  The ice may be patchier than the maps suggest: the best estimate is uncertain by half, and exposed
  ice shows in only one cold trap in thirty. Each patch is prospected with a neutron spectrometer and
  radar before the dome comes down. The skirt may not seal on rough, rocky ground; a heavier skirt
  with soil piled along its edge, as in tent designs, is the next try. Other frozen gases will come
  off with the water and must be separated, which a trap with stages at different temperatures can
  do. Magnetrons and electronics must be kept warm at 40 K, which costs power. If microwaves reach
  less deep than expected, the dome stays longer on each patch or the rover rakes the dried top layer
  aside.
scene:
  kind: moon
  focus: A rover's dome sealed over shadowed ground, frost building on its cold trap while a cable runs up to the sunlit rim.
  params: { mines: 0.5, bases: 0.2 }
