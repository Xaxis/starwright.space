id: atmospheric-harvester
title: The Sorbent Water Panel
domain: water
for: [water-from-air, abundant-water]
pitch: >-
  A rooftop panel of two stacked sorbent layers that drinks in night air and gives up water by day,
  in which the heat released as the top layer's vapour condenses drives water out of the layer below,
  so one square metre of desert sunlight makes nearly twice the water of a single-layer panel.
principle: >-
  A sorbent panel works in two halves of a day. At night louvres open, air flows across the sorbent
  and it loads with water. By day the louvres close, sunlight heats the sorbent, and the vapour comes
  off and condenses on a cooler plate. Almost all the energy is latent heat: about 2.6 MJ to drive
  out each litre, and the same heat comes back when the vapour condenses. A single-layer panel throws
  that heat away through its condenser. A sunny desert day delivers about 23 MJ per square metre, so
  even a perfect single layer makes under 9 L, and the best field device has made 4.3. The Sorbent
  Water Panel reuses the heat once, as a multiple-effect still does. The top layer sits under a
  glazed selective absorber and is driven to about 80 °C. Its vapour condenses on a plate that is
  also the heater for the second layer, at about 55 °C, whose own condenser faces the sky and sheds
  the heat. The layers are matched in order: a salt-loaded hydrogel that holds a lot of water and
  gives it up only when hot on top, and a framework such as MOF-303, which releases water near 50 °C,
  below. If the second layer recovers 70 percent of the first layer's heat, the panel makes 1.7 times
  a single layer: about 6 to 7 L per square metre a day where today's best makes 4.3. Each layer must
  load its share at night, about 3 L per square metre, so the panel holds a few kilograms of sorbent
  per layer. Twenty litres a day for a household then takes about 3 square metres.
buildsOn:
  - text: Kim, Yaghi, Wang and colleagues ran the first sunlight-driven framework harvester, with MOF-801, measuring about 0.24 L per kilogram per cycle on an MIT rooftop and modelling 2.8 L per kilogram per day at 20 percent humidity.
    url: https://yaghi.cchem.berkeley.edu/pdfPublications/WaterHarvesting.pdf
    year: 2017
  - text: Hanikel and colleagues measured 0.7 L per kilogram per day from MOF-303 in the Mojave Desert at humidity as low as 10 percent, by cycling it several times a day.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6813556
    year: 2019
  - text: LaPotin, Wang and colleagues at MIT built a two-stage harvester with a zeolite sorbent, in which condensation heat from the top stage drives the bottom one; it made about 0.8 L per square metre per day, roughly double their single-stage device, and works at humidity as low as 20 percent.
    url: https://news.mit.edu/2020/solar-extracts-drinkable-water-1014
    year: 2020
  - text: Guan, Yu and colleagues' solar gel-fabric harvester made 4.3 L per square metre per day in the Chihuahuan Desert at about 26 percent humidity.
    url: https://www.nature.com/articles/s44221-026-00645-6
    year: 2026
  - text: Swanson gives the least work to take water from air at 50 percent humidity and 25 °C as 95 kJ per kilogram, a small fraction of the latent heat that sorbent panels spend.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10293683
    year: 2023
  - text: The Water Abundance XPRIZE asked for at least 2,000 litres a day from air on renewable energy at no more than two US cents a litre, and was won by the Skysource/Skywater Alliance in October 2018.
    url: https://go.xprize.org/news/waxp-grand-prize-winner
    year: 2018
experiment:
  goal: Show in a desert that a two-layer panel makes at least 1.6 times the water of the same panel with one layer, and that the water is fit to drink.
  setup: >-
    Two 1 square metre panels side by side at a desert field station, one with both layers and one
    with the top layer only, under identical glazed selective absorbers and motorised louvres. Tipping
    buckets meter each condensate line; thermocouples sit in every layer and plate; a weather station
    logs humidity, air temperature, wind and sunlight. Water samples go weekly to an accredited
    laboratory. The run lasts 60 days at 15 to 35 percent night humidity.
  measure: Litres per square metre per day from each layer; temperatures of each layer and plate; heat reused by the second layer; water taken up by each layer at night; chloride, lithium, metals, organics and bacteria in the water; yield lost to dust and ageing over the run.
  succeedsIf: Averaged over 60 days, the two-layer panel makes at least 1.6 times the water of its single-layer twin and at least 6 L per square metre a day, with chloride under 250 mg and lithium under 0.01 mg per litre, and loses less than 10 percent of its yield from the first week to the last.
  costUsd: 750000
  months: 18
path:
  - phase: bench
    what: The pair of panels in the desert.
    scale: 2 panels of 1 square metre, about 10 L a day together.
    proves: Heat reuse between layers and the yield per square metre.
  - phase: prototype
    what: Arrays on 30 homes in two dry climates, run for a year by their owners.
    scale: 90 square metres, about 600 litres a day in all.
    proves: A year of yields, cleaning, water quality and how households use it.
  - phase: pilot
    what: The drinking water point for a village with no well, run by a local operator.
    scale: 1,300 square metres, about 8 cubic metres a day for 2,000 people.
    proves: A community supply that a local business keeps working and paid for.
  - phase: first-plant
    what: A factory making panels and sorbent in a dry region.
    scale: 1 million square metres of panel a year, for about 300,000 households.
    proves: Water from air at under two US cents a litre over a ten-year panel life.
  - phase: fleet
    what: Panels on homes, schools and clinics across the dry belts, and sealed versions that take water from habitat air.
    scale: 100 million square metres, about 600,000 cubic metres a day.
    proves: Drinking water for 150 million people with no pipe or well.
  - phase: civilization
    what: Air as the drinking-water source for everyone that pipes do not reach.
    scale: About 500 square kilometres of panel for 700 million people.
    proves: No one goes without drinking water for lack of a network.
risks: >-
  Salt-loaded gels can swell and leak salt into the water in humid weeks; the next try is a gel that
  binds its salt, or frameworks in both layers at a lower yield. On hot desert afternoons the second
  layer's condenser may run too warm to condense; a sky-facing radiative cooler on the condenser is
  the first fix, and running as one layer at midday the fallback. Below 15 percent humidity every
  sorbent loads slowly, so yields fall and the panel needs more area. Frameworks cost far more than
  salts, so the bottom layer uses whichever sorbent gives the cheapest litre over its life. Dust on
  the glazing cuts the heat; panels are tilted and wiped like solar modules.
scene:
  kind: machine
  focus: A two-layer sorbent panel by day, vapour rising from its top layer and condensing to warm the layer below.
  params: { shape: panel, spin: 0.3 }
