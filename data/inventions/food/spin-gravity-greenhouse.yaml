id: spin-gravity-greenhouse
title: The Spun Greenhouse
domain: food
for: [space-farming]
pitch: >-
  A rotating greenhouse ring that gives crops the gravity they evolved under while they grow in
  space, on recycled water and sunlight, so a habitat or base can grow staples and not just salad.
principle: >-
  Plants use gravity to know up from down, to set roots, move water and fill grain, and in free fall
  or weak gravity they grow oddly. On the ISS centrifuge, seedlings already responded weakly to light
  below about 0.3 g. The Spun Greenhouse supplies gravity by spinning, since centrifugal acceleration
  is the spin rate squared times the radius. To press outward at a full Earth 9.81 metres per second
  squared, a ring of 56 m radius turns at 4 rpm, or a 14 m module at 8 rpm; slowing the same ring to
  2.5 rpm gives Mars gravity and to 1.6 rpm the Moon's. Crops take more spin than people, who feel
  sick much above 2 rpm, so a greenhouse can be smaller and spin faster than a habitat. Inside, crops
  grow hydroponically on water and nutrients from the closed loop, lit by piped sunlight or clean
  power, breathing the crew's carbon dioxide and returning oxygen. NASA's life-support baseline needs
  about 65 square metres of crops to feed one person a full diet, at yields like wheat's 20 grams of
  dry grain per square metre a day, so a ring for a few people is tens of metres across. Because the
  operator sets the spin, the greenhouse can find the least gravity at which each crop still makes 80
  percent of its full-gravity yield, saving structure and power, and turns space farming into
  engineering a known plant rather than gambling on gravity it has never known.
buildsOn:
  - text: Lunar Palace 1's 370-day crewed closure at 98.2 percent material closure shows crops can feed a closed crew, the loop a spun greenhouse plugs into.
    url: https://doi.org/10.1101/2021.01.12.426282
    year: 2018
  - text: At Krasnoyarsk's BIOS-3, Gitelson's group ran crews for four to six months on about 13 square metres of plants per person, which supplied all their oxygen and water and 40 to 45 percent of their food, meeting crew needs 95 percent by weight.
    url: https://ntrs.nasa.gov/api/citations/19910015430/downloads/19910015430.pdf
    year: 1989
  - text: On a centrifuge in the ISS European Modular Cultivation System, Kiss and colleagues found seedlings respond weakly to light at 0.1 to 0.3 g, direct evidence that crops behave differently under partial gravity and that the right spin must be measured.
    url: https://doi.org/10.1007/s00425-012-1633-y
    year: 2012
  - text: On China's Tiangong station rice completed a full seed-to-seed cycle in microgravity in 2022, showing a cereal can close its life cycle in space, though yield and seed set under partial gravity are still unmeasured.
    url: https://pubmed.ncbi.nlm.nih.gov/39067990/
    year: 2022
experiment:
  goal: Find the least gravity at which staple crops yield well, using a spinning greenhouse module.
  setup: >-
    A centrifuge greenhouse, first on Earth and then in orbit, growing staple crops (wheat, potato,
    soy) at several spin rates giving gravity from lunar to full Earth, on a closed water and nutrient
    loop, against a stationary control.
  measure: >-
    Grain and tuber yield per plant at each gravity level; water and energy per kilogram of food;
    whether crops set seed normally; loop closure while farming.
  succeedsIf: >-
    Staple crops reach at least 80 percent of their full-gravity yield at a reduced spin gravity, on
    a closed loop, marking a gravity setting a habitat can build to.
  costUsd: 30000000
  months: 48
path:
  - phase: bench
    what: An Earth centrifuge mapping yield against gravity for staple crops.
    scale: A 2 m centrifuge, a few square metres of crop at 0.16 to 1 g.
    proves: The gravity each crop needs is measured, not guessed.
  - phase: prototype
    what: A spun greenhouse module flown and run in orbit on a closed loop.
    scale: One module of about 65 square metres, one person's diet.
    proves: Crops yield under real spun gravity in space.
  - phase: pilot
    what: A greenhouse ring feeding a small crewed base much of its food.
    scale: A ring about 56 m across, roughly 400 square metres of crop for 6 people.
    proves: A space farm is a dependable part of a closed loop.
  - phase: first-plant
    what: A habitat that grows a full, varied diet for its people.
    scale: About 65,000 square metres of crop for about 1,000 people.
    proves: A settlement feeds itself without food from Earth.
  - phase: fleet
    what: Spun greenhouses standard on habitats and ships across the inner system.
    scale: Hundreds of habitats, feeding more than 100,000 people.
    proves: Food travels with people as a built system, not a supply line.
  - phase: civilization
    what: Every off-world settlement growing its own staples under chosen gravity.
    scale: Self-feeding settlements for the millions living off Earth by {year-type-1}.
    proves: Human settlement off Earth is self-feeding.
risks: >-
  Spin may cause crop or equipment problems (uneven watering, motion effects) that Earth tests miss;
  the orbital phase checks before a base depends on it. Some crops may need near-full gravity,
  raising structure and energy cost, which the yield-versus-gravity map quantifies. Coupling the
  greenhouse tightly to life support risks shared failures, mitigated by buffering and isolation.
scene:
  kind: habitat
  focus: A spinning ring of greenhouse modules, crops pressed outward by the spin as stars turn past.
  params: { type: torus, spin: 0.8, green: 0.9 }
