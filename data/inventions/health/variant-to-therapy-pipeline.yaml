id: variant-to-therapy-pipeline
title: The Variant-to-Therapy Pipeline
domain: health
for: [genomic-medicine]
pitch: >-
  A pipeline that takes a patient's genome, works out which variants are driving their disease, and
  designs a therapy aimed at the exact fault, turning a sequenced genome from a list of unknowns into
  a treatment plan.
principle: >-
  Reading a genome is cheap, but a person's genome differs from the reference at millions of sites,
  most of unknown effect, and even a known driver rarely has a matched therapy on the shelf. The
  Variant-to-Therapy Pipeline joins three advances into one flow. A genome model ranks which variants
  drive the disease: Evo 2, trained on 9.3 trillion base pairs, scored variants across species at an
  AUROC of 0.921 when blinded to the answer, enough to put the likely drivers near the top. A
  structure model then shows the molecular consequence of those variants: AlphaFold 3 predicts how a
  variant protein folds and binds about 50 percent more accurately than the best docking. A
  protein-design stage proposes a therapy against the faulty protein: RFdiffusion designs binders and
  antibodies from scratch at about a 19 percent experimental success rate, so the pipeline runs
  several designs per target to expect a hit. Each proposal is checked in the patient's own cells
  before anything reaches them. The pipeline is the missing middle of genomic medicine: it connects a
  sequenced genome to a specific, designed treatment instead of leaving the genome as data no one can
  act on.
buildsOn:
  - text: Evo 2, trained on 9.3 trillion base pairs, predicts the functional effect of genetic variants across life, the first stage that ranks a patient's drivers.
    url: https://arcinstitute.org/news/evo-2-one-year-later
    year: 2025
  - text: AlphaFold 3 predicts the joint structures of proteins, nucleic acids, small molecules and modified residues, with far greater accuracy for protein and drug binding than docking tools and substantially higher antibody and antigen accuracy than AlphaFold-Multimer, the stage that models the faulty protein and what can bind it (Nature, 2024).
    url: https://doi.org/10.1038/s41586-024-07487-w
    year: 2024
  - text: RFdiffusion designs protein binders from scratch with an overall experimental success rate of 19 percent across five targets, the stage that proposes a therapy against the faulty protein (Nature, 2023).
    url: https://doi.org/10.1038/s41586-023-06415-8
    year: 2023
  - text: Portable, affordable sequencing from Oxford Nanopore makes a patient's genome routinely available to feed the pipeline.
    url: https://nanoporetech.com/
    year: 2024
experiment:
  goal: Take patient genomes to ranked driver variants and candidate designed therapies, validated in the patients' own cells.
  setup: >-
    On a cohort with a genetic disease of known but varied cause, run the pipeline: predict and rank
    variants, model the top ones, design candidate binders or corrections, and test the candidates in
    patient-derived cells. Compare the pipeline's calls and candidates against the known biology.
  measure: >-
    Accuracy of driver-variant ranking against known causes; fraction of cases with a candidate that
    acts on the target in patient cells; time and cost per case.
  succeedsIf: >-
    The pipeline ranks the true driver among its top 10 candidates in at least 80 percent of cases
    and yields a designed candidate that engages the target in patient-derived cells in at least 30
    percent of cases, within a set time and cost per case.
  costUsd: 30000000
  months: 42
path:
  - phase: bench
    what: The three-stage pipeline validated on a disease cohort against known biology.
    scale: About 50 cases of known cause.
    proves: Genome to driver to candidate therapy works and is accurate.
  - phase: prototype
    what: The pipeline run prospectively on new patients with candidates tested in their cells.
    scale: About 500 cases.
    proves: It produces actionable, patient-specific candidates in time to matter.
  - phase: pilot
    what: Candidates from the pipeline entering early trials for rare and cancer cases.
    scale: About 1,000 cases into trial cohorts.
    proves: Designed therapies from the pipeline are safe and help patients.
  - phase: first-plant
    what: A clinical service that takes a genome and returns a treatment plan.
    scale: About 100,000 genomes a year in one health system.
    proves: Tailored therapy from the genome becomes routine care.
  - phase: fleet
    what: The service widely available, including compact versions for remote and off-world care.
    scale: About 1 million cases a year, on Earth and off it.
    proves: Genomic medicine reaches everyone, not just major centres.
  - phase: civilization
    what: Disease treated at the level of each person's exact molecular fault, everywhere people live.
    scale: About 8 billion people.
    proves: Medicine matched to the individual as standard.
risks: >-
  Variant-effect prediction is weakest outside well-studied populations, so the pipeline reports
  uncertainty and is validated across diverse groups. Designing a working therapy for every driver is
  not yet possible; the pipeline starts where design is strongest and grows. Testing in patient cells
  does not guarantee safety in people, which trials must establish. Genomic data demand strict privacy
  protection, built in from the start.
scene:
  kind: network
  focus: A flow from a genome to ranked variants to a designed therapy, each stage lighting the next.
  params: { nodes: 1000, clusters: 12, links: 0.8, pulses: 0.8, shape: flat }
