id: moon-metal-hall-drive
title: The Moon-Metal Hall Drive
domain: transport
for: [in-space-propulsion, interplanetary-transport]
pitch: >-
  An electric thruster that runs on magnesium refined from lunar rock, so cargo ships between
  worlds burn propellant mined in space instead of xenon or argon lifted from Earth.
principle: >-
  A Hall thruster traps electrons in a radial magnetic field, where they ionise the propellant, and an
  axial electric field then accelerates the ions. An ion of mass m falling through V volts leaves at
  v = √(2qV/m). Through 300 V, xenon at 131 atomic mass units leaves at 21 km/s, a specific impulse
  of 2,140 s; magnesium at 24.3 leaves at 49 km/s, 2.3 times faster. To reach 3,000 s, magnesium
  needs only 109 V where xenon needs 590 V. At any propellant, thrust per watt is 2η/v, so at 3,000 s
  and 50 percent efficiency a thruster makes 34 mN per kW: a 1 MW cargo tug pushes with 34 N and uses
  1.16 g of magnesium a second, 36 tonnes a year of firing. Magnesium is also a solid, stored as wire
  with no tanks. The Moon has it in quantity: average soils run from 5.7 percent magnesium oxide in
  the Apollo 16 highlands to 10.4 percent at Apollo 17, and magnesium is 60 percent of the oxide by
  mass, so Apollo 17 soil is 6.3 percent magnesium and a 1 MW tug's year needs about 1,200 tonnes of
  soil at half recovery. Freeing it takes at least the oxide's heat of formation, 602 kJ per mole or
  25 MJ per kilogram of magnesium; at 50 percent efficiency that is 50 MJ/kg, a steady 57 kW for
  one tug's supply, under 6 percent of the power the tug itself spends, and the oxygen comes out as
  a second product. The electrolysis plants that make lunar oxygen release magnesium along with
  iron, silicon and aluminium. The Drive feeds magnesium wire into a heated anode whose temperature sets
  the rate it vaporises, the thermal flow control King and Hopkins demonstrated. A metal plume condenses on
  anything cold, so ships are laid out with nothing cold in its path.
buildsOn:
  - text: King and Hopkins at Michigan Tech ran a magnesium Hall thruster with active thermal control of the metal flow (Journal of Propulsion and Power, May 2014), and King's group also built a bismuth hollow cathode for Hall thrusters.
    url: https://www.mtu.edu/mechanical/people/faculty/king/
    year: 2014
  - text: ThrustMe's iodine electric propulsion system, which stores its propellant unpressurised as a solid and sublimates it as needed, was demonstrated in orbit (Rafalskyi and colleagues, Nature, 2021).
    url: https://doi.org/10.1038/s41586-021-04015-y
    year: 2021
  - text: The Lunar Sourcebook's table of average soils at the landing sites gives magnesium oxide from 5.7 percent at Apollo 16 to 11.5 percent at Apollo 15 and 10.4 percent at Apollo 17.
    url: https://www.lpi.usra.edu/publications/books/lunar_sourcebook/pdf/Chapter07.pdf
    year: 1991
  - text: Researchers working with ESA and Metalysis used molten salt electrolysis to take essentially all the oxygen from lunar regolith simulant, leaving a mixture of metal alloys; lunar regolith is 40 to 45 percent oxygen by weight.
    url: https://www.esa.int/ESA_Multimedia/Images/2019/10/Oxygen_and_metal_from_lunar_regolith
    year: 2019
  - text: NIST gives the standard heat of formation of solid magnesium oxide as -601.6 kJ per mole (CODATA), the least energy needed to free magnesium from it.
    url: https://webbook.nist.gov/cgi/cbook.cgi?ID=C1309484&Mask=2
    year: 1984
experiment:
  goal: Run a magnesium-fed Hall thruster for a thousand hours, on magnesium made from lunar simulant, and measure its performance and what its plume does to nearby surfaces.
  setup: >-
    A 5 kW Hall thruster with a wire-fed vaporising anode in a vacuum chamber at least 6 m long, run in
    turns on commercial magnesium and on magnesium reduced from lunar simulant by molten salt
    electrolysis. Witness plates sit at angles around the plume; the chamber walls themselves pump
    the metal by condensing it.
  measure: Thrust, specific impulse and efficiency; erosion of the channel walls; magnesium deposited on the witness plates by angle; flow stability; the effect of impurities in simulant-made metal.
  succeedsIf: Specific impulse above 2,500 s at over 45 percent efficiency for 1,000 hours, stable on simulant-made magnesium, with deposits confined within 60 degrees of the thrust axis.
  costUsd: 2000000
  months: 15
path:
  - phase: bench
    what: A thousand hours at 5 kW.
    scale: One 5 kW thruster, 1,000 hours, about 30 kg of magnesium.
    proves: Performance and life on lunar-derived metal.
  - phase: prototype
    what: A cluster tested on the ground, then flown on a demonstration tug in Earth orbit fed from a magnesium cassette.
    scale: 100 kW, one demonstration tug.
    proves: High power, and a spacecraft that lives with a metal plume.
  - phase: pilot
    what: A cargo tug between low Earth orbit and lunar orbit, fuelled with magnesium made at a lunar base.
    scale: One 1 MW tug, 20 tonne cargoes, 36 tonnes of magnesium a year.
    proves: A closed loop of lunar propellant.
  - phase: first-plant
    what: Tugs carrying cargo between Earth, the Moon, Mars and the main belt, fuelled at lunar and asteroid refineries.
    scale: 20 tugs of 1 to 10 MW, about 2,000 tonnes of metal a year.
    proves: Freight between worlds at the cost of electricity and refined metal.
  - phase: fleet
    what: Every slow freight route in the inner system running on metal from space.
    scale: 500 tugs, 1 GW of thrusters, about 36,000 tonnes of metal a year.
    proves: Propulsion that needs nothing from Earth.
  - phase: civilization
    what: Electric freighters burning metals from the Moon, the asteroids and Mercury carry the climb's goods between worlds.
    scale: 100 GW of electric propulsion, about 3.6 million tonnes of metal a year.
    proves: Transport between worlds runs on what the worlds provide.
risks: >-
  Metal plumes coat solar arrays and radiators; if deposits cannot be kept off them, thrusters move
  to long booms or the ship switches to a gas made in space, such as oxygen, which needs a different
  thruster. Lunar magnesium may carry impurities that wear the thruster faster, and the bench runs on
  simulant-made metal to find out. Freeing magnesium costs more energy per kilogram than freeing
  iron or oxygen; if it proves too dear, calcium, sodium and aluminium are the next candidates.
scene:
  kind: machine
  focus: A Hall thruster's ring of plasma, fed from a spool of moon-metal wire.
  params: { shape: engine, spin: 0.6 }
