id: cold-corridor
title: The Cold Corridor
domain: transport
for: [high-speed-ground]
pitch: >-
  A maglev line and a superconducting power cable laid in one trench and cooled by one liquid
  nitrogen loop, so the grid pays for the cold and the train rides on it.
principle: >-
  Ceramic superconductors such as YBCO work at the temperature of liquid nitrogen, which boils at
  77.4 K at one atmosphere and absorbs 199 kJ per kilogram as it does. Cooled blocks of YBCO above a
  track of permanent magnets lock onto the field lines passing through their defects (flux pinning),
  so a car floats and stays centred with no power and no control system; Southwest Jiaotong
  University's 21 m prototype of 2021 was designed for 620 km/h on this principle. The costly parts of
  such a line are the magnet track, the land and keeping every car cold. A superconducting cable
  needs the same cold. Essen's AmpaCity cable carries 40 MW at 10 kV through 1 km and is cooled by a
  plant giving 4 kW of cold at 67 K, so about 4 W per metre. The second law sets the price of that
  cold: removing 1 W at 67 K and rejecting it at 300 K takes at least 3.5 W of work, and practical
  plants reach 20 to 30 percent of that ideal, so 12 to 17 W of electricity per watt removed, about
  50 to 70 kW for the kilometre, or 0.15 percent of the power it carries. A car is a small extra
  load: if its cryostats take in 100 W, it boils 0.5 g of nitrogen a second, 1.8 kg an hour, topped
  up from a trackside coupling at each station, and with one car every 2 km that adds 0.05 W per
  metre, about 1 percent of the cable's own heat leak. The Corridor lays the cable beside the
  guideway in one cryostat trench and runs one nitrogen loop and one chain of refrigeration plants
  for both, so the grid's cable pays for the trench, the right of way and the cold, and the train
  shares them.
buildsOn:
  - text: Southwest Jiaotong University unveiled a 21 m high-temperature superconducting maglev prototype designed for 620 km/h in Chengdu on 13 January 2021, with 165 m of demonstration track.
    url: https://www.cnn.com/travel/article/china-high-speed-maglev-train-intl-hnk/index.html
    year: 2021
  - text: RWE, Nexans and the Karlsruhe Institute of Technology began AmpaCity in 2012, replacing a 1 km high-voltage cable between two Essen substations with a 10 kV superconducting cable designed for 40 MW, then the longest superconducting cable in the world.
    url: https://www.kit.edu/visit/pi_2012_8761.php
    year: 2012
  - text: Nexans reported that AmpaCity's 2.3 kA cable was commissioned on 10 March 2014, runs at about 70 K and is cooled by a closed-loop liquid nitrogen plant giving 4 kW of cold at 67 K.
    url: https://indico.cern.ch/event/363814/contributions/861252/attachments/723694/993357/22-Rainer_Soika_AmpaCity_HEPTECH.pdf
    year: 2015
  - text: NIST's reference data for nitrogen (Span and colleagues' equation of state) give a boiling point of 77.4 K at one atmosphere, a liquid density of 806 kg per cubic metre and a heat of vaporisation of 199 kJ per kilogram.
    url: https://webbook.nist.gov/cgi/fluid.cgi?Action=Load&ID=C7727379&Type=SatP&Digits=5&PLow=1&PHigh=1&PInc=1&RefState=DEF&TUnit=K&PUnit=atm&DUnit=kg%2Fm3&HUnit=kJ%2Fkg&WUnit=m%2Fs&VisUnit=uPa*s&STUnit=N%2Fm
    year: 2000
experiment:
  goal: Run a superconducting maglev car and a superconducting cable from one nitrogen loop, and measure whether either disturbs the other.
  setup: >-
    A 200 m guideway of permanent magnets with 100 m of superconducting cable laid alongside in a
    shared cryostat trench, one liquid nitrogen refrigerator of about 2 kW at 67 K, and a 2 t test car
    whose YBCO cryostats are refilled from a trackside coupling. The cable carries 2 kA while the car
    runs at up to 60 km/h.
  measure: Heat load per metre of the shared line, the cable's temperature while cars pass, levitation gap and stiffness, interference between the cable's field and the car, nitrogen used per car-hour, and refill time.
  succeedsIf: The shared loop keeps the cable below 80 K with cars running, the shared trench leaks under 5 W per metre, the car levitates stably with a gap of at least 10 mm, and the measured heat loads put a shared line's refrigeration cost at least 30 percent below two separate systems.
  costUsd: 7000000
  months: 18
path:
  - phase: bench
    what: The 200 m test line.
    scale: One car, 200 m of guideway, 100 m of cable.
    proves: One cold loop can serve both.
  - phase: prototype
    what: A test line run at 300 km/h, with a 10 kV cable carrying real substation power.
    scale: 5 km, 40 MW of cable.
    proves: Speed and grid service together.
  - phase: pilot
    what: A commercial line between a city and its airport, with a cable that relieves the city's grid.
    scale: 50 km, 5,000 passengers a day, 200 MW of cable.
    proves: Shared costs in service.
  - phase: first-plant
    what: An intercity line that is also a high-capacity grid link.
    scale: 400 km, 30,000 passengers a day, 2 GW of cable.
    proves: A line cheaper per kilometre than a railway and a cable built separately.
  - phase: fleet
    what: Cold corridors along the main routes of the global grid on several continents.
    scale: 5,000 km on 3 continents, 30 GW of links.
    proves: Fast travel and power sharing one right of way.
  - phase: civilization
    what: Continents joined by corridors that carry people at aircraft speeds and a share of the grid's {power-k08}.
    scale: 100,000 km of corridor, 1 TW of links.
    proves: Short flights replaced by trains that ride the grid's own cold.
risks: >-
  A fault in the shared loop stops both the train and the cable, so loops are split into sections a
  few kilometres long with spare refrigerators. Permanent-magnet track needs large amounts of rare
  earths; ferrite or iron tracks paired with stronger superconductors are the alternative to test.
  Grids and railways want different routes, so corridors fit only where both run between the same
  cities, which is where the pilot will go. Superconducting maglev has run only at low speed on short
  tracks, and its stability, drag and cryostats at high speed are still to be proved on the 5 km
  line.
scene:
  kind: lattice
  focus: The superconductor's crystal, its defects pinning the magnetic field lines that hold the train up.
  params: { structure: perovskite, defects: 0.3 }
