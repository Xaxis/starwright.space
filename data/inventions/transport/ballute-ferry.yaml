id: ballute-ferry
title: The Ballute Ferry
domain: transport
for: [cislunar-transport]
pitch: >-
  A reusable tug that carries cargo to lunar orbit and comes home by skimming Earth's upper
  atmosphere behind an inflatable shield, so the trip back costs almost no propellant.
principle: >-
  Coming back from the Moon into low Earth orbit means losing about 3 km/s of speed. By rocket that
  costs as much propellant as a large part of the trip out. A pass through the thin upper atmosphere
  does the same work with drag and turns the speed into heat: in one deep pass (aerocapture) or many
  shallow ones (aerobraking). Japan's Hiten braked in Earth's air in 1991, and Mars orbiters have
  braked this way for decades. The Ferry is a tug with a stowed inflatable decelerator like NASA's
  LOFTID. Before each return it inflates the shield, makes one controlled pass at about 90 km to shed
  most of its speed, and then a short burn lifts its low point back into a parking orbit beside a
  depot, where it refuels and goes again. The shield is the only part that faces the heat, and it
  is a replaceable module.
buildsOn:
  - text: NASA's LOFTID, a 6 m inflatable heat shield, re-entered from orbit on 10 November 2022, planned at nearly 8 km/s, and was recovered from the Pacific, the largest blunt aeroshell ever to enter an atmosphere.
    url: https://www.nasa.gov/feature/nasa-inflatable-heat-shield-finds-strength-in-flexibility
    year: 2022
  - text: JAXA's Hiten made the first aerobraking manoeuvre by a deep-space probe on 19 March 1991, dipping into Earth's atmosphere at about 125 km.
    url: https://en.wikipedia.org/wiki/Hiten_(spacecraft)
    year: 1991
  - text: Mars Global Surveyor aerobraked on and off for 17 months from 1997 to reach its mapping orbit.
    url: https://mgs-mager.gsfc.nasa.gov/overview/aerobraking.html
    year: 1999
  - text: ULA's SMART plan, revealed in 2015, recovers a rocket's engine section behind an inflatable heat shield for reuse.
    url: https://en.wikipedia.org/wiki/Vulcan_Centaur
    year: 2015
  - text: Hall, Noca and Bailey's cost-benefit study of aerocapture found large payload gains for missions to Venus, Titan and Neptune (Journal of Spacecraft and Rockets, 2005).
    url: https://doi.org/10.2514/1.4118
    year: 2005
experiment:
  goal: Show that an inflatable decelerator can survive repeated heating at lunar-return conditions and be packed and inflated again between them.
  setup: >-
    Coupons and a 1 m section of a LOFTID-type stack, a flexible thermal blanket over inflated tori,
    go through ten heating cycles each in an arc-jet facility at the heat flux of a lunar-return
    aerocapture pass, packed and re-inflated between cycles.
  measure: Insulation loss and back-face temperature per cycle, leaks in the tori after each packing, and strap strength after the series.
  succeedsIf: The stack survives ten cycles at lunar-return heat flux with back-face temperatures inside limits and no leaks, enough for a shield rated for ten returns.
  costUsd: 3000000
  months: 12
path:
  - phase: bench
    what: Arc-jet cycling of the flexible shield.
    scale: Coupons and a 1 m section.
    proves: A reusable flexible shield.
  - phase: prototype
    what: A small tug sent to a high orbit on a rideshare, returning by aerocapture and inspected in orbit.
    scale: A 500 kg tug with a 6 m shield.
    proves: Aerocapture guidance and shield reuse in flight.
  - phase: pilot
    what: A tug carrying 10 tonnes from low orbit to lunar orbit and back three times.
    scale: One tug.
    proves: Round trips on less than half the propellant of an all-rocket tug.
  - phase: first-plant
    what: A fleet of Ferries based at a depot in low orbit, carrying cargo for the lunar bases.
    scale: Tens of trips a year.
    proves: Routine freight between Earth orbit and the Moon.
  - phase: fleet
    what: Ferries on every route that ends at a world with air, Earth, Mars, Venus and Titan.
    scale: Hundreds of tugs.
    proves: Atmospheres as free brakes.
  - phase: civilization
    what: Air-braked ferries and lunar oxygen make the trip between Earth orbit and the Moon nearly as cheap as reaching orbit.
    scale: The whole Earth and Moon economy.
    proves: Earth and the Moon joined by routine freight.
risks: >-
  Aerocapture at lunar-return speed is harsher than LOFTID's test, and a guidance error could send
  the tug too deep or skip it back out; the fallback is aerobraking over many shallow passes,
  slower but gentler, as Mars orbiters do. Packing again and again may wear the fabric, which is why
  the shield is a replaceable module. Upper-air density swings with solar activity, so guidance
  must adapt during the pass.
scene:
  kind: machine
  focus: A tug with its shield inflated, glowing as it skims Earth's upper air.
  params: { shape: vehicle, spin: 0.3 }
