# Measured numbers: what the world is today and what physics says. Each has its source and the
# words or table cell there that show the value. The model reads these; it never changes them.
# Gathered 2026-11-24; where a primary source refused automated reading, the row says whose
# wording is quoted.

# --- The scale ------------------------------------------------------------------------------------
type-1-power:
  label: Type I on Sagan's scale
  value: 1.0e16
  unit: W
  year: 1973
  source: https://arxiv.org/abs/1601.05112
  quote: "I would suggest Type 1.0 as a civilization using 10^16 watts for insterstellar (sic) communication; Type 1.1, 10^17 watts; Type 1.2, 10^18 watts, and so on."
  note: Sagan, The Cosmic Connection (1973), p. 234, as quoted by Cirkovic 2015. Sagan's rule is K = (log10 P - 6) / 10, with P in watts.
type-2-power:
  label: Type II on Sagan's scale
  value: 1.0e26
  unit: W
  year: 2020
  source: https://doi.org/10.3847/1538-3881/ab792b
  quote: "using the whole numbers 0 through 4 to denote 10^6, 10^16, 10^26, 10^36, and 10^46 W"
  note: Gray 2020, "The Extended Kardashev Scale", The Astronomical Journal 159, 228.
kardashev-1964-type-1:
  label: Type I as Kardashev defined it in 1964
  value: 4.0e12
  unit: W
  year: 1964
  source: https://arxiv.org/abs/1601.05112
  quote: "technological level close to the level presently attained on the earth, with energy consumption at ≈ 4 × 10^19 erg/sec"
  note: Kardashev 1964, Soviet Astronomy 8, 217, as quoted by Cirkovic 2015. Humanity passed it around 1955 to 1962; the ladder uses Sagan's scale.
kardashev-1964-type-2:
  label: Type II as Kardashev defined it in 1964
  value: 4.0e26
  unit: W
  year: 1964
  source: https://arxiv.org/abs/1601.05112
  quote: "a civilization capable of harnessing the energy radiated by its own star (for example, the stage of successful construction of a \"Dyson sphere\"...); energy consumption at ≈ 4 × 10^33 erg/sec."
jiang-2022-type-1-year:
  label: The year Jiang et al. expect humanity to reach Type I
  value: 2371
  unit: year
  year: 2022
  source: https://arxiv.org/abs/2204.07070
  quote: "the best estimate for this day will not come until year 2371"
  note: A projection of fossil, nuclear and renewable supply under environmental limits, all used on Earth.

